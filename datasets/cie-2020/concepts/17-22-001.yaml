data:
  definition:
  - content: membrane situated inside the back of the eye that is sensitive to {{17-22-125,
      light stimulus}}
    type: intensional
  examples: []
  notes:
  - content: 'The retina contains photoreceptors and nerve cells that interconnect
      and transmit to the optic nerve the signals resulting from stimulation of the
      photoreceptors. The photoreceptors in the human retina are of three types: {{17-22-003,
      rods}} and {{17-22-002, cones}}, which are responsible for vision, and intrinsically
      photosensitive retinal ganglion cells (ipRGCs), which play a role in controlling
      circadian and neuro-endocrine systems.'
    type: intensional
  - content: This entry was numbered 845-02-01 in IEC 60050-845:1987.
    type: intensional
