  definition:
  - content: quotient of the total {{17-21-043, photon number}} of all {{17-21-025,
      wavelength}}s emitted from a specimen by a fluorescent process for an {{17-24-020,
      excitation}} at {{17-21-025, wavelength}} <i>μ</i>, and the {{17-21-043, photon
      number}} of {{17-21-025, wavelength}} <i>μ</i> reflected from the {{17-24-060,
      perfect reflecting diffuser}} identically irradiated and viewed
    type: intensional
