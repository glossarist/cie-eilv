data:
  definition:
  - content: single electric component comprising principally at least one {17-27-051,
      LED die}
    type: intensional
  examples: []
  notes:
  - content: An LED package does not include the {17-28-057, control unit of the control
      gear}, does not include a {17-28-015, cap}, is not connected directly to the
      {17-27-118, supply voltage} and does not include active electronic components.
    type: intensional
  - content: An LED package is a discrete component and part of the {17-27-058, LED
      module} or {17-27-054, LED lamp}.
    type: intensional
  - content: |-
      An LED package can include one or more of the following:
      • optical elements;
      • light converters (phosphors);
      • thermal, mechanical, and electric interfaces;
      • components to address ESD concerns.
    type: intensional
  sources:
