data:
  definition:
  - content: |-
      density of incident {{17-21-037, luminous energy}} with respect to area at a point on a real or imaginary surface

      stem:[H_v = ((d Q_v))/((d A))]

      where stem:[Q_v] is luminous energy and stem:[A] is the area on which the luminous energy is incident
    type: intensional
  examples: []
  notes:
  - content: The term "light exposure" is no longer used.
    type: intensional
  - content: |-
      Luminous exposure can be derived from the spectral radiant exposure distribution by

      stem:[H_v \ = \ K_m int_0^(oo) H_((e , lambda)) ( lambda ) V ( lambda ) d lambda]

      where stem:[K_m] is maximum luminous efficacy, stem:[H_(e,lambda)](stem:[lambda]) is the spectral radiant exposure at wavelength stem:[lambda] and stem:[V](stem:[lambda]) is {{17-21-035, spectral luminous efficiency}}. Integral limits can be confined depending on the spectral {{17-25-061, responsivity}} of the detectors used as a sensor.
    type: intensional
  - content: The corresponding radiometric quantity is "radiant exposure". The corresponding
      quantity for photons is "photon exposure"
    type: intensional
  - content: The luminous exposure is expressed in lux second (lx·s = lm·s·m^−2^).
    type: intensional
  - content: This entry was numbered 845-01-43 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-736 in CIE S 017:2011.
    type: intensional
