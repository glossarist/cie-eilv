data:
  definition:
  - content: 'sum of the reflected spectral radiance factor, stem:[beta_R](stem:[lambda]), and the luminescent spectral radiance factor, stem:[beta_L](stem:[lambda])


      stem:[beta_T](stem:[lambda]) = stem:[beta_R](stem:[lambda]) + stem:[beta_L](stem:[lambda])'
    type: intensional
  examples: []
  notes:
  - content: For fluorescence colorimetric applications, it is implicit that the quantity used in the colorimetric calculations is the total radiance factor, and it is common to omit the subscript T.
    type: intensional
  - content: The total spectral radiance factor has unit one.
    type: intensional
  sources:
