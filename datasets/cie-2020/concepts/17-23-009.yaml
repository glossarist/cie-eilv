data:
  definition:
  - content: stimulus that, under the prevailing conditions of {{17-22-012, adaptation}},
      gives rise to an {{17-22-049, achromatic colour}}
    type: intensional
  examples: []
  notes:
  - content: In the {{17-25-014, colorimetry}} of {{17-22-042, object colour}}s, the
      {{17-23-002, colour stimulus}} produced by the {{17-24-060, perfect reflecting
      diffuser}} or {{17-24-061, perfect transmitting diffuser}} is usually considered
      to be an achromatic stimulus for all {{17-21-032, source}}s, except for those
      that appear to be highly chromatic.
    type: intensional
  - content: This entry was numbered 845-03-06 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-12 in CIE S 017:2011.
    type: intensional
