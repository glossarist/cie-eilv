data:
  definition:
  - content: distance of exposure from a lamp or lamp system
    type: intensional
  examples: []
  notes:
  - content: For lamp safety evaluations, the exposure distance is the nearest distance
      consistent with the application of the lamp or lamp system. For lamps radiating
      in all directions the distance is measured from the centre of the {{17-28-002,
      filament}} or arc source. For reflector-type lamps the distance is measured
      from the outside edge of the lens or the plane defining the end of the {{17-30-038,
      reflector}} in a lens-free {{17-30-038, reflector}}.
    type: intensional
  - content: The exposure distance is expressed in metres (m).
    type: intensional
  - content: This entry was numbered 17-414 in CIE S 017:2011.
    type: intensional
