data:
  definition:
  - content: radiant spherical exposure weighted with a stated photobiological action
      spectrum
    type: intensional
  examples: []
  notes:
  - content: This definition is based on the assumption that an action spectrum is
      adopted for the photobiological effect considered, and that its maximum value
      is 1.
    type: intensional
  - content: It is essential to specify which action spectrum is used, as the unit
      is the same for any action spectrum.
    type: intensional
  - content: The photobiological fluence is expressed in joule per square metre (J·m^−2^).
    type: intensional
  - content: This entry was numbered 17-883 in CIE S 017:2011.
    type: intensional
