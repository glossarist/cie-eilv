data:
  definition:
  - content: |-
      quotient of {17-21-041, radiant energy} and {17-21-042, photon energy}

      where <i>Q</i><sub>e</sub> is {17-21-041, radiant energy}, <i>h</i> is the {17-21-108, Planck constant}, and is the frequency of the corresponding electromagnetic wave
    type: intensional
  examples: []
  notes:
  - content: |-
      Photon number can also be expressed by the time integral of the {17-21-040, photon flux}, <i>Φ</i><sub>p</sub>, over a given duration, Δ<i>t</i>:
      <sub>.</sub>
    type: intensional
  - content: The photon number has unit one.
    type: intensional
