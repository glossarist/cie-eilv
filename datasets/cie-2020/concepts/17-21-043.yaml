data:
  definition:
  - content: |-
      quotient of radiant energy and photon energy

      stem:[N_p = ((Q_e))/((h nu))]

      where stem:[Q_e] is radiant energy, stem:[h] is the Planck constant, and stem:[nu] is the <<103-06-02, frequency>> of the corresponding electromagnetic wave
    type: intensional
  examples: []
  notes:
  - content: |-
      Photon number can also be expressed by the time integral of the photon flux, stem:[Phi_p], over a given duration, stem:[Delta t]:

      stem:[N_p = int_((Delta t)) Phi_p d t]
    type: intensional
  - content: The photon number has unit one.
    type: intensional
  - content: This entry was numbered 845-01-29 in IEC 60050-845:1987.
    type: intensional
