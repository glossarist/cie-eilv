data:
  definition:
  - content: 'completely overcast sky for which the quotient of its luminance, stem:[Lgamma], in the direction at an angle, stem:[gamma], above the horizon and its luminance, stem:[L_z], at the zenith is given by the relation


      stem:[((L_{gamma}))/((L_z)) = ((1 + 2 sin gamma))/(3)]'
    type: intensional
  examples: []
