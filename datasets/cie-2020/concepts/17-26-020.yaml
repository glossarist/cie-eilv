data:
  definition:
  - content: property of mobile organisms to move in response to light
    type: intensional
  examples: []
  notes:
  - content: For example, positive phototaxis involves movement (such as in swimming)
      towards a {17-21-032, source} of {17-21-002, optical radiation} and negative
      phototaxis away from such a {17-21-032, source}.
    type: intensional
