data:
  definition:
  - content: luminaire with special protection against ingress of dust, moisture or
      water
    type: intensional
  examples: []
  notes:
  - content: 'IEC 60598-1, _Luminaires - Part 1: General requirements and tests_ considers,
      amongst others, the following types of protected luminaires: dust-proof luminaire,
      dust-tight luminaire, drip-proof luminaire, splash-proof luminaire, rain-proof
      luminaire, jet-proof luminaire, watertight luminaire.'
    type: intensional
