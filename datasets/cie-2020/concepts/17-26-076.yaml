data:
  definition:
  - content: real or virtual object that forms the smallest possible retinal image
      (considering the {17-22-086, accommodation} range of the human eye) for a given
      evaluation location of the retinal hazard
    type: intensional
  examples: []
  notes:
  - content: The {17-22-086, accommodation} range of the eye is assumed to be variable
      from 100 mm to infinity. The location of the apparent source for a given viewing
      position in the beam is that location to which the eye accommodates to produce
      the most hazardous retinal {17-21-053, irradiance} condition.
    type: intensional
  - content: This definition is used to determine, for a given evaluation position,
      the location of the apparent origin of {17-27-136, laser} radiation in the {17-21-025,
      wavelength} range of 380 nm to 1 400 nm. In the limit of vanishing divergence,
      i.e. in the case of a well-collimated beam, the location of the apparent source
      goes to infinity.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
