data:
  definition:
  - content: luminaire that distributes light over a comparatively wide solid angle
    type: intensional
  examples: []
  notes:
  - content: In contrast with wide angle luminaires, the term "narrow angle luminaire"
      is not defined since practically these are {{17-30-030, projectors}}.
