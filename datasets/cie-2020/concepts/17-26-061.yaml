data:
  definition:
  - content: |-
      quotient of {{17-26-055, blue light hazard}} weighted {{17-21-038, radiant flux}}, <i>Φ</i><sub>B</sub>, and {{17-21-039, luminous flux}}, <i>Φ</i><sub>v</sub>

      where <i>λ</i> is {{17-21-025, wavelength}}, <i>Φ</i><sub>e,</sub><i><sub>λ</sub></i>(<i>λ</i>) is spectral radiant flux, <i>B</i>(<i>λ</i>) is the {{17-26-060, blue light hazard spectral weighting function}}, <i>V</i>(<i>λ</i>) is the CIE {{17-21-035, spectral luminous efficiency}} function for {{17-22-016, photopic vision}}, and <i>K</i><sub>m</sub> is {{17-21-092, maximum luminous efficacy}} (≈ 683 lm·W<sup>−1</sup>)
    type: intensional
  examples: []
  notes:
  - content: The term "luminous radiation" refers to {{17-21-002, optical radiation}}
      weighted with the CIE {{17-21-035, spectral luminous efficiency}} function for
      {{17-22-016, photopic vision}}, <i>V</i>(<i>λ</i>).
    type: intensional
  - content: The use of this term is only reasonable if parts of the {{17-21-002,
      optical radiation}} are in the visible range and thus <i>Φ</i><sub>v</sub> ≠
      0.
    type: intensional
  - content: The blue light hazard efficacy of luminous radiation is expressed in
      watt per lumen (W·lm<sup>−1</sup>), possibly with a metric prefix.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
