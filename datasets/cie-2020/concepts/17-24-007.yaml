data:
  definition:
  - content: |-
      relation between the {17-21-080, radiant exitance}, <i>M</i><sub>e</sub>, of a {17-24-004, Planckian radiator} and its temperature, <i>T</i>, given by
      <i>M</i><sub>e</sub> = <i>σ</i> <i>T</i> <sup>4


      </sup>where <i>σ</i> is the Stefan–Boltzmann constant and <i>T</i> is the thermodynamic temperature
    type: intensional
  examples: []
  notes:
  - content: The Stefan–Boltzmann constant can be calculated by where <i>h</i> is
      the {17-21-108, Planck constant}, <i>c</i><sub>0</sub> is the speed of light
      in vacuum, and <i>k</i> is the Boltzmann constant.
    type: intensional
  - content: For the value of the Stefan–Boltzmann constant, <i>σ</i>, see CODATA.
    type: intensional
