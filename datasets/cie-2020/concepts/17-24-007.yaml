data:
  definition:
  - content: |-
      relation between the {{17-21-080, radiant exitance}}, stem:[M_e], of a Planckian radiator and its temperature, stem:[T], given by

      stem:[M_e] = stem:[sigma] stem:[T^4]

      where stem:[sigma] is the Stefan-Boltzmann constant and stem:[T] is the thermodynamic temperature
    type: intensional
  examples: []
  notes:
  - content: The Stefan-Boltzmann constant can be calculated by stem:[sigma = ((2
      pi^5 k^4))/((15 h^3 c_0^2))] where stem:[h] is the Planck constant, stem:[c_0]
      is the <<113-01-34, speed of light in vacuum>>, and stem:[k] is the Boltzmann
      constant.
    type: intensional
  - content: For the value of the Stefan-Boltzmann constant, stem:[sigma,] see CODATA.
    type: intensional
  - content: This entry was numbered 845-04-07 in IEC 60050-845:1987.
    type: intensional
