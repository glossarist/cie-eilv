data:
  definition:
  - content: irradiation of reflecting materials at 45stem:[deg] to the normal, from all azimuthal directions, simultaneously
    type: intensional
  examples: []
  notes:
  - content: In measuring the colours of reflecting samples by irradiating with the forty-five degree annular geometry, the effects of texture and directionality are minimized. The forty-five degree annular geometry can be achieved by the use of a small source and an elliptic ring reflector or other aspheric optics.
    type: intensional
  - content: Forty-five degree annular geometry is sometimes approximated by the use of a number of sources in a ring or a number of fibre bundles illuminated by a single source and terminated in a ring. Such an approximation to annular geometry is called "circumferential geometry", with notation "45stem:[deg]c".
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-469, 17-469}} in CIE S 017:2011.
    type: intensional
