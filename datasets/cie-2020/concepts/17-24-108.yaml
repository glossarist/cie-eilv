data:
  definition:
  - content: process by which the direction of propagation of an {{bib:121-11-63,
      electromagnetic wave}} is changed as a result of changes in its velocity of
      propagation in passing through an optically non-homogeneous medium, or in crossing
      a surface separating media with different refractive indexes
    type: intensional
