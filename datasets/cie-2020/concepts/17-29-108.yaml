data:
  definition:
  - content: quotient of the vertical {17-29-106, optical thickness} of a real turbid
      atmosphere and the vertical {17-29-106, optical thickness} of the pure and dry
      atmosphere (Rayleigh atmosphere), related to the visible part of the solar spectrum
    type: intensional
  examples: []
  notes:
  - content: |-
      The luminous turbidity factor can be expressed by
      <sub>


      </sub>where <i>E</i><sub>vs</sub> is the direct-beam {17-21-060, illuminance} on a horizontal surface (at the ground), <i>E</i><sub>v</sub> is the extraterrestrial {17-21-061, horizontal illuminance}, <i>a</i><sub>v</sub> is the {17-21-106, luminous extinction coefficient}, and <i>m</i> is the {17-29-109, relative optical air mass}.
    type: intensional
  - content: The luminous turbidity factor has unit one.
    type: intensional
  - content: This entry was numbered 17-743 in CIE S 017:2011.
    type: intensional
