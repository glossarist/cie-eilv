data:
  definition:
  - content: quotient of the light reflected by the surfaces of a room after a certain
      <a href="http://std.iec.ch/iev/iev.nsf/display?openform&ievref=113-01-10">time
      interval</a> and light reflected when the installation is considered conventionally
      as new
    type: intensional
  examples: []
  notes:
  - content: The room surface maintenance factor has unit one.
    type: intensional
  - content: to entry:´ The room surface maintenance factor is based on a simplified
      model for the effects of the deterioration of room surface {{17-24-064, reflectance}}
      properties and does not accurately account for room geometry and configuration.
    type: intensional
  - content: This entry was numbered 17-1122 and 17-1125 in CIE S 017:2011.
    type: intensional
