data:
  definition:
  - content: colour stimulus that an observer who is adapted to the viewing environment
      would judge to be perfectly achromatic and to have a luminance factor of unity
    type: intensional
  examples: []
  notes:
  - content: The colour stimulus that is considered to be the adapted white can be
      different at different locations within a scene.
    type: intensional
  - content: This entry was numbered 17-21 and 17-1427 in CIE S 017:2011.
