data:
  definition:
  - content: "{{17-21-050, luminance}} of a {{17-21-032, source}} which, when viewed
      with the natural pupil, produces the same {{17-22-010, conventional retinal
      illuminance}} as that {{17-21-032, source}} viewed with a specified artificial
      pupil"
    type: intensional
  examples: []
  notes:
  - content: The natural pupil luminance is expressed in candela (cd), candela per
      square metre times square millimetre (cd⋅m<sup>−2</sup>⋅mm<sup>2</sup>), or
      troland.
    type: intensional
  - content: This entry was numbered 17-802 in CIE S 017:2011.
    type: intensional
