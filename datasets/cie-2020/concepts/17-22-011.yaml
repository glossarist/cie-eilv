data:
  definition:
  - content: luminance of a source which, when viewed with the natural pupil, produces the same conventional retinal illuminance as that source viewed with a specified artificial pupil
    type: intensional
  examples: []
  notes:
  - content: The natural pupil luminance is expressed in candela (cd), candela per square metre times square millimetre stem:[cd cdot m^(-2) cdot mm^(2)], or {{concept:cie-2020:17-22-038, troland}}.
    type: intensional
