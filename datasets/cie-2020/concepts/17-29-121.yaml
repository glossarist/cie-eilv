data:
  definition:
  - content: quotient of the {17-21-060, illuminance} at a point on a given plane
      due to the light received directly and indirectly from a sky of assumed or known
      {17-21-050, luminance} distribution and the {17-21-060, illuminance} on a horizontal
      plane due to an unobstructed hemisphere of this sky, where the contribution
      of direct {17-29-103, sunlight} to both {17-21-060, illuminance}s is excluded
    type: intensional
  examples: []
  notes:
  - content: Glazing, dirt effects, etc. are included.
    type: intensional
  - content: When calculating the {17-29-001, lighting} of interiors, the contribution
      of direct {17-29-103, sunlight} has to be considered separately.
    type: intensional
  - content: The daylight factor has unit one.
    type: intensional
  - content: This entry was numbered 845-09-97 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-279 in CIE S 017:2011.
    type: intensional
