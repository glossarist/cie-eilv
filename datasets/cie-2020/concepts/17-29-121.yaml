data:
  definition:
  - content: quotient of the illuminance at a point on a given plane due to the light received directly and indirectly from a sky of assumed or known luminance distribution and the illuminance on a horizontal plane due to an unobstructed hemisphere of this sky, where the contribution of direct sunlight to both illuminances is excluded
    type: intensional
  examples: []
  notes:
  - content: Glazing, dirt effects, etc. are included.
    type: intensional
  - content: When calculating the {{concept:cie-2020:17-29-001, lighting}} of interiors, the contribution of direct sunlight has to be considered separately.
    type: intensional
  - content: The daylight factor has unit one.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-09-97, 845-09-97}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-279, 17-279}} in CIE S 017:2011.
    type: intensional
