data:
  definition:
  - content: plane diagram in which points specified by chromaticity coordinates represent
      the chromaticities of colour stimuli
    type: intensional
  examples: []
  notes:
  - content: In the CIE standard colorimetric systems, stem:[y] is normally plotted
      as ordinate and stem:[x] as abscissa, to obtain an stem:[x], stem:[y] chromaticity
      diagram.
    type: intensional
