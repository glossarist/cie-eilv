data:
  definition:
  - content: quotient of the flux, <i>Φ</i><sub>i</sub>, indirectly reaching a surface
      in a cavity, and the primary flux, <i>Φ</i><sub>o </sub>, directly received
      by another surface, the flux <i>Φ</i><sub>i</sub> resulting from the interreflection
      undergone by the flux <i>Φ</i><sub>o</sub>
  notes:
  - content: The interreflection ratio has unit one.
  - content: This entry was numbered 845-09-75 in IEC 60050-845:1987.
  - content: This entry was numbered 17-600 in CIE S 017:2011.
