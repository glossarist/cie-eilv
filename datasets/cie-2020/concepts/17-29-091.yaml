data:
  definition:
  - content: quotient of the flux, stem:[Phi_i], indirectly reaching a surface in
      a cavity, and the primary flux, stem:[Phi_o], directly received by another surface,
      the flux stem:[Phi_i] resulting from the interreflection undergone by the flux
      stem:[Phi_o]
    type: intensional
  examples: []
  notes:
