data:
  definition:
  - content: property of a material or substance by which objects can be seen clearly
      through that material or substance
    type: intensional
  examples: []
  notes:
  - content: Transparency is distinct from {17-24-131, clarity} in that transparency
      is related to the amount of light transmitted through a medium whereas {17-24-131,
      clarity} relates to the ability to resolve an object that is seen through the
      medium. Tinted glass is an example of a material that has low transparency but
      high {17-24-131, clarity}.
    type: intensional
  sources:
