data:
  definition:
  - content: |-
      temperature of the Planckian radiator whose {{concept:cie-2020:17-21-030, relative spectral distribution}}, stem:[S](stem:[lambda]) is the same or nearly the same as that of the radiation considered in the spectral range of interest for which the following integral is minimized by adjustment of stem:[a] and stem:[T]:

      stem:[int_((lambda_1))^((lambda_2)) 1 - ((S_t ( lambda )))/((a S_b ( lambda , T )))^2 d lambda]

      where stem:[lambda] is the wavelength, stem:[S_t](stem:[lambda]) is the {{concept:cie-2020:17-21-030, relative spectral distribution}} of the radiation being considered, stem:[S_b](stem:[lambda], stem:[T]) is the relative spectral distribution of the Planckian radiator at temperature stem:[T], and stem:[a] is a scaling factor
    type: intensional
  examples: []
  notes:
  - content: |-
      The scaling factor stem:[a] is chosen to make the quotient stem:[((S_t ( lambda )))/((S_b ( lambda , T )))] equal to unity at a convenient wavelength which, in photometry and colorimetry is typically 560 nm.

      stem:[S_b ( lambda , T ) = ((P ( lambda , T )))/((P ( 560 nm , T )))]

      with stem:[P ( lambda , T ) = lambda^(- 5) ( e^(((c_2))/((lambda T))) - 1 )^(- 1)], where stem:[c_2] is the second radiation constant.
    type: intensional
  - content: Distribution temperature is a meaningful characteristic for radiators
      having a {{concept:cie-2020:17-21-030, relative spectral distribution}} similar
      to that of a Planckian radiator, but only if calculated for an expanded wavelength
      range and for radiation whose {{concept:cie-2020:17-21-029, spectral distribution}}
      of radiant flux is a continuous function of wavelength in that range.
    type: intensional
  - content: In photometry and colorimetry the wavelength range set by stem:[lambda_1]
      and stem:[lambda_2] is the visible spectral range, and in these cases the range
      from at least stem:[lambda_1] = 400 nm to stem:[lambda_2] = 750 nm is recommended.
    type: intensional
  - content: In practice, the integral is replaced by a summation. For {{concept:cie-2020:17-27-011,
      incandescent lamps}}, equally spaced wavelength intervals of 10 nm will usually
      suffice. All values in the summation are treated with equal weight.
    type: intensional
  - content: The distribution temperature is expressed in kelvin (K).
    type: intensional
  - content: For further information, see CIE 114-1994, _CIE Collection in Photometry
      and Radiometry – 114/4 Distribution Temperature and Ratio Temperature_.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-14, 845-04-14}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-341 in CIE S 017:2011.
    type: intensional
