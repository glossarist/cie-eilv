data:
  definition:
  - content: detector for which the output is proportional to the input over a specified range, so that the responsivity of the detector is constant over that range
    type: intensional
  examples: []
  notes:
  - content: A detector is usually linear only over a certain limited range of input levels. The range should be specified.
    type: intensional
  - content: The linear range of a detector can be affected by the use of unsuitable electronic circuitry.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-683, 17-683}} in CIE S 017:2011.
    type: intensional
