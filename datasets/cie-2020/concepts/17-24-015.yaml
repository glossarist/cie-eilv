data:
  definition:
  - content: optical device that modifies a beam of {{concept:cie-2020:17-21-002, optical radiation}} to produce a beam of {{concept:cie-2020:17-21-021, unpolarized radiation}} irrespective of the state of polarization of the incident radiation
    type: intensional
  examples: []
  notes:
  - content: No simple and completely satisfactory way of depolarizing a beam of radiation is known. The methods employed usually produce a large variety of polarization states with respect to time, wavelength or the aperture of the beam. Devices functioning on this principle are usually known as pseudo-depolarizers.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-292, 17-292}} in CIE S 017:2011.
    type: intensional
