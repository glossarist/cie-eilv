data:
  definition:
  - content: "{{17-21-049, radiance}} in a given direction that results from {{17-24-001,
      emission}} at the surface of a photoluminescent medium under specified conditions
      of {{17-21-099, irradiation}} compared to the {{17-21-049, radiance}} in the
      same direction by the {{17-24-060, perfect reflecting diffuser}} identically
      irradiated"
    type: intensional
  examples: []
  notes:
  - content: The luminescent radiance factor depends upon the spectral power distribution
      of the {{17-21-099, irradiation}} and this quantity is typically specified for
      a given {{17-23-019, CIE illuminant}} condition.
    type: intensional
  - content: The luminescent radiance factor has unit one.
    type: intensional
  - content: This entry was numbered 17-724 in CIE S 017:2011.
    type: intensional
