data:
  definition:
  - content: radiance in a given direction that results from emission at the surface of a photoluminescent medium under specified conditions of irradiation compared to the radiance in the same direction by the perfect reflecting diffuser identically irradiated
    type: intensional
  examples: []
  notes:
  - content: The luminescent radiance factor depends upon the spectral power distribution of the irradiation and this quantity is typically specified for a given CIE illuminant condition.
    type: intensional
  - content: The luminescent radiance factor has unit one.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-724, 17-724}} in CIE S 017:2011.
    type: intensional
