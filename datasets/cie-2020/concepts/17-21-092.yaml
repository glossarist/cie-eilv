data:
  definition:
  - content: maximum value of {{17-21-091, spectral luminous efficacy}} for a specified
      photometric condition
    type: intensional
  examples: []
  notes:
  - content: The photometric condition should be specified (e.g. photopic, scotopic,
      mesopic). If it is not specified, photopic vision is assumed and the symbol
      stem:[K_m] is used. For other photometric conditions, the respective symbol
      for identification shall be used.
    type: intensional
  - content: |-
      The value of maximum luminous efficacy for photopic vision is calculated by

      stem:[K_m = ((683))/((V ( lambda_((cd)) ))) cd * sr * W^(- 1) tildetilde 683 \ lm * W^(- 1)]

      where stem:[V](stem:[lambda]) is the {{17-21-035, spectral luminous efficiency}} for photopic vision and stem:[lambda_(cd)] is the wavelength in air corresponding to the <<103-06-02, frequency>> 540 × 10^12^ Hz specified in the definition of the SI unit candela.
    type: intensional
  - content: The maximum luminous efficacy is expressed in lumen per watt (lm·W^−1^).
    type: intensional
  sources:
