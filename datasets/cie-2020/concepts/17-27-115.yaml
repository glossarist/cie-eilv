data:
  definition:
  - content: |-
      relative amplitude of the periodic fluctuation of the luminous flux as calculated by the ratio of the difference between the maximum and the minimum instantaneous luminous flux, stem:[Phi_(max)] and stem:[Phi_(min)] respectively, to the sum of both of these values:

      stem:[((Phi_((max)) - Phi_((min))))/((Phi_((max)) + Phi_((min))))]
    type: intensional
  examples: []
  notes:
  - content: The amplitude of fluctuation can be applied also for "luminance" and
      "illuminance". Additional photometric quantities can be used.
    type: intensional
  - content: The amplitude of fluctuation of the luminous flux has unit one and is
      usually expressed in per cent (%).
    type: intensional
  - content: This entry was numbered 845-07-66 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-39 in CIE S 017:2011.
    type: intensional
