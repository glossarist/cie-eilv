data:
  definition:
  - content: 'relative amplitude of the periodic fluctuation of the {{17-21-039, luminous
      flux}} as calculated by the ratio of the difference between the maximum and
      the minimum instantaneous {{17-21-039, luminous flux}}, <i>Φ</i><sub>max</sub>
      and <i>Φ</i><sub>min</sub> respectively, to the sum of both of these values:'
    type: intensional
  examples: []
  notes:
  - content: The amplitude of fluctuation can be applied also for "{{17-21-050, luminance}}"
      and "{{17-21-060, illuminance}}". Additional photometric quantities can be used.
    type: intensional
  - content: The amplitude of fluctuation of the luminous flux has unit one and is
      usually expressed in per cent (%).
    type: intensional
  - content: This entry was numbered 845-07-66 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-39 in CIE S 017:2011.
    type: intensional
