data:
  definition:
  - content: mean value of irradiance on the outer curved surface of a very small (real or imaginary) cylinder that is oriented vertically at a point in space
    type: intensional
  examples: []
  notes:
  - content: 'Cylindrical irradiance is sometimes also defined as arithmetic mean of the vertical irradiance stem:[E_(e,v)] at a point


      stem:[E_((e ,c)) = (1)/((2 pi)) int_0^((2 pi)) E_((e ,v)) d phi]


      where stem:[E_(e,v)] is the vertical irradiance for an area element with its normal in the direction stem:[phi], and stem:[phi] is the angle in the plane perpendicular to the axis of the cylinder.'
    type: intensional
  - content: The corresponding photometric quantity is "cylindrical illuminance". The corresponding quantity for photons is "photon cylindrical irradiance".
    type: intensional
  - content: The cylindrical irradiance is expressed in watt per square metre (Wcdotm^-2^).
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-41, 845-01-41}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-274 in CIE S 017:2011.
    type: intensional
