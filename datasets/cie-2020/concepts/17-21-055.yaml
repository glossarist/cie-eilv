data:
  definition:
  - content: mean value of {17-21-053, irradiance} on the outer curved surface of
      a very small (real or imaginary) cylinder that is oriented vertically at a point
      in space
    type: intensional
  examples: []
  notes:
  - content: |-
      Cylindrical irradiance is sometimes also defined as arithmetic mean of the vertical irradiance <i>E</i><sub>e,v</sub> at a point

      where <i>E</i><sub>e,v</sub> is the vertical irradiance for an area element with its normal in the direction <i>φ</i>, and <i>φ</i> is the angle in the plane perpendicular to the axis of the cylinder.
    type: intensional
  - content: The corresponding photometric quantity is "{17-21-063, cylindrical illuminance}".
      The corresponding quantity for photons is "{17-21-069, photon cylindrical irradiance}".
    type: intensional
  - content: The cylindrical irradiance is expressed in watt per square metre (W·m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 845-01-41 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-274 in CIE S 017:2011.
    type: intensional
