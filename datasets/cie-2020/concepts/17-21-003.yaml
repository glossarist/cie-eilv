data:
  definition:
  - content: "{{17-21-002, optical radiation}} capable of causing a {{17-22-083, visual
      sensation}} directly"
    type: intensional
  examples: []
  notes:
  - content: There are no precise limits for the spectral range of visible radiation
      since they depend upon the amount of {{17-21-038, radiant flux}} reaching the
      {{17-22-001, retina}} and the responsivity of the observer. The lower limit
      is generally taken between 360 nm and 400 nm and the upper limit between 760
      nm and 830 nm.
    type: intensional
  - content: This entry was numbered 845-01-03 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1402 in CIE S 017:2011.
    type: intensional
