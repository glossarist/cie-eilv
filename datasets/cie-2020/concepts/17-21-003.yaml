data:
  definition:
  - content: "{{17-21-002, optical radiation}} capable of causing a visual sensation
      directly"
    type: intensional
  examples: []
  notes:
  - content: There are no precise limits for the spectral range of visible radiation
      since they depend upon the amount of radiant flux reaching the retina and the
      responsivity of the observer. The lower limit is generally taken between 360 nm
      and 400 nm and the upper limit between 760 nm and 830 nm.
    type: intensional
  - content: This entry was numbered {{cite:845-01-03, 845-01-03}} in IEC 60050-845:1987.
    type: intensional
