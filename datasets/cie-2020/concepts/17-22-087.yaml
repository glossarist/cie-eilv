data:
  definition:
  - content: lowest luminance of a stimulus which enables it to be perceived
    type: intensional
  examples: []
  notes:
  - content: The value of the luminance threshold depends on field size, surround,
      state of adaptation, methodology, and other viewing conditions.
    type: intensional
  - content: The luminance threshold is expressed in candela per square metre (cd·m^−2^).
    type: intensional
