data:
  definition:
  - content: mean value of illuminance on the outer curved surface of a very small
      (real or imaginary) sphere at a point in space
    type: intensional
  examples: []
  notes:
  - content: |-
      The spherical illuminance can be expressed by

      stem:[E_((v,o)) = underset((4 pi))( int ) L_v d omega]

      where stem:[Omega] is solid angle and stem:[L_v] is luminance.
    type: intensional
  - content: The spherical illuminance is the quotient of the luminous flux of all
      the light incident on the outer surface of an infinitely small sphere centred
      at the given point and the area of the diametrical cross-section of that sphere.
    type: intensional
  - content: The analogous quantities "{{17-21-054, spherical irradiance}}", stem:[E_(e,o)],
      and "{{17-21-059, photon spherical irradiance}}" (also termed "photon fluence
      rate"), stem:[E_(p,o)], are defined in a similar way, replacing {{17-21-050,
      luminance}}, stem:[L_v], by {{17-21-049, radiance}}, stem:[L_e], and photon
      radiance, stem:[L_p], respectively.
    type: intensional
  - content: The spherical illuminance is expressed in lux (lx = lm·m^−2^).
    type: intensional
  - content: This entry was numbered 17-1244 in CIE S 017:2011.
    type: intensional
