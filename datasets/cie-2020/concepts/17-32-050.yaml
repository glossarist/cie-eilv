data:
  definition:
  - content: attribute of a {17-32-013, colour image encoding} indicating the kind
      of image condition inherent in {17-32-009, colour image data} values prepared
      and represented in that encoding
    type: intensional
  examples: []
  notes:
  - content: "{17-32-009, colour image data} are referred to a particular image condition
      through image capture, digitization, {17-22-107, colour rendering} and {17-32-017,
      colour re-rendering} processes."
    type: intensional
  - content: Typical image states are scene-referred, original-referred, output-referred
      and picture-referred.
    type: intensional
  - content: This entry was numbered 17-563 in CIE S 017:2011.
    type: intensional
