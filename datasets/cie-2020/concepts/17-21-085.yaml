data:
  definition:
  - content: SI unit of illuminance
    type: intensional
  examples: []
  notes:
  - content: 1 lx is equal to the illuminance produced on a surface of area 1 m^2^
      by a luminous flux of 1 lm uniformly distributed over that surface.
    type: intensional
  - content: |-
      Non-metric, non-SI units: lumen per square foot (symbol: lm·ft^−2^), footcandle (symbol: fc):

      1 lm·ft^−2^ = 1 fc = 10,764 lx.
    type: intensional
