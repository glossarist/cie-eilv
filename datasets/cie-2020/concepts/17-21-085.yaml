data:
  definition:
  - content: SI unit of {17-21-060, illuminance}
    type: intensional
  examples: []
  notes:
  - content: 1 lx is equal to the {17-21-060, illuminance} produced on a surface of
      area 1 m<sup>2</sup> by a {17-21-039, luminous flux} of 1 lm uniformly distributed
      over that surface.
    type: intensional
  - content: |-
      Non-metric, non-SI units: lumen per square foot (symbol: lm·ft<sup>−2</sup>), footcandle (symbol: fc):
      1 lm·ft<sup>−2</sup> = 1 fc = 10,764 lx.
    type: intensional
  - content: This entry was numbered 845-01-52 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-744 in CIE S 017:2011.
    type: intensional
