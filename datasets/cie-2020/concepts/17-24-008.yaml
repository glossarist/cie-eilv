data:
  definition:
  - content: quotient of the radiance of a thermal radiator in a given direction and
      the radiance of a Planckian radiator at the same temperature
    type: intensional
  examples: []
  notes:
  - content: The symbols stem:[theta], stem:[phi] are chosen here as an example of
      the angular coordinates defining the given direction.
    type: intensional
  - content: The directional emissivity has unit one.
    type: intensional
  - content: This entry was numbered 845-04-08 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-328 in CIE S 017:2011.
