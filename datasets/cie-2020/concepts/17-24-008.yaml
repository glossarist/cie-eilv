data:
  definition:
  - content: quotient of the {17-21-049, radiance} of a {17-24-003, thermal radiator}
      in a given direction and the {17-21-049, radiance} of a {17-24-004, Planckian
      radiator} at the same temperature
    type: intensional
  examples: []
  notes:
  - content: The symbols <i>θ</i>, <i>φ</i> are chosen here as an example of the angular
      coordinates defining the given direction.
    type: intensional
  - content: The directional emissivity has unit one.
    type: intensional
  - content: This entry was numbered 845-04-08 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-328 in CIE S 017:2011.
    type: intensional
