data:
  definition:
  - content: illuminance averaged over a specified surface
    type: intensional
  examples: []
  notes:
  - content: When stating the average illuminance it is necessary to provide a clear indication of the type of illuminance at the points of the surface, i.e. horizontal, vertical, spherical, cylindrical or semi-cylindrical.
    type: intensional
  - content: The average illuminance is expressed in lux stem:[lx = lm cdot m^(-2)].
    type: intensional
  - content: This entry was numbered 17-63 in CIE S 017:2011.
    type: intensional
