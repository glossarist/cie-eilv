data:
  definition:
  - content: ratio of the luminous flux of an electric light source at a given time in its operational life to its initial luminous flux, the electric light source being operated under specified conditions
    type: intensional
  examples: []
  notes:
  - content: In IEC standards, "lumen maintenance" is also commonly used with the same meaning.
    type: intensional
  - content: The luminous flux maintenance factor has unit one and is usually expressed in per cent.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: luminous flux maintenance factor
    usage_info: of an electric light source
  - type: expression
    normative_status: preferred
    designation: lumen maintenance factor, <of an electric light source>
