data:
  definition:
  - content: time integral of the blue light hazard radiance, <i>L</i><sub>B</sub>,
      as integrated with respect to the {{17-26-071, exposure duration}}
    type: intensional
  examples: []
  notes:
  - content: This definition is based on the assumption that an {{17-26-027, action
      spectrum}} is adopted for the {{17-26-003, actinic}} effect considered, and
      that its maximum value is 1.
    type: intensional
  - content: It is essential to specify which actinic {{17-26-027, action spectrum}}
      is used, as the unit is the same for any {{17-26-027, action spectrum}}.
    type: intensional
  - content: See also "{{17-21-067, radiance dose}}".
    type: intensional
  - content: The blue light hazard radiance dose is expressed in joule per square
      metre per steradian (J·m<sup>−2</sup>⋅sr<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 17-100 and 17-103 in CIE S 017:2011.
    type: intensional
