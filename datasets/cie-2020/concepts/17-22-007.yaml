data:
  definition:
  - content: central region of the {{17-22-006, fovea}} which contains no blood vessels
      in the inner retinal layers
    type: intensional
  examples: []
  notes:
  - content: The foveola subtends an angle of about 0,017 rad (1º) in the {{17-22-081,
      field of vision}}.
    type: intensional
  - content: The central area of the foveola, subtending an angle of about 0,003 rad
      (0,2º), contains no blue {{17-22-002, cones}}.
    type: intensional
