data:
  definition:
  - content: physical arrangement of contiguous detector elements to sense locally resolved signals
    type: intensional
  examples: []
  notes:
  - content: A typical application of an array detector is to sense the local resolved output of a polychromator.
    type: intensional
  - content: In some cases, optical components can form a part of the array as in, for example, a fibre optics faceplate coupled array detector.
    type: intensional
