data:
  definition:
  - content: |-
      density of {{17-21-046, photon intensity}} with respect to projected area in a specified direction at a specified point on a real or imaginary surface

      where <i>I</i><sub>p</sub> is {{17-21-046, photon intensity}}, <i>A</i> is area and <i>α</i> the angle between the normal to the surface at the specified point and the specified direction
    type: intensional
  examples: []
  notes:
  - content: |-
      In a practical sense, the definition of photon radiance can be thought of as dividing a real or imaginary surface into an infinite number of infinitesimally small surfaces which can be considered as {{17-21-033, point source}}s, each of which has a specific {{17-21-046, photon intensity}}, <i>I</i><sub>p</sub>, in the specified direction. The photon radiance of the surface is then the integral of these photon radiance elements over the whole surface.
      The equation in the definition can mathematically be interpreted as a derivative (i.e. a rate of change of {{17-21-046, photon intensity}} with projected area) and could alternatively be rewritten in terms of the average {{17-21-046, photon intensity}}, , as:

      Hence, photon radiance is often considered as a quotient of averaged quantities; the area, <i>A</i>, should be small enough so that uncertainties due to variations in {{17-21-046, photon intensity}} within that area are negligible; otherwise, the quotient gives the average photon radiance and the specific measurement conditions have to be reported with the result.
    type: intensional
  - content: For a surface being irradiated, an equivalent formula in terms of {{17-21-058,
      photon irradiance}}, <i>E</i><sub>p</sub>, and {{17-21-109, solid angle}}, <i>Ω</i>,
      is , where <i>θ</i> is the angle between the normal to the surface being irradiated
      and the direction of {{17-21-099, irradiation}}. This form is useful when the
      {{17-21-032, source}} has no surface (e.g. the sky, the plasma of a discharge).
    type: intensional
  - content: An equivalent formula is , where <i>Φ</i><sub>p</sub> is {{17-21-040,
      photon flux}} and <i>G</i> is {{17-21-047, geometric extent}}.
    type: intensional
  - content: "{{17-21-040, photon flux}} can be obtained by integrating photon radiance
      over projected area, <i>A</i>⋅cos <i>α</i>, and {{17-21-109, solid angle}},
      <i>Ω</i>:"
    type: intensional
  - content: Since the {{17-21-048, optical extent}}, expressed by <i>G</i>⋅<i>n</i><sup>2</sup>,
      where <i>G</i> is {{17-21-047, geometric extent}} and <i>n</i> is {{17-24-109,
      refractive index}}, is invariant, the quantity expressed by <i>L</i><sub>p</sub>⋅<i>n</i><sup>−2</sup>
      is also invariant along the path of the beam if the losses by {{17-24-081, absorption}},
      {{17-24-047, reflection}} and diffusion are taken as 0. That quantity is called
      "basic photon radiance".
    type: intensional
  - content: |-
      The equation in the definition can also be described as a function of {{17-21-040, photon flux}}, <i>Φ</i><sub>p</sub>. In this case, it is mathematically interpreted as a second partial derivative of the {{17-21-040, photon flux}} at a specified point (<i>x</i>, <i>y</i>) in space in a specified direction (<i>ϑ</i>, <i>φ</i>) with respect to projected area, <i>A</i>⋅cos <i>α</i>, and {{17-21-109, solid angle}}, <i>Ω</i>,

      where <i>α</i> is the angle between the normal to that area at the specified point and the specified direction.
    type: intensional
  - content: The corresponding radiometric quantity is "{{17-21-049, radiance}}".
      The corresponding photometric quantity is "{{17-21-050, luminance}}".
    type: intensional
  - content: The photon radiance is expressed in second to the power minus one per
      square metre per steradian (s<sup>−1</sup>·m<sup>−2</sup>·sr<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 845-01-36 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-931 in CIE S 017:2011.
    type: intensional
