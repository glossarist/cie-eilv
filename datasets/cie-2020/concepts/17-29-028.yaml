data:
  definition:
  - content: lighting integrating both visual and non-visual effects, and producing
      physiological and/or psychological benefits upon humans
    type: intensional
  examples: []
  notes:
  - content: The term "integrative lighting" applies only to humans.
    type: intensional
  - content: Lighting primarily for therapeutic purposes (light therapy) is not included.
    type: intensional
  - content: The term "human-centric lighting" is used with a similar meaning.
    type: intensional
  sources:
  - origin:
