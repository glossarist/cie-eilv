data:
  definition:
  - content: |-
      arithmetic mean of the vertical illuminances, stem:[E_(v,v)], at a point in the range of azimuth angles stem:[- (pi)/(2) &lt;= phi &lt;= (pi)/(2)]

      stem:[E_((v ,sc)) = (1)/(pi) int_((- (pi)/(2)))^(((pi)/(2))) E_((v ,v)) d phi]
    type: intensional
  examples: []
  notes:
