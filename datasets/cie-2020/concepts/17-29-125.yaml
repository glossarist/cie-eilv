data:
  definition:
  - content: quotient of the quantity of heat penetrating into an interior through
      the glazing and the solar {17-21-041, radiant energy} incident on that glazing
    type: intensional
  examples: []
  notes:
  - content: |-
      The solar factor is the sum of two quantities: the radiant transmittance, <i>τ</i><sub>e</sub>, of the glazing and the quantity equal to the quotient of the convected and radiated heat gain from the glazing into the interior, <i>Q</i><sub>2</sub>, and the solar {17-21-041, radiant energy}, <i>Q</i><sub>1</sub>, incident on the glazing:
      <i>g</i> = <i>τ</i><sub>e</sub> + <i>Q</i><sub>2</sub> / <i>Q</i><sub>1</sub>.
    type: intensional
  - content: The solar factor has unit one.
    type: intensional
  - content: This entry was numbered 845-09-106 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1199 and 17-1322 in CIE S 017:2011.
    type: intensional
