data:
  definition:
  - content: quotient of the quantity of heat penetrating into an interior through
      the glazing and the solar radiant energy incident on that glazing
    type: intensional
  examples: []
  notes:
  - content: |-
      The solar factor is the sum of two quantities: the radiant transmittance, stem:[tau_e], of the glazing and the quantity equal to the quotient of the convected and radiated heat gain from the glazing into the interior, stem:[Q_2], and the solar radiant energy, stem:[Q_1], incident on the glazing:

      stem:[g] = stem:[tau_e] + stem:[Q_2] / stem:[Q_1]
    type: intensional
  - content: The solar factor has unit one.
    type: intensional
  - content: This entry was numbered 845-09-106 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1199 and 17-1322 in CIE S 017:2011.
    type: intensional
