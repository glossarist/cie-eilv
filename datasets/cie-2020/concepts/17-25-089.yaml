data:
  definition:
  - content: 'function describing the change with direction of {{17-21-099, irradiation}},
      (<i>θ</i><sub>i</sub>,<i>ϕ</i><sub>i</sub>), and direction of view, (<i>θ</i><sub>r</sub>,<i>ϕ</i><sub>r</sub>),
      of the {{17-21-049, radiance}} of a surface element (<i>x</i><sub>r</sub>,<i>y</i><sub>r</sub>)
      in a given direction of view at a given {{17-21-025, wavelength}} <i>λ</i>,
      , with respect to the {{17-21-053, irradiance}} incident on the medium from
      the given direction of {{17-21-099, irradiation}} at the given {{17-21-025,
      wavelength}}, :'
    type: intensional
  examples: []
  notes:
  - content: The bi-directional reflectance distribution function is expressed in
      steradian to the power minus one (sr<sup>−1</sup>).
    type: intensional
  - content: See also "{{17-24-078, radiance coefficient}}".
    type: intensional
  - content: This entry was numbered 17-87 and 17-109 in CIE S 017:2011.
    type: intensional
