data:
  definition:
  - content: |-
      function describing the change with direction of irradiation (stem:[theta_i],stem:[ϕ_i]) and direction of view (stem:[theta_r],stem:[ϕ_r]) of the radiance of a surface element (stem:[x_r],stem:[y_r]) in a given direction of view at a given wavelength stem:[lambda], stem:[L_r ( theta_r , varphi_r , x_r , y_r , lambda )], with respect to the irradiance incident on the medium from the given direction of irradiation at the given wavelength, stem:[E_i ( theta_i , varphi_i , lambda )]

      stem:[rho ( theta_i , varphi_i , theta_r , varphi_r , x_r , y_r , lambda ) = ((d L_r ( theta_r , varphi_r , x_r , y_r , lambda )))/((d E_i ( theta_i , varphi_i , lambda )))]
    type: intensional
  examples: []
  notes:
  - content: The bi-directional reflectance distribution function is expressed in
      steradian to the power minus one (sr^−1^).
    type: intensional
  - content: See also "{{concept:cie-2020:17-24-078, radiance coefficient}}".
    type: intensional
  - content: This note applies to the French language only.
    type: intensional
