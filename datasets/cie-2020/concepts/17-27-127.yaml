data:
  definition:
  - content: 'ratio of the absolute value of the fundamental active power stem:[P_1] to the fundamental apparent power stem:[S_1]


      stem:[lambda_1] = |stem:[P_1]| / stem:[S_1]'
    type: intensional
  examples: []
  notes:
  - content: 'The fundamental power factor is also given by:


      stem:[lambda_1] = |cos stem:[phi_1]|'
    type: intensional
  - content: The fundamental power factor only refers to fundamental quantities.
    type: intensional
  - content: The fundamental power factor is sometimes called displacement factor or displacement power factor.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
