data:
  definition:
  - content: |-
      ratio of the absolute value of the fundamental active power <i>P</i><sub>1</sub> to the fundamental apparent power <i>S</i><sub>1


      </sub><i>λ</i><sub>1</sub>= |<i>P</i><sub>1</sub>| / <i>S</i><sub>1</sub>
  notes:
  - content: |-
      The fundamental power factor is also given by:
      <i>λ</i><sub>1</sub> =|cos<i>φ</i><sub>1</sub>|
  - content: The fundamental power factor only refers to fundamental quantities.
  - content: The fundamental power factor is sometimes called displacement factor
      or displacement power factor.
