data:
  definition:
  - content: angle a chosen reference direction makes with the vertical plane through
      a given point on a road surface and the first axis of a luminaire, when the
      luminaire is at its tilt during measurement
    type: intensional
  examples: []
  notes:
  - content: The reference direction for a straight road is by convention the longitudinal
      direction.
    type: intensional
  - content: The installation azimuth is expressed in radian (rad) or degree (°).
    type: intensional
