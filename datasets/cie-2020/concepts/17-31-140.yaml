  definition:
  - content: angle a chosen reference direction makes with the vertical plane through
      a given point on a road surface and the {{17-25-098, first axis}} of a {{17-30-001,
      luminaire}}, when the {{17-30-001, luminaire}} is at its {{17-25-112, tilt during
      measurement}}
    type: intensional
  examples: []
  notes:
