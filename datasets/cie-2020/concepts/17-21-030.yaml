  definition:
  - content: quotient of the {{17-21-029, spectral distribution}}, <i>X<sub>λ</sub></i>(<i>λ</i>),
      of a radiant, luminous or photon quantity, <i>X</i>(<i>λ</i>), and a fixed reference
      value, <i>R</i>, which can be an average value, a maximum value or an arbitrarily
      chosen value of this distribution
    type: intensional
