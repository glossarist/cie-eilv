data:
  definition:
  - content: |-
      quotient of the {{17-21-029, spectral distribution}}, stem:[Xlambda](stem:[lambda]), of a radiant, luminous or photon quantity, stem:[X](stem:[lambda]), and a fixed reference value, stem:[R], which can be an average value, a maximum value or an arbitrarily chosen value of this distribution

      stem:[S ( lambda ) = ((X_(lambda) ( lambda )))/(R)]
    type: intensional
  examples: []
  notes:
  - content: The relative spectral distribution has unit one.
    type: intensional
  - content: This entry was numbered {{cite:845-01-18, 845-01-18}} in IEC 60050-845:1987.
    type: intensional
