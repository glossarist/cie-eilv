data:
  definition:
  - content: '{{17-21-109, solid angle}} as "seen" by the {{17-25-035, detector}}
      (acceptance angle), e.g. of a {{17-25-006, radiometer}} or {{17-25-007, spectroradiometer}},
      out of which the {{17-25-035, detector}} receives radiation'
    type: intensional
  examples: []
  notes:
  - content: The field of view should not be confused with the {{17-25-085, angular
      subtense}} of the apparent source, <i>α</i>.
    type: intensional
  - content: A plane angle is sometimes used to describe a circular symmetric {{17-21-109,
      solid angle}} field of view.
    type: intensional
  - content: The field of view is expressed in steradian (sr).
    type: intensional
  - content: This entry was numbered 17-429 in CIE S 017:2011.
    type: intensional
