data:
  definition:
  - content: solid angle as "seen" by the detector (acceptance angle), e.g. of a radiometer
      or spectroradiometer, out of which the detector receives radiation
    type: intensional
  examples: []
  notes:
  - content: The field of view should not be confused with the {{concept:cie-2020:17-25-085,
      angular subtense}} of the apparent source, stem:[alpha].
    type: intensional
  - content: A plane angle is sometimes used to describe a circular symmetric solid
      angle field of view.
    type: intensional
  - content: The field of view is expressed in steradian (sr).
    type: intensional
  - content: This entry was numbered 17-429 in CIE S 017:2011.
    type: intensional
