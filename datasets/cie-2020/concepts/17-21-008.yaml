data:
  definition:
  - content: "{{concept:cie-2020:17-21-002, optical radiation}} for which the wavelengths
      are shorter than those for {{concept:cie-2020:17-21-003, visible radiation}}"
    type: intensional
  examples: []
  notes:
  - content: |-
      The range between 100 nm and 400 nm is commonly subdivided into:

      * UV-A: 315 nm to 400 nm;

      * UV-B: 280 nm to 315 nm;

      * UV-C: 100 nm to 280 nm.
    type: intensional
  - content: A precise border between ultraviolet radiation and visible radiation
      cannot be defined, because visual sensation at wavelengths shorter than 400 nm
      is noted for very bright sources.
    type: intensional
  - content: In some applications the ultraviolet spectrum has also been divided into
      "far," "vacuum," and "near" ultraviolet; however, the borders necessarily vary
      with the application (e.g. in meteorology, optical design, photochemistry, and
      thermal physics).
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-05, 845-01-05}} in IEC 60050-845:1987.
    type: intensional
  - content: This note applies to the French language only.
    type: intensional
