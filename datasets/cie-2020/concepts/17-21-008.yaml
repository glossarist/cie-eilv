data:
  definition:
  - content: "{17-21-002, optical radiation} for which the {17-21-025, wavelength}s
      are shorter than those for {17-21-003, visible radiation}"
    type: intensional
  examples: []
  notes:
  - content: |-
      The range between 100 nm and 400 nm is commonly subdivided into:
      {17-21-009, UV-A}: 315 nm to 400 nm;
      {17-21-010, UV-B}: 280 nm to 315 nm;
      {17-21-011, UV-C}: 100 nm to 280 nm.
    type: intensional
  - content: A precise border between "ultraviolet radiation" and "{17-21-003, visible
      radiation}" cannot be defined, because {17-22-083, visual sensation} at {17-21-025,
      wavelength}s shorter than 400 nm is noted for very {17-22-061, bright} {17-21-032,
      source}s.
    type: intensional
  - content: In some applications the ultraviolet spectrum has also been divided into
      "far," "vacuum," and "near" ultraviolet; however, the borders necessarily vary
      with the application (e.g. in meteorology, optical design, photochemistry, thermal
      physics).
    type: intensional
  - content: This entry was numbered 845-01-05 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1367, 17-1389 and 17-1388 in CIE S 017:2011.
    type: intensional
