data:
  definition:
  - content: point in a chromaticity diagram that represents the colour of the addition of 100 % of the three display primaries measured in a direction perpendicular to the display faceplate
    type: intensional
  examples: []
  notes:
  - content: Some displays incorporate more than three display primaries and in those cases, the manufacturer of the display decides how to create the white point.
