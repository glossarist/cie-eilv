data:
  definition:
  - content: luminance coefficient multiplied by the cube of the cosine of the angle of incidence of the light on a point on a surface
    type: intensional
  examples: []
  notes:
  - content: 'The reduced luminance coefficient can be expressed by the equation


      stem:[r] = stem:[q](cos stem:[epsilon])^3^


      ^


      where^ stem:[q] is the luminance coefficient in steradian to the power minus one (sr^-1^), and stem:[epsilon] is the angle of incidence in degree (stem:[deg]).'
    type: intensional
  - content: The angle of observation, stem:[alpha], affects the value of stem:[r]. By convention this angle is fixed at 1stem:[deg] for road lighting calculations.
    type: intensional
  - content: The reduced luminance coefficient is expressed in steradian to the power minus one (sr^-1^).
    type: intensional
  - content: This entry was numbered 17-1046 in CIE S 017:2011.
    type: intensional
