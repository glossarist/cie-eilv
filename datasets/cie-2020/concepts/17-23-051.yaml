data:
  definition:
  - content: standard observer whose {17-23-039, colour-matching functions} deviate
      from those of the {17-23-048, CIE standard colorimetric observer} in a defined
      manner
    type: intensional
  examples: []
  notes:
  - content: The defined deviations can be applied to the {17-23-049, CIE 1931 standard
      colorimetric observer} or the {17-23-050, CIE 1964 standard colorimetric observer}.
    type: intensional
  - content: The use of the CIE standard deviate observer is intended to generate
      differences that are typical of those that occur when colour matches are made
      by different real observers whose colour vision is classified as normal.
    type: intensional
  - content: 'See also CIE 80 <i>Special Metamerism Index: Change in Observer</i>.'
    type: intensional
  - content: This entry was numbered 17-166 in CIE S 017:2011.
    type: intensional
