data:
  definition:
  - content: high-intensity discharge lamp in which the light is produced mainly by
      radiation from sodium vapour operating at a partial pressure of the order of
      10 kPa
    type: intensional
  examples: []
  notes:
  - content: The term "high-pressure sodium lamp" includes electric lamps with clear
      or diffusing bulb.
    type: intensional
  - content: This entry was numbered 845-07-23 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-536 in CIE S 017:2011.
    type: intensional
