data:
  definition:
  - content: 'quotient of blue light hazard weighted radiant flux and radiant flux


      stem:[eta_B = (int Phi_(e,lambda)(lambda) B(lambda) "d" lambda)/(int Phi_(e,lambda)(lambda) "d" lambda)]'
    type: intensional
  examples: []
  notes:
  - content: The blue light hazard efficiency of radiation, stem:[eta_B], is related to the blue light hazard efficacy of luminous radiation, stem:[K_{B,v}], through stem:[eta_B] = stem:[KcdotK_{B,v}], where stem:[K] is luminous efficacy of radiation, and to the blue light hazard factor of luminous radiation, stem:[alpha_{B,v}], through stem:[eta_B] = stem:[Vcdotalpha_{B,v}], where stem:[V] is luminous efficiency of radiation.
    type: intensional
  - content: For some applications it might be necessary to state both blue light hazard efficiency of radiation, stem:[eta_B], and blue light hazard efficacy of luminous radiation, stem:[K_{B,v}].
    type: intensional
  - content: The blue light hazard efficiency of radiation has unit one.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
