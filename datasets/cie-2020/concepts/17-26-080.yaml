data:
  definition:
  - content: process whereby 7stem:[-]dehydrocholesterol, precursor of vitamin D3, produces previtamin D3 by absorbing 240 nm to 315 nm {{concept:cie-2020:17-21-008, ultraviolet radiation}} and moreover changes it to vitamin D3 through a thermal isomerization process
    type: intensional
  examples: []
  notes:
  - content: Vitamin D is a generic term for vitamin D2 and/or vitamin D3. Vitamin D synthesis in mammalian skin produces vitamin D3. Vitamin D2 is formed in plants in an analogous process when ultraviolet radiation activates ergosterol.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-1420, 17-1420}} in CIE S 017:2011.
    type: intensional
