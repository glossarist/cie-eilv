data:
  definition:
  - content: average value of the luminous intensity of the light source in all directions, equal to the quotient of its luminous flux and the solid angle 4stem:[pi] sr
    type: intensional
  examples: []
  notes:
  - content: The mean spherical luminous intensity is expressed in candela (cd).
