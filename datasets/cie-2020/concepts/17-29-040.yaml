data:
  definition:
  - content: average value of the {{17-21-045, luminous intensity}} of the {{17-27-001,
      light source}} in all directions, equal to the quotient of its {{17-21-039,
      luminous flux}} and the {{17-21-109, solid angle}} 4π sr
    type: intensional
  examples: []
  notes:
  - content: The mean spherical luminous intensity is expressed in candela (cd).
    type: intensional
