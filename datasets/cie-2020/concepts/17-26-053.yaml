data:
  definition:
  - content: effective {{17-21-071, radiant exposure}} with the spectral radiant exposure,
      <i>H<sub>λ</sub></i>, spectrally weighted with the {{17-26-054, ultraviolet
      hazard spectral weighting function}}, <i>S</i><sub>UV</sub>(<i>λ</i>)
    type: intensional
  examples: []
  notes:
  - content: The {{17-21-025, wavelength}} range for ultraviolet hazard radiant exposure
      is specified in ICNIRP-recommendations as <i>λ</i> = 180 nm to <i>λ</i> = 400
      nm.
    type: intensional
  - content: The ultraviolet hazard radiant exposure is expressed in joule per square
      metre (J·m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 17-1362 in CIE S 017:2011.
    type: intensional
