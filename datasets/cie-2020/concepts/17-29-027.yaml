data:
  definition:
  - content: "{17-29-001, lighting} responding to circumstances or according to predefined
      conditions, while maintaining the {17-29-029, lighting quality} within the specified
      requirements for these circumstances or conditions"
    type: intensional
  examples: []
  notes:
  - content: The requirements can focus on different aspects such as energy efficiency,
      dynamic user needs, {17-22-084, visual task} or ambience.
    type: intensional
  - content: The terms "smart lighting" and "intelligent lighting" are sometimes used
      with a similar meaning.
    type: intensional
