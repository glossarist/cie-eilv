  definition:
  - content: |-
      rate of {17-21-043, photon number} per <a href="http://std.iec.ch/iev/iev.nsf/display?openform&ievref=113-01-10">time interval</a>

      where <i>N</i><sub>p</sub> is {17-21-043, photon number}, transmitted or received, and <i>t</i> is time
    type: intensional
