  notes:
  - content: |-
      Photon flux, <i>Φ</i><sub>p</sub>, is related to {17-21-038, radiant flux}, <i>Φ</i><sub>e</sub>, of {17-21-014, monochromatic radiation} by

      where <i>h</i> is the {17-21-108, Planck constant}, and <i>ν</i> is the frequency of the corresponding electromagnetic wave.
    type: intensional
  - content: For a beam of radiation whose {17-21-029, spectral distribution} is or
      , the photon flux can be expressed by , where <i>h</i> is Planck's constant
      and <i>c</i><sub>0</sub> is the speed of light in vacuum.
    type: intensional
  - content: The corresponding radiometric quantity is "{17-21-038, radiant flux}".
      The corresponding photometric quantity is "{17-21-039, luminous flux}".
    type: intensional
  - content: The photon flux is expressed in second to the power minus one (s<sup>−1</sup>).
    type: intensional
