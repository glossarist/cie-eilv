data:
  definition:
  - content: 'time integral of spherical irradiance, stem:[H_(e,o) = int_(Delta t) E_(e,o) "d"t], at a given point over a given duration, stem:[Delta t]


      stem:[H_{(e,o)} = underset((Delta t))( int ) E_{e,o} d t]'
    type: intensional
  examples: []
  notes:
  - content: The radiant spherical exposure is the quotient of the radiant energy of all radiation incident on the outer surface of an infinitely small sphere centred at the specified point and the area of the diametrical cross-section of that sphere.
    type: intensional
  - content: The radiant spherical exposure is the appropriate radiometric quantity for describing a dose for a photobiological or photochemical effect in a scattering medium (e.g. light in skin). It is also the appropriate radiometric quantity for describing the irradiation of microorganisms. The radiant spherical exposure is frequently used incorrectly as a substitute for radiant exposure.
    type: intensional
  - content: The radiant spherical exposure is expressed in joule per square metre stem:[J cdot m^(-2) = W cdot s cdot m^(-2)].
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-45, 845-01-45}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1028 in CIE S 017:2011.
    type: intensional
