data:
  definition:
  - content: distance from a {17-21-032, source} at which the {17-21-053, irradiance}
      equals the applicable {17-26-072, exposure limit} for the skin for the {17-26-071,
      exposure duration}
    type: intensional
  examples: []
  notes:
  - content: Where the duration of exposure is not known, IEC 62471/CIE S 009<i> Photobiological
      safety of lamp and lamp systems</i> applies a duration of 8 h.
    type: intensional
  - content: The skin hazard distance is expressed in metres (m).
    type: intensional
  - content: This entry was numbered 17-1188 in CIE S 017:2011.
    type: intensional
