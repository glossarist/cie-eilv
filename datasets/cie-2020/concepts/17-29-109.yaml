data:
  definition:
  - content: 'quotient of the {{concept:cie-2020:17-29-106, optical thickness}} of the atmosphere at angle stem:[m=(delta(epsilon))/(delta(0°))] to the vertical, stem:[delta](stem:[epsilon]), and the vertical optical thickness, stem:[delta](0stem:[deg]), of the atmosphere


      stem:[m = ((delta ( epsilon )))/((delta ( 0 deg )))]'
    type: intensional
  examples: []
  notes:
  - content: See also "{{concept:cie-2020:17-29-106, optical thickness}}".
    type: intensional
  - content: 'Several equations are available to express this concept. Usually the Kastenstem:[m = 1/([sin gamma_s + 0.50572(gamma_s+6,07995)^(-1,6364)])]Young formula is used:


      stem:[m = (1)/((sin\ gamma_s \ + \ 0, 5 0 5\ 72 ( gamma_s \ + \ 6 ,0 79\ 95 )^{- 1 , 636 4}))]


      where stem:[gamma_s] (= 90stem:[deg] - stem:[epsilon]) is solar altitude (complementary angle of zenith angle, stem:[epsilon]) in degree.'
    type: intensional
  - content: 'When the curvature of the atmosphere and atmospheric refraction are neglected:


      stem:[m = 1/(cos epsilon)].'
    type: intensional
  - content: The relative optical air mass has unit one.
    type: intensional
