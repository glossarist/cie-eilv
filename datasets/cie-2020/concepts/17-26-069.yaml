data:
  definition:
  - content: standardized unit of measure of erythemal radiation
    type: intensional
  examples: []
  notes:
  - content: One standard erythema dose (1 SED) is equivalent to an erythemal radiant
      exposure of 100 J·m^−2^.
    type: intensional
  - content: See also "{{concept:cie-2020:17-26-068, minimal erythema dose}}".
    type: intensional
  - content: See also ISO/CIE 17166, _Erythema Reference Action Spectrum and Standard
      Erythema Dose_.
    type: intensional
  - content: This entry was numbered 17-1255 and 17-1151 in CIE S 017:2011.
    type: intensional
