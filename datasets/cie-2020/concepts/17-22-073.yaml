data:
  definition:
  - content: colourfulness of an area judged in proportion to its brightness
    type: intensional
  examples: []
  notes:
  - content: For given viewing conditions and at luminance levels within the range
      of photopic vision, a colour stimulus of a given chromaticity exhibits approximately
      constant saturation for all luminance levels, except when the brightness is
      very high.
    type: intensional
  - content: This entry was numbered {{cite:845-02-41, 845-02-41}} in IEC 60050-845:1987.
    type: intensional
