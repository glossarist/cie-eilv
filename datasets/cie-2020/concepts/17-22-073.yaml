data:
  definition:
  - content: "{17-22-072, colourfulness} of an area judged in proportion to its {17-22-059,
      brightness}"
    type: intensional
  examples: []
  notes:
  - content: For given viewing conditions and at {17-21-050, luminance} levels within
      the range of {17-22-016, photopic vision}, a {17-23-002, colour stimulus} of
      a given {17-23-052, chromaticity} exhibits approximately constant saturation
      for all {17-21-050, luminance} levels, except when the {17-22-059, brightness}
      is very high.
    type: intensional
