data:
  definition:
  - content: measure of the degree to which the psychophysical {17-23-001, colour}
      of an object illuminated by the test {17-23-018, illuminant} conforms to that
      of the same object illuminated by the {17-22-108, reference illuminant}, suitable
      allowance having been made for the state of {17-22-013, chromatic adaptation}
    type: intensional
  examples: []
  notes:
  - content: See also CIE 13 <i>Method of Measuring and Specifying Colour Rendering
      of Light Sources</i>.
    type: intensional
  - content: This entry was numbered 845-02-61 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-222 and 17-263 in CIE S 017:2011.
    type: intensional
