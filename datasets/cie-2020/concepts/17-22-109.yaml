data:
  definition:
  - content: measure of the degree to which the psychophysical colour of an object
      illuminated by the test illuminant conforms to that of the same object illuminated
      by the reference illuminant, suitable allowance having been made for the state
      of chromatic adaptation
    type: intensional
  examples: []
  notes:
  - content: See also CIE 13, _Method of Measuring and Specifying Colour Rendering
      of Light Sources_.
    type: intensional
  - content: This entry was numbered {{cite:845-02-61, 845-02-61}} in IEC 60050-845:1987.
    type: intensional
  - content: This note applies to the French language only.
    type: intensional
