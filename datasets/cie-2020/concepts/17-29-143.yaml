data:
  definition:
  - content: programme according to which the maintenance operations of luminaire cleaning, room surface cleaning and lamp replacement are scheduled to be carried out at equal time intervals
    type: intensional
  examples: []
  notes:
  - content: Usually the time interval for the room surface cleaning is a multiple of the lamp replacement interval; the latter is in turn a multiple of the luminaire cleaning interval.
    type: intensional
