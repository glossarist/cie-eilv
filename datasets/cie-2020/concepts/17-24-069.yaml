data:
  definition:
  - content: quotient of the diffusely transmitted part of the (whole) transmitted
      flux and the incident flux
    type: intensional
  examples: []
  notes:
  - content: 'Transmittance, stem:[tau], is the sum of regular transmittance, stem:[tau_r],
      and diffuse transmittance, stem:[tau_d]: stem:[tau] = stem:[tau_r] + stem:[tau_d].'
    type: intensional
  - content: The diffuse transmittance has unit one.
    type: intensional
  - content: This entry was numbered 845-04-63 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-308 in CIE S 017:2011.
    type: intensional
