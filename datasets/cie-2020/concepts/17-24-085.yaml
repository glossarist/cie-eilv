data:
  definition:
  - content: |-
      relative decrease in radiant flux caused by absorption, expressed by the relative density of the spectral radiant flux, stem:[Phi_(e,lambda)](stem:[lambda]), with respect to propagation length, stem:[l], of a collimated beam at a point in an absorbing medium

      stem:[a ( lambda ) = (1)/((Phi_((e , lambda)) ( lambda ))) ((d Phi_((e , lambda)) ( lambda )))/((d l))]
    type: intensional
  examples: []
  notes:
  - content: The spectral linear absorption coefficient is expressed in metre to the
      power minus one (m^−1^).
    type: intensional
