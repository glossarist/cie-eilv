data:
  definition:
  - content: relative decrease in {{17-21-038, radiant flux}} caused by {{17-24-081,
      absorption}}, expressed by the relative density of the spectral radiant flux,
      <i>Φ</i><sub>e,</sub><i><sub>λ</sub></i>(<i>λ</i>), with respect to propagation
      length, <i>l</i>, of a collimated beam at a point in an absorbing medium
    type: intensional
  examples: []
  notes:
  - content: The spectral linear absorption coefficient is expressed in metre to the
      power minus one (m<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 845-04-78 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1219 in CIE S 017:2011.
    type: intensional
