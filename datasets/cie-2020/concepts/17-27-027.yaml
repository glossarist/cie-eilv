data:
  definition:
  - content: "{17-27-024, discharge lamp} in which the light-producing arc is stabilized
      by wall temperature and the arc has a {17-28-006, bulb} wall loading in excess
      of 3 W·cm<sup>−2</sup>"
    type: intensional
  examples: []
  notes:
  - content: High-intensity discharge lamps include groups of {17-27-024, discharge
      lamp}s known as {17-27-028, high-pressure mercury lamp}s, {17-27-033, metal
      halide lamp}s and {17-27-031, high-pressure sodium lamp}s.
    type: intensional
