data:
  definition:
  - content: discharge lamp in which the light-producing arc is stabilized by wall
      temperature and the arc has a bulb wall loading in excess of 3 W·cm^−2^
    type: intensional
  examples: []
  notes:
  - content: High-intensity discharge lamps include groups of discharge lamps known
      as {{17-27-028, high-pressure mercury lamps}}, {{17-27-033, metal halide lamps}}
      and {{17-27-031, high-pressure sodium lamps}}.
    type: intensional
  - content: This entry was numbered {{bib:845-07-19, 845-07-19}} in IEC 60050-845:1987.
    type: intensional
