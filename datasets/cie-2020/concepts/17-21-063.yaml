data:
  definition:
  - content: mean value of {17-21-060, illuminance} on the outer curved surface of
      a very small (real or imaginary) cylinder that is oriented vertically at a point
      in space
    type: intensional
  examples: []
  notes:
  - content: |-
      Cylindrical illuminance is sometimes also defined as the arithmetic mean of the {17-21-062, vertical illuminance}, <i>E</i><sub>v,v</sub>, at a point

      where <i>E</i><sub>v,v</sub> is the {17-21-062, vertical illuminance} for an area element with its normal in the direction <i>φ</i>, and <i>φ</i> is the angle in the plane perpendicular to the axis of the cylinder.
    type: intensional
  - content: The corresponding radiometric quantity is "{17-21-055, cylindrical irradiance}".
      The corresponding quantity for photons is "{17-21-069, photon cylindrical irradiance}".
    type: intensional
  - content: The cylindrical illuminance is expressed in lux (lx = lm·m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 17-273 in CIE S 017:2011.
    type: intensional
