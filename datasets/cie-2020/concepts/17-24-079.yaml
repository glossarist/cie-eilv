data:
  definition:
  - content: |-
      quotient of the {{17-21-050, luminance}} at a surface element of a medium in a given direction and the {{17-21-060, illuminance}} on the medium

      where <i>L</i><sub>v</sub> is {{17-21-050, luminance}} and <i>E</i><sub>v</sub> is {{17-21-060, illuminance}}
    type: intensional
  examples: []
  notes:
  - content: The {{17-25-089, bi-directional reflectance distribution function}} (BRDF)
      is similar to the luminance coefficient except that it is defined for directional
      incident radiation.
    type: intensional
  - content: The luminance coefficient is expressed in steradian to the power minus
      one (sr<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 845-04-71 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-712 in CIE S 017:2011.
    type: intensional
