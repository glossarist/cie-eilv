data:
  definition:
  - content: set of 15 {{17-29-127, sky luminance}} distributions which model the
      sky from heavily overcast sky to cloudless sky
    type: intensional
  examples: []
  notes:
  - content: The relative {{17-21-050, luminance}} distributions are described in
      ISO 15469/CIE S 011<i> Spatial distribution of daylight – CIE standard general
      sky</i>. The {{17-29-112, CIE standard clear sky}} is incorporated as a particular
      case, and the {{17-29-111, CIE standard overcast sky}} is added as a separate
      formula.
    type: intensional
  - content: This entry was numbered 17-167 in CIE S 017:2011.
    type: intensional
