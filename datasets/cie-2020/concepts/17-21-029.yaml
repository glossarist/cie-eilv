data:
  definition:
  - content: |-
      density of a radiant or luminous or photon quantity, stem:[X](stem:[lambda]), with respect to wavelength, stem:[lambda], at the wavelength stem:[lambda]

      stem:[X_(lambda) = ((d X ( lambda )))/((d lambda))]
    type: intensional
  examples: []
  notes:
  - content: The term "spectral distribution" is to be preferred to the equivalent
      term "spectral concentration" when dealing with the function stem:[Xlambda](stem:[lambda])
      over a range of wavelengths, not at a particular wavelength.
    type: intensional
  - content: Usually stem:[Xlambda] is also a function of stem:[lambda] and in this
      case, in order to stress this, can be written stem:[Xlambda](stem:[lambda])
      without any change of meaning.
    type: intensional
  - content: The spectral distribution of radiant flux is expressed in watt per nanometre
      (W·nm^−1^), the spectral distribution of luminous flux is expressed in lumen
      per nanometre (lm·nm^−1^), the spectral distribution of photon flux is expressed
      in nanometre to the power minus one (nm^−1^). The units of spectral distributions
      of other quantities are expressed accordingly.
    type: intensional
  - content: The quantity stem:[X] can also be expressed as a function of <<103-06-02,
      frequency>>, stem:[nu], {{17-21-026, wavenumber}}, stem:[sigma], etc.; the corresponding
      symbols are stem:[X](stem:[nu]), stem:[X](stem:[sigma]), etc. and the corresponding
      densities with respect to frequency, stem:[nu], wavenumber, stem:[sigma], etc.
      are stem:[Xnu], stem:[Xsigma], etc., in which case the expression of units will
      also change accordingly.
    type: intensional
  - content: This entry was numbered 845-01-17 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1213 and 17-1212 in CIE S 017:2011.
    type: intensional
