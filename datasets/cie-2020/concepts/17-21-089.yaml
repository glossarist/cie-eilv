data:
  definition:
  - content: |-
      quotient of the emitted {17-21-039, luminous flux} and the power consumed

      where <i>Φ</i><sub>v</sub> is {17-21-039, luminous flux} and <i>P</i> is the power consumed by the {17-27-001, light source}
    type: intensional
  examples: []
  notes:
  - content: It has to be specified whether or not the power dissipated by auxiliary
      equipment such as {17-28-044, ballast}s, if any, is included in the power consumed
      by the {17-27-001, light source}.
    type: intensional
  - content: The luminous efficacy of a {17-27-001, light source} is expressed in
      lumen per watt (lm·W<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 845-01-55 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-729 in CIE S 017:2011.
    type: intensional
