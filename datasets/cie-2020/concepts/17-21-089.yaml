data:
  definition:
  - content: |-
      quotient of the emitted luminous flux and the power consumed

      stem:[eta_v = ((Phi_v))/(P)]

      where stem:[Phi_v] is luminous flux and stem:[P] is the power consumed by the light source
    type: intensional
  examples: []
  notes:
  - content: It has to be specified whether or not the power dissipated by auxiliary
      equipment such as ballasts, if any, is included in the power consumed by the
      light source.
    type: intensional
  - content: The luminous efficacy of a light source is expressed in lumen per watt
      (lm·W^−1^).
    type: intensional
  - content: This entry was numbered {{cite:845-01-55, 845-01-55}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-729 in CIE S 017:2011.
    type: intensional
