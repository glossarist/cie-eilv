data:
  definition:
  - content: smallest {17-22-089, contrast}, produced at the eye of an observer by
      a given object, which renders the object perceptible against a given background
    type: intensional
  examples: []
  notes:
  - content: For meteorological observations, the object has to be rendered recognizable,
      and hence a higher threshold is to be expected. The value of 0,05 has been adopted
      as the basis for the measurement of {17-31-018, meteorological optical range}.
    type: intensional
  - content: This entry was numbered 845-11-21 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1407 in CIE S 017:2011.
    type: intensional
