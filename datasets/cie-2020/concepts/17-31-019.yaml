data:
  definition:
  - content: smallest contrast, produced at the eye of an observer by a given object, which renders the object perceptible against a given background
    type: intensional
  examples: []
  notes:
  - content: For meteorological observations, the object has to be rendered recognizable, and hence a higher threshold is to be expected. The value of 0,05 has been adopted as the basis for the measurement of {{concept:cie-2020:17-31-018, meteorological optical range}}.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-11-21, 845-11-21}} in IEC 60050-845:1987.
    type: intensional
