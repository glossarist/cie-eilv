data:
  definition:
  - content: 'time integral of erythemal irradiance


      stem:[H_(er) = int int E_(lambda)(lambda,t) s_(er)(lambda) "d" lambda "d" t]


      where stem:[Elambda](stem:[lambda], stem:[t]) is spectral irradiance and stem:[s_{er}](stem:[lambda]) is the erythema spectral weighting function normalized to 1 at its maximum'
    type: intensional
  examples: []
  notes:
  - content: This definition is based on the assumption that an action spectrum is adopted for the actinic effect considered, and that its maximum value is 1.
    type: intensional
  - content: It is essential to specify which action spectrum is used, as the unit is the same for any action spectrum.
    type: intensional
  - content: See also "{{concept:cie-2020:17-26-068, minimal erythema dose}}", "{{concept:cie-2020:17-26-069, standard erythema dose}}".
    type: intensional
  - content: The erythemal dose is expressed in joule per square metre stem:[J cdot m^(-2)].
    type: intensional
  - content: This entry was numbered 17-402 and 17-404 in CIE S 017:2011.
    type: intensional
