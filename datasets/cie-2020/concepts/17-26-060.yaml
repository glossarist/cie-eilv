data:
  definition:
  - content: function representing the relative spectral sensitivity of the human eye to blue light hazards, based upon the relative spectral effectiveness of {{concept:cie-2020:17-21-002, optical radiation}} to induce retinal photochemical injury (e.g. photic maculopathy)
    type: intensional
  examples: []
  notes:
  - content: The wavelength range for the blue light hazard spectral weighting function is specified in ICNIRP-recommendations as stem:[lambda] = 300 nm to stem:[lambda] = 700 nm.
    type: intensional
  - content: The blue light hazard spectral weighting function has unit one.
    type: intensional
  - content: This entry was numbered 17-102 in CIE S 017:2011.
    type: intensional
