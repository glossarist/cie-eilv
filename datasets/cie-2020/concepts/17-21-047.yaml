data:
  definition:
  - content: quantity that determines the maximum geometric throughput of radiation
      transmitted, received or emitted in a single-pass, passive optical arrangement
    type: intensional
  examples: []
  notes:
  - content: |-
      Defining a ray as the confined radiation exchange between two subtended surface area elements d<i>A</i> and d<i>A</i>′ at distance <i>l</i>, with normal vectors and and orientation angles <i>θ</i> and <i>θ </i>′ with respect to a common optical axis, the geometric extent is equal to the action of all possible rays between both surface areas <i>A</i> and <i>A</i>′. This is expressed by the integral over the product of all projected area elements d<i>A </i>cos<i>θ</i> and d<i>A</i>′ cos<i>θ </i>′ weighted by the distance squared to account for the apparent size of the subtending surfaces areas:

      with

      where d<i>Ω</i> and d<i>Ω</i> ′ are the {17-21-109, solid angle} elements defining the angular extent of d<i>A</i>′ from d<i>A</i> and d<i>A</i> from d<i>A</i>′ respectively.
    type: intensional
  - content: '"Single-pass" means that the term applies only for radiation transfer
      in a single defined direction. It does not apply to devices such as Fabry–Pérot
      cavities.'
    type: intensional
  - content: See also "{17-21-048, optical extent}".
    type: intensional
  - content: The geometric extent is expressed in square metre times steradian (m<sup>2</sup>·sr).
    type: intensional
  - content: This entry was numbered 845-01-33 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-489 in CIE S 017:2011.
    type: intensional
