data:
  definition:
  - content: amounts of the reference colour stimuli, in a given trichromatic system,
      required to match the colour of the stimulus considered
    type: intensional
  examples: []
  notes:
  - content: In the CIE standard colorimetric systems, the tristimulus values are
      represented, for example, by the symbols stem:[R], stem:[G], stem:[B]; stem:[X],
      stem:[Y], stem:[Z]; stem:[R_(10)], stem:[G_(10)], stem:[B_(10)] or stem:[X_(10)],
      stem:[Y_(10)], stem:[Z_(10)].
    type: intensional
