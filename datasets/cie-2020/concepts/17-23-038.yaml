data:
  definition:
  - content: amounts of the {17-23-037, reference colour stimuli}, in a given {17-23-036,
      trichromatic system}, required to match the {17-23-001, colour} of the stimulus
      considered
    type: intensional
  examples: []
  notes:
  - content: In the CIE standard colorimetric systems, the tristimulus values are
      represented, for example, by the symbols <i>R</i>, <i>G</i>, <i>B</i>; <i>X</i>,
      <i>Y</i>, <i>Z</i>; <i>R</i><sub>10</sub>, <i>G</i><sub>10</sub>, <i>B</i><sub>10</sub>
      or <i>X</i><sub>10</sub>, <i>Y</i><sub>10</sub>, <i>Z</i><sub>10</sub>.
    type: intensional
