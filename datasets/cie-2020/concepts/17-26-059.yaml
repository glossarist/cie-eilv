data:
  definition:
  - content: effective {{17-21-071, radiant exposure}} with the spectral radiant exposure,
      <i>H<sub>λ</sub></i>, spectrally weighted with the {{17-26-060, blue light hazard
      spectral weighting function}}, <i>B</i>(<i>λ</i>)
    type: intensional
  examples: []
  notes:
  - content: The {{17-21-025, wavelength}} range for the blue light hazard radiant
      exposure is specified in ICNIRP-recommendations as <i>λ</i> = 300 nm to <i>λ</i>
      = 700 nm.
    type: intensional
  - content: This definition is based on the assumption that an {{17-26-027, action
      spectrum}} is adopted for the {{17-26-003, actinic}} effect considered, and
      that its maximum value is 1.
    type: intensional
  - content: It is essential to specify which actinic {{17-26-027, action spectrum}}
      is used, as the unit is the same for any {{17-26-027, action spectrum}}.
    type: intensional
  - content: The blue light hazard radiant exposure is expressed in joule per square
      metre (J·m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 17-101 in CIE S 017:2011.
    type: intensional
