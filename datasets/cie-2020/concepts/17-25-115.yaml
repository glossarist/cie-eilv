data:
  definition:
  - content: factor by which the readings of a physical photometer can be multiplied
      in order to correct for the error caused by differences between the relative
      spectral responsivity of the photometer and the {{concept:cie-2020:17-21-035,
      spectral luminous efficiency}} for photopic vision, stem:[V](stem:[lambda]),
      that it is intended to simulate when the photometer is used to measure a source
      having a {{concept:cie-2020:17-21-030, relative spectral distribution}} different
      from that of the source with which the photometer was calibrated
    type: intensional
  examples: []
  notes:
  - content: |-
      Most photometers are designed to simulate the spectral luminous efficiency for photopic vision, stem:[V](stem:[lambda]), and are calibrated using a source corresponding to {{concept:cie-2020:17-23-021, CIE standard illuminant}} A. For such a photometer, the spectral mismatch correction factor can be calculated using the equation:

      stem:[F^( * ) = ((underset(lambda)( int ) S ( lambda ) V ( lambda ) d lambda))/((underset(lambda)( int ) S ( lambda ) s_((rel)) ( lambda ) d lambda)) ((underset(lambda)( int ) S_A ( lambda ) s_((rel)) ( lambda ) d lambda))/((underset(lambda)( int ) S_A ( lambda ) V ( lambda ) d lambda))]

      where stem:[s_(rel)](stem:[lambda]) is the relative spectral responsivity of the photometer and stem:[S](stem:[lambda]) and stem:[S_A](stem:[lambda]) are the respective relative spectral power distributions of the source to be measured and CIE standard illuminant A.
    type: intensional
  - content: The term "colour correction factor" is no longer used.
    type: intensional
  - content: The term spectral mismatch correction factor can also be applied to other
      detectors whose response is intended to simulate a particular observer function,
      such as actinic radiometers.
    type: intensional
  - content: The spectral mismatch correction factor has unit one.
    type: intensional
  - content: This entry was numbered 17-1224 and 17-205 in CIE S 017:2011.
    type: intensional
