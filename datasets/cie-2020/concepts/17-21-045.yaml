data:
  definition:
  - content: |-
      density of {17-21-039, luminous flux} with respect to {17-21-109, solid angle} in a specified direction
      <sub>


      </sub>where <i>Φ</i><sub>v</sub> is the {17-21-039, luminous flux} emitted in a specified direction, and <i>Ω</i> is the {17-21-109, solid angle} containing that direction
    type: intensional
  examples: []
  notes:
  - content: For practical realization of the quantity, the {17-21-032, source} is
      approximated by a {17-21-033, point source}.
    type: intensional
  - content: |-
      The distribution of the luminous intensities as a function of the direction of {17-24-001, emission}, e.g. given by the polar angles (<i>ϑ</i>, <i>φ</i>), is used to determine the {17-21-039, luminous flux}, <i>Φ</i><sub>v</sub>, within a certain {17-21-109, solid angle}, <i>Ω</i>, of a {17-21-032, source}:
      ..
    type: intensional
  - content: |-
      Luminous intensity can be derived from the spectral {17-21-044, radiant intensity} distribution by

      where <i>K</i><sub>m</sub> is {17-21-092, maximum luminous efficacy}, <i>I</i><sub>e,</sub><i><sub>λ</sub></i>(<i>λ</i>) is the spectral radiant intensity at {17-21-025, wavelength} <i>λ</i>, and <i>V</i>(<i>λ</i>) is {17-21-035, spectral luminous efficiency}.
    type: intensional
  - content: The corresponding radiometric quantity is "{17-21-044, radiant intensity}".
      The corresponding quantity for photons is "{17-21-046, photon intensity}".
    type: intensional
  - content: The luminous intensity is expressed in candela (cd = lm·sr<sup>−1</sup>).
    type: intensional
