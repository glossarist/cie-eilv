data:
  definition:
  - content: irradiation of the skin or other tissues, typically with {{17-21-008,
      ultraviolet radiation}}, in the treatment of diseases (e.g. psoriasis)
    type: intensional
  examples: []
  notes:
  - content: The term "photodynamic therapy" has been used where special photo-sensitizing
      agents have been added as part of the treatment, or are endogenous in the tissue
      being targeted.
    type: intensional
