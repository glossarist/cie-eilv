data:
  definition:
  - content: 'quotient of reflected radiant flux, stem:[Phi_r], and incident radiant flux, stem:[Phi_m]


      stem:[rho = ((Phi_r))/((Phi_m))]'
    type: intensional
  examples: []
  notes:
  - content: Reflectance is also defined spectrally in terms of wavelength, in which case, "spectral" is added before the quantity name.
    type: intensional
  - content: Due to energy conservation, stem:[alpha] + stem:[rho] + stem:[tau] = 1 except when {{concept:cie-2020:17-21-017, polarized radiation}} is observed, where stem:[alpha] is absorptance and stem:[tau] is transmittance.
    type: intensional
  - content: 'Reflectance, stem:[rho], is the sum of regular reflectance, stem:[rho_r], and diffuse reflectance, stem:[rho_d]: stem:[rho] = stem:[rho_r] + stem:[rho_d].'
    type: intensional
  - content: The reflectance has unit one.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-58, 845-04-58}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1058 in CIE S 017:2011.
    type: intensional
