data:
  definition:
  - content: quotient of reflected {{17-21-038, radiant flux}}, <i>Φ</i><sub>r</sub>,
      and incident {{17-21-038, radiant flux}}, <i>Φ</i><sub>m</sub>
    type: intensional
  examples: []
  notes:
  - content: Reflectance is also defined spectrally in terms of {{17-21-025, wavelength}},
      in which case, "spectral" is added before the quantity name.
    type: intensional
  - content: Due to energy conservation, <i>α</i> + <i>ρ</i> + <i>τ</i> = 1 except
      when {{17-21-017, polarized radiation}} is observed, where <i>α</i> is absorptance
      and <i>τ</i> is {{17-24-065, transmittance}}.
    type: intensional
  - content: Reflectance, <i>ρ</i>, is the sum of {{17-24-066, regular reflectance}},
      <i>ρ</i><sub>r</sub>, and {{17-24-068, diffuse reflectance}}, <i>ρ</i><sub>d</sub>:<sub>
      </sub><i>ρ</i> = <i>ρ</i><sub>r</sub> + <i>ρ</i><sub>d</sub>.
    type: intensional
  - content: The reflectance has unit one.
    type: intensional
  - content: This entry was numbered 845-04-58 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1058 in CIE S 017:2011.
    type: intensional
