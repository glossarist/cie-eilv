data:
  definition:
  - content: |-
      three empirical laws that describe colour-matching properties of {17-23-030, additive mixture}s of {17-23-002, colour stimulus}:
      • to specify a colour match, three independent variables are necessary and sufficient,
      • for an {17-23-030, additive mixture} of {17-23-002, colour stimulus}, only their {17-23-038, tristimulus values} are relevant, not their spectral compositions,
      • in an {17-23-030, additive mixture} of {17-23-002, colour stimulus}, if one or more components of the mixture are gradually changed, the resulting {17-23-038, tristimulus values} also change gradually
    type: intensional
  examples: []
  notes:
  - content: Grassman's laws do not hold for all observing conditions.
    type: intensional
  - content: This entry was numbered 845-03-17 in IEC 60050-845:1987.
    type: intensional
