  definition:
  - content: spectrophotometric mode of measurement, where a means of {{17-21-025,
      wavelength}} separation ({{17-25-101, monochromator}}, bandpass filters/wedge)
      precedes the sample and the total (reflected or transmitted plus fluoresced)
      {{17-21-038, radiant flux}} leaving the sample is measured by the {{17-25-035,
      detector}} at the stated monochromatic {{17-21-025, wavelength}}
