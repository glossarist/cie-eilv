data:
  definition:
  - content: artificial source specified by the CIE whose radiation approximates a {{concept:cie-2020:17-23-021, CIE standard illuminant}}
    type: intensional
  examples: []
  notes:
  - content: Artificial sources representing CIE illuminants are referred to as "CIE sources".
    type: intensional
  - content: See also "CIE standard illuminant".
    type: intensional
