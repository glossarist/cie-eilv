data:
  definition:
  - content: quantity involved in the visual observation of a source of light when viewed directly from the distance where its apparent diameter just becomes inappreciable
    type: intensional
  examples: []
  notes:
  - content: The point brilliance is measured by the illuminance produced by the source on a plane, at the observer's eye, normal to the direction of the source.
    type: intensional
  - content: The point brilliance is expressed in lux (lx = lmcdotm^-2^).
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-59, 845-01-59}} in IEC 60050-845:1987.
    type: intensional
