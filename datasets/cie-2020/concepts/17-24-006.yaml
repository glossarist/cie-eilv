data:
  definition:
  - content: 'approximate form of Planck''s law, valid with an approximation better than one part in 1 000 when the product stem:[lambdaT] is smaller than 0,002 mcdotK


      stem:[L_{(e , lambda)} ( lambda , T ) = ((c_1))/(pi) lambda^{- 5} e^{((c_2))/((lambda T))}]


      where stem:[L_{e,lambda}] is spectral radiance, stem:[lambda] is the wavelength in vacuum, stem:[T] is thermodynamic temperature, stem:[c_1 \ = 2 \ pi \ h \ c_0^2], stem:[c_2 \ = h \ c_0 \ // \ k], stem:[h] is the Planck constant, stem:[c_0] is the {{cite:IEV:113-01-34, speed of light in vacuum}}, and stem:[k] is the Boltzmann constant'
    type: intensional
  examples: []
  notes:
  - content: The formula is sometimes written with stem:[((c_1))/((pi omega_0))] instead of stem:[((c_1))/(pi)], where stem:[Omega_0] is the solid angle of magnitude 1 sr.
    type: intensional
  - content: For a detector in a medium of refractive index stem:[n], the measured radiance is stem:[n^{-2}]stem:[L_{e,lambda}](stem:[lambda], stem:[T]).
    type: intensional
  - content: Wien's law can also be expressed to give the approximate {{concept:cie-2020:17-21-029, spectral distribution}} of radiant exitance stem:[M_{e,lambda}](stem:[lambda], stem:[T]); the first factor in the formula is then stem:[c_1] instead of stem:[((c_1))/(pi)].
    type: intensional
  - content: The quantities radiance (as referred to in Note 2 to entry) and radiant exitance (as referred to in Note  3 to entry) apply to the {{concept:cie-2020:17-21-021, unpolarized radiation}} as emitted.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-06, 845-04-06}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1435 in CIE S 017:2011.
    type: intensional
