data:
  definition:
  - content: "{17-30-001, luminaire} that can easily be moved from one place to another
      even while connected to the power supply"
    type: intensional
  examples: []
  notes:
  - content: "{17-30-001, luminaire}s for wall mounting provided with a supply cord
      for connection to a plug and {17-30-001, luminaire}s which can be fixed to their
      support by means of a wing screw, a clip or a hook so that they can easily be
      removed from their support by hand, are considered to be portable luminaires."
    type: intensional
