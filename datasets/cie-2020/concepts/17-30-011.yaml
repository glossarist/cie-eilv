data:
  definition:
  - content: luminaire that can easily be moved from one place to another even while connected to the power supply
    type: intensional
  examples: []
  notes:
  - content: Luminaires for wall mounting provided with a supply cord for connection to a plug and luminaires which can be fixed to their support by means of a wing screw, a clip or a hook so that they can easily be removed from their support by hand, are considered to be portable luminaires.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-10-09, 845-10-09}} in IEC 60050-845:1987.
    type: intensional
