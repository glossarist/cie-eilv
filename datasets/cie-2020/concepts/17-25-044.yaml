data:
  definition:
  - content: photoelectric detector in which a photocurrent is generated by absorption
      of {{concept:cie-2020:17-21-002, optical radiation}} in the neighbourhood of
      a p-n junction between two semiconductors or a junction between a semiconductor
      and a metal
