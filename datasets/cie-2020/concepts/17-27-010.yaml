data:
  definition:
  - content: '{{cite:IEV:192-01-03, system}} designed to provide {{concept:cie-2020:17-29-001, lighting}}'
    type: intensional
  examples: []
  notes:
  - content: A lighting system can be dedicated to<ol type="a">. the support of one or more specified visual tasks under specified conditions considering other requirements such as human comfort, safety, the appearance of the surrounding environment and energy consumption;. the support of other than human tasks.
    type: intensional
  - content: 'A lighting system can include a set of light sources, other physical components, communication protocols, user interfaces, software and networks to provide control and monitoring functions.


      Note 3 to entry: The light source(s) and the related equipment can be integrated in a single item, e.g. an LED module, a lamp or a luminaire.


      Note 4 to entry: A lighting system can be networked to provide central or remote control and monitoring functions.


      Note 5 to entry: A lighting system can be connected to or integrated with other systems or devices.'
    type: intensional
  - content: The {{concept:cie-2020:17-27-001, light source}}(s) and the related equipment can be integrated in a single item, e.g. an {{concept:cie-2020:17-27-058, LED module}}, a lamp or a {{concept:cie-2020:17-30-001, luminaire}}.
    type: intensional
  - content: A lighting system can be networked to provide central or remote control and monitoring functions.
    type: intensional
  - content: A lighting system can be connected to or integrated with other systems or devices.
    type: intensional
