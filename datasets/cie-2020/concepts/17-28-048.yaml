data:
  definition:
  - content: unit inserted between the <a href="http://std.iec.ch/iev/iev.nsf/display?openform&ievref=151-13-75">power
      supply</a> and at least one {{17-27-001, light source}}, which serves to supply
      the {{17-27-001, light source}}(s) with its (their) rated voltage or rated current,
      and which can consist of one or more separate components
    type: intensional
  examples: []
  notes:
  - content: A control gear can include means for igniting, dimming, correcting the
      power factor and suppressing radio interference, and further control functions.
    type: intensional
  - content: A control gear can consist of a <a href="http://std.iec.ch/iev/iev.nsf/display?openform&ievref=151-13-75">power
      supply</a> and a control unit.
    type: intensional
  - content: A control gear can be partly or totally integrated in the {{17-27-001,
      light source}}.
    type: intensional
  - content: The terms "control gear" and "controlgear" are interchangeable. In IEC
      standards, the term "controlgear" is commonly used.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: control gear
    usage_info: for an electric light source
  - type: symbol
    normative_status: preferred
    designation: controlgear, <for an electric light source>
