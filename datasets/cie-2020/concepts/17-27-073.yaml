data:
  definition:
  - content: "{17-27-008, electric lamp} in which the {17-28-001, luminous element}
      is so mounted that the {17-27-008, electric lamp} can be used with an optical
      system projecting the light in chosen directions"
    type: intensional
  examples: []
  notes:
  - content: The term "projector lamp" includes various types of {17-27-008, electric
      lamp} such as {17-30-033, floodlight} lamps, {17-30-032, spotlight} lamps, studio
      lamps.
    type: intensional
