data:
  definition:
  - content: electric lamp in which the luminous element is so mounted that the electric
      lamp can be used with an optical system projecting the light in chosen directions
    type: intensional
  examples: []
  notes:
  - content: The term "projector lamp" includes various types of electric lamp such
      as floodlight lamps, spotlight lamps, and studio lamps.
    type: intensional
