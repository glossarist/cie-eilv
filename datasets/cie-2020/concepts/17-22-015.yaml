data:
  definition:
  - content: state of the visual system after an adaptation process has been completed
    type: intensional
  examples: []
  notes:
  - content: The term "light adaptation" is used when the luminances of the stimuli are of at least 10 cdcdotm^−2^ and the term "dark adaptation" is used when the luminances of the stimuli are of less than a few hundredths of a cdcdotm^−2^.
