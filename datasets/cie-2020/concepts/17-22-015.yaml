data:
  definition:
  - content: state of the visual system after an {{17-22-012, adaptation}} process
      has been completed
    type: intensional
  examples: []
  notes:
  - content: The term "light adaptation" is used when the luminances of the stimuli
      are of at least 10 cd·m<sup>−2</sup>, and the term "dark adaptation" is used
      when the luminances of the stimuli are of less than a few hundredths of a cd·m<sup>−2</sup>.
    type: intensional
