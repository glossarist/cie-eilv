data:
  definition:
  - content: curve traced on a sphere that has its centre at the light centre of the
      light source, joining all the points corresponding to those directions in which
      the luminous intensity is the same, or a plane projection of that curve
    type: intensional
  examples: []
  notes:
  - content: The English terms "isocandela curve" and "isocandela line", and the French
      term "courbe isocandela" are no longer in use.
    type: intensional
  - content: This entry was numbered 845-09-28 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-618, 17-620, 17-613, and 17-615 in CIE S 017:2011.
    type: intensional
