data:
  definition:
  - content: law stating that when a point on the {{17-22-001, retina}} is excited
      by a {{17-22-125, light stimulus}} that undergoes periodic variations in magnitude
      at a frequency that exceeds the critical {{17-22-092, flicker}} frequency ,
      the {{17-22-082, visual perception}} produced is identical to that produced
      by a steady stimulus whose magnitude is equal to the mean magnitude of the variable
      stimulus taken over one period
    type: intensional
  examples: []
  notes:
