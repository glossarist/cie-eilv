data:
  definition:
  - content: modification of the visual response that occurs when two colour stimuli
      (of any spectral irradiance distribution) are viewed side-by-side, where each
      stimulus affects the appearance of the other
    type: intensional
  examples: []
  notes:
  - content: Chromatic induction is virtually instantaneous, in contrast to chromatic
      adaptation which is considered to develop slowly in the visual system.
    type: intensional
  - content: This entry was numbered 17-142 in CIE S 017:2011.
    type: intensional
