data:
  definition:
  - content: 'relative decrease in radiant flux caused by scattering expressed by the relative density of the spectral radiant flux, stem:[s(lambda)=1/(Phi_(e,lambda)(lambda)) ("d"Phi_(e,lambda)(lambda))/("d"I)](stem:[lambda]), with respect to propagation length, stem:[l], of a collimated beam at a point in a diffusing medium


      stem:[s ( lambda ) = (1)/((Phi_{(e , lambda)} ( lambda ))) ((d Phi_{(e , lambda)} ( lambda )))/((d l))]'
    type: intensional
  examples: []
  notes:
  - content: The spectral linear scattering coefficient is expressed in metre to the power minus one stem:[m^(-1)].
    type: intensional
