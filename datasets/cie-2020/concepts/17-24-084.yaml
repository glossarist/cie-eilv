data:
  definition:
  - content: relative decrease in {{17-21-038, radiant flux}} caused by {{17-24-049,
      scattering}} expressed by the relative density of the spectral radiant flux,
      <i>Φ</i><sub>e,</sub><i><sub>λ</sub></i><sub>(</sub><i>λ</i><sub>)</sub>, with
      respect to propagation length, <i>l</i>, of a collimated beam at a point in
      a diffusing medium
    type: intensional
  examples: []
  notes:
  - content: The spectral linear scattering coefficient is expressed in metre to the
      power minus one (m<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 845-04-77 in IEC 60050-845:1987.
    type: intensional
