data:
  definition:
  - content: location where the optic nerve joins to the {17-22-001, retina} and where
      there are no photoreceptors
    type: intensional
  examples: []
  notes:
  - content: Because there are no photoreceptors at the blind spot, the {17-22-001,
      retina} cannot respond to light at this location.
    type: intensional
  - content: The retinal location of the blind spot is about 15° nasal from the {17-22-006,
      fovea} in the {17-22-079, visual angle} and subtends about 7° in height and
      about 5° in width.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
