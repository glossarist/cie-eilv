data:
  definition:
  - content: wavelength of the monochromatic stimulus that, when additively mixed in suitable proportions with the specified achromatic stimulus, matches the colour stimulus considered in the CIE 1931 stem:[x], stem:[y] chromaticity diagram
    type: intensional
  examples: []
  notes:
  - content: In the case of purple stimuli, the dominant wavelength is replaced by the complementary wavelength.
    type: intensional
  - content: The dominant wavelength is expressed in nanometre (nm).
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-03-44, 845-03-44}} in IEC 60050-845:1987.
    type: intensional
