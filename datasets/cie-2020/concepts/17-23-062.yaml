data:
  definition:
  - content: "{17-21-025, wavelength} of the {17-23-011, monochromatic stimulus} that,
      when additively mixed in suitable proportions with the specified {17-23-009,
      achromatic stimulus}, matches the {17-23-002, colour stimulus} considered in
      the CIE 1931 <i>x</i>, <i>y</i> chromaticity diagram"
    type: intensional
  examples: []
  notes:
  - content: In the case of purple stimuli, the dominant wavelength is replaced by
      the {17-23-063, complementary wavelength}.
    type: intensional
  - content: The dominant wavelength is expressed in nanometre (nm).
    type: intensional
  - content: This entry was numbered 845-03-44 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-345 in CIE S 017:2011.
    type: intensional
