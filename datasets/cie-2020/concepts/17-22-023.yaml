data:
  definition:
  - content: anomaly of vision in which there is a reduced ability to discriminate
      between some or all {{17-22-040, colour}}s
    type: intensional
  examples: []
  notes:
  - content: |-
      Types of defective colour vision include
      – {{17-22-035, anomalous trichromatism}}: {{17-22-025, deuteranomaly}}, {{17-22-030, protanomaly}} and {{17-22-033, tritanomaly}};
      – {{17-22-027, dichromatism}}: {{17-22-026, deuteranopia}}, {{17-22-031, protanopia}} and {{17-22-034, tritanopia}};
      – {{17-22-028, monochromatism}}.
    type: intensional
  - content: This entry was numbered 845-02-13 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-287 in CIE S 017:2011.
    type: intensional
