data:
  definition:
  - content: piece of metal, usually of cylindrical shape, fixed at the end of the
      {{17-28-015, cap}} so as to engage in the corresponding hole in a lampholder
      for fixing the cap and/or for making contact
    type: intensional
  examples: []
  notes:
  - content: The terms "pin" and "post" generally indicate a difference in size, a
      pin being smaller than a post.
    type: intensional
