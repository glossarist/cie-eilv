data:
  definition:
  - content: value below which the average illuminance over a specified surface is
      not permitted to fall
    type: intensional
  examples: []
  notes:
  - content: The maintained average illuminance is the average illuminance over the
      specified surface at the time maintenance should be carried out.
    type: intensional
  - content: The maintained average illuminance is expressed in lux (lx &amp;equals;
      lm·m^−2^).
    type: intensional
  - content: This entry was numbered 17-750 in CIE S 017:2011.
    type: intensional
