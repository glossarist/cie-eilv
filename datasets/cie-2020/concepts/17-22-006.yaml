data:
  definition:
  - content: central part of the retina, thin and depressed, which contains almost
      exclusively cones and forming the site of most distinct vision
    type: intensional
  examples: []
  notes:
  - content: The fovea subtends an angle of about 0,087 rad (5°) in the field of vision.
