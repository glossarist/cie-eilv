data:
  definition:
  - content: quotient of the sum of the solid angles subtended by clouds and the solid
      angle 2π sr of the whole sky
    type: intensional
  examples: []
  notes:
  - content: Observation of total cloud amount is usually recorded in tenths or oktas,
      where one okta indicates an extent of cloud cover equal to one eighth of the
      sky.
    type: intensional
  - content: The total cloud amount has unit one.
    type: intensional
  - content: This entry was numbered {{cite:845-09-92, 845-09-92}} in IEC 60050-845:1987.
