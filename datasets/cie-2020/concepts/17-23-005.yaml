data:
  definition:
  - content: object colour stimuli that correspond to objects whose luminance factors have maximum possible values for each chromaticity when their spectral luminance factors do not exceed unity for any wavelength
    type: intensional
  examples: []
  notes:
  - content: Optimal colour stimuli correspond, in general, to objects whose spectral luminance factors have values of either unity or zero, with not more than two transitions between them.
    type: intensional
  - content: The luminance factors and chromaticity coordinates of optimal colour stimuli define the boundaries of a colour solid corresponding to non-fluorescent objects.
    type: intensional
  - content: For a given luminance factor, optimal colour stimuli define the maximum purity possible for non-fluorescent objects.
    type: intensional
  - content: See also "{{concept:cie-2020:17-22-042, object colour}}", "{{concept:cie-2020:17-23-002, colour stimulus}}".
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-03-40, 845-03-40}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-851, 17-851}} in CIE S 017:2011.
    type: intensional
