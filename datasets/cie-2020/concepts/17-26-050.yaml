data:
  definition:
  - content: effective radiance with the spectral radiance, stem:[Llambda], spectrally weighted with the retinal thermal hazard spectral weighting function, stem:[r](stem:[lambda])
    type: intensional
  examples: []
  notes:
  - content: The wavelength range for "retinal thermal radiance" is the "{{concept:cie-2020:17-26-048, retinal hazard spectral region}}".
    type: intensional
  - content: This definition is based on the assumption that an action spectrum is adopted for the effect considered, and that its maximum value is 1.
    type: intensional
  - content: It is essential to specify which action spectrum is used, as the unit is the same for any action spectrum.
    type: intensional
  - content: The retinal thermal radiance is expressed in watt per square metre per steradian stem:[W cdot m^(-2) cdot sr^(-1)].
    type: intensional
  - content: This entry was numbered 17-1102 in CIE S 017:2011.
    type: intensional
