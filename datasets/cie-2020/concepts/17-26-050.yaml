data:
  definition:
  - content: effective {17-21-049, radiance} with the {17-21-052, spectral radiance},
      <i>L<sub>λ</sub></i>, spectrally weighted with the {17-26-049, retinal thermal
      hazard spectral weighting function}, <i>r</i>(<i>λ</i>)
    type: intensional
  examples: []
  notes:
  - content: The {17-21-025, wavelength} range for retinal thermal radiance is the
      {17-26-048, retinal hazard spectral region}.
    type: intensional
  - content: This definition is based on the assumption that an {17-26-027, action
      spectrum} is adopted for the effect considered, and that its maximum value is
      1.
    type: intensional
  - content: It is essential to specify which {17-26-027, action spectrum} is used,
      as the unit is the same for any {17-26-027, action spectrum}.
    type: intensional
  - content: The retinal thermal radiance is expressed in watt per square metre per
      steradian (W⋅m<sup>−2</sup>·sr<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 17-1102 in CIE S 017:2011.
    type: intensional
