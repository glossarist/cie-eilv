data:
  definition:
  - content: quotient of the radiant flux of the radiation emitted by a {{concept:cie-2020:17-24-040,
      photoluminescent material}} and the radiant flux of the radiation absorbed by
      that material
    type: intensional
  examples: []
  notes:
  - content: The term "photoluminescence radiant yield" is also used for the elementary
      process with a similar meaning, namely the quotient of the energy of the emitted
      photon and the energy of the absorbed photon which gave rise to it.
    type: intensional
  - content: The photoluminescence radiant yield has unit one.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-31, 845-04-31}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-907 in CIE S 017:2011.
    type: intensional
