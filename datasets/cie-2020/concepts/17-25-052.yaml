  definition:
  - content: detector of {{17-21-002, optical radiation}} which utilizes the interaction
      between radiation and matter resulting in the absorption of photons with the
      consequent initiation of an elementary event for each photon absorbed, thereby
      generating an output proportional to the photon number involved
