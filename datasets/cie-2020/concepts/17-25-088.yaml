data:
  definition:
  - content: general principle that, in the absence of losses, the elementary {17-21-038,
      radiant flux} or {17-21-039, luminous flux}, d<i>Φ</i>, between two elementary
      areas d<i>A</i> and d<i>A</i>′ defining an elementary beam is proportional to
      the elementary projected areas d<i>A</i>cos<i>θ</i> and d<i>A</i>′cos<i>θ </i>′
      in the direction of the beam and inversely proportional to the squared distance,
      <i>l</i>, between the areas.
    type: intensional
  examples: []
  notes:
  - content: |-
      The basic law of radiometry and photometry is expressed by

      where the proportionality factor for this geometrical condition is equal to the {17-21-049, radiance} or {17-21-050, luminance}, respectively, within the elementary beam.
    type: intensional
  - content: The basic law of radiometry and photometry is based on the {17-21-047,
      geometric extent}.
    type: intensional
