data:
  definition:
  - content: cloudless sky for which the relative {{17-21-050, luminance}} distribution
      is given by the {{17-21-050, luminance}} gradation function, <i>φ</i>(<i>Z</i>),
      which relates the {{17-21-050, luminance}} of a sky element to its zenith angle,
      <i>Z </i>
    type: intensional
  examples: []
  notes:
  - content: For additional information, see ISO 15469/CIE S 011, <i>Spatial distribution
      of daylight – CIE standard general sky</i>.
    type: intensional
