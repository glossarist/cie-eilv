data:
  definition:
  - content: quotient of the {17-29-047, downward flux} of a {17-30-001, luminaire},
      measured under specified practical conditions with its own lamps and equipment,
      and the sum of the individual {17-21-039, luminous flux}es of the same lamps
      when operated outside the {17-30-001, luminaire} with the same equipment, under
      specified conditions
    type: intensional
  examples: []
  notes:
  - content: The downward light output ratio has unit one.
    type: intensional
  - content: This entry was numbered 845-09-40 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-352 and 17-344 in CIE S 017:2011.
    type: intensional
