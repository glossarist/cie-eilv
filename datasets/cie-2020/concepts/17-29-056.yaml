data:
  definition:
  - content: ratio of the maximum {{17-21-045, luminous intensity}} of the {{17-30-001,
      luminaire}}, generally a {{17-30-030, projector}}, to the {{17-29-040, mean
      spherical luminous intensity}} of its lamp
    type: intensional
  examples: []
  notes:
  - content: In certain countries, the definition of the magnification ratio varies
      according to the types of {{17-30-001, luminaire}}s or lamps.
    type: intensional
  - content: The magnification ratio has unit one.
    type: intensional
  - content: This entry was numbered 845-09-43 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-748 in CIE S 017:2011.
    type: intensional
