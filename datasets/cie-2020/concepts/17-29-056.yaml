data:
  definition:
  - content: ratio of the maximum luminous intensity of the luminaire, generally a
      {{17-30-030, projector}}, to the mean spherical luminous intensity of its lamp
    type: intensional
  examples: []
  notes:
  - content: In certain countries, the definition of the magnification ratio varies
      according to the types of luminaires or lamps.
    type: intensional
  - content: The magnification ratio has unit one.
    type: intensional
