data:
  definition:
  - content: |-
      detectivity, stem:[D], normalized to take into account two important parameters of the detection system, the sensitive area, stem:[A], of the detector and the measurement bandwidth, stem:[Delta f]

      stem:[D * = D ( A Delta f )^(1 // 2) = Phi_m^(- 1) ( A Delta f )^(1 // 2)]

      where stem:[Phi_m] is noise equivalent power
    type: intensional
  examples: []
  notes:
  - content: The concept "normalized detectivity" is realistic only if the responsivity
      and noise output of the detector are <<103-06-02, frequency>> independent throughout
      the frequency range under consideration and if the noise equivalent input varies
      as the square root of the detector area; this is not always the case.
    type: intensional
  - content: The normalized detectivity is expressed in metre hertz to the power one
      half per watt (m·Hz^1/2^·W^−1^).
    type: intensional
