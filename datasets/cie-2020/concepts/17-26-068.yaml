data:
  definition:
  - content: actinic dose, using the erythema spectral weighting function, that produces
      a just noticeable actinic erythema on a single individual's previously unexposed
      skin
    type: intensional
  examples: []
  notes:
  - content: 'The minimal erythema dose is a subjective measure based on the reddening
      of the skin; it depends on many variables, e.g. individual sensitivity to {{17-21-008,
      ultraviolet radiation}}, radiometric characteristics of the source, skin pigmentation,
      anatomic site, elapsed time between irradiation and observation of the reddening
      (typical value: 24 h). Since the minimal erythema dose varies with each individual,
      the use of this quantity should be reserved solely for observational studies
      in humans and other animals.'
    type: intensional
  - content: See also "{{17-26-069, standard erythema dose}}".
    type: intensional
  - content: The minimal erythema dose is expressed in joule per square metre (J·m^−2^).
    type: intensional
