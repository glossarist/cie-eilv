data:
  definition:
  - content: stimulus that, under the prevailing conditions of adaptation, gives rise
      to a chromatic colour
    type: intensional
  examples: []
  notes:
  - content: In the colorimetry of object colours, stimuli having values of purity
      greater than 0 are usually considered to be chromatic stimuli.
    type: intensional
