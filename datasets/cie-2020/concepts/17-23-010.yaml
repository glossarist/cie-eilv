data:
  definition:
  - content: stimulus that, under the prevailing conditions of {{17-22-012, adaptation}},
      gives rise to a {{17-22-050, chromatic colour}}
    type: intensional
  examples: []
  notes:
  - content: In the {{17-25-014, colorimetry}} of {{17-22-042, object colour}}s, stimuli
      having values of {{17-23-064, purity}} greater than 0 are usually considered
      to be chromatic stimuli.
    type: intensional
