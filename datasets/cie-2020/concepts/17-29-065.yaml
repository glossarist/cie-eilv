data:
  definition:
  - content: quotient of the upward {17-21-039, luminous flux} of a {17-30-001, luminaire},
      measured under specified conditions with its own lamp(s) and equipment, and
      the sum of the individual {17-21-039, luminous flux}es of the same lamp(s) when
      operated outside the {17-30-001, luminaire} with the same equipment, under specified
      practical conditions
    type: intensional
  examples: []
  notes:
  - content: The upward light output ratio has unit one.
    type: intensional
  - content: This entry was numbered 17-1380 and 17-1359 in CIE S 017:2011.
    type: intensional
