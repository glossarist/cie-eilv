data:
  definition:
  - content: empirical law stating that colour stimuli that match in one set of adaptation
      conditions continue to do so in any other set
    type: intensional
  examples: []
  notes:
  - content: Von Kries' persistence law does not apply to all conditions.
    type: intensional
