data:
  definition:
  - content: quotient of the total radiant flux of all wavelengths emitted by the fluorescent process for an excitation wavelength and the total radiant excitation power irradiating the {{concept:cie-2020:17-24-041, fluorescent material}}
    type: intensional
  examples: []
  notes:
  - content: This quantity is also measured in relative terms by comparison to the radiant flux reflected from the perfect reflecting diffuser identically irradiated and viewed for a given excitation wavelength.
    type: intensional
  - content: Fluorescence is understood to include both fluorescent and phosphorescent phenomena with time constants short enough to be ignored for the application.
    type: intensional
  - content: The spectral external radiant efficiency of the fluorescent specimen has unit one.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
