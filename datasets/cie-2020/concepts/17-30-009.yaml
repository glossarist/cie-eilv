data:
  definition:
  - content: luminaire designed to withstand severe mechanical handling
    type: intensional
  examples: []
  notes:
  - content: 'The luminaire can:


      stem:[-] be permanently fixed, or


      stem:[-] be temporarily fixed on a construction or stand, or


      stem:[-] incorporate an integral stand or handle.'
    type: intensional
  - content: Rough service luminaires are for use where normally rough circumstances occur, or where temporary lighting is required, for example on building sites, in engineering workshops and for similar applications.
    type: intensional
