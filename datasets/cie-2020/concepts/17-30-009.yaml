data:
  definition:
  - content: "{{17-30-001, luminaire}} designed to withstand severe mechanical handling"
    type: intensional
  examples: []
  notes:
  - content: |-
      The luminaire can:
      – be permanently fixed, or
      – be temporarily fixed on a construction or stand, or
      – incorporate an integral stand or handle.
    type: intensional
  - content: Rough service luminaires are for use where normally rough circumstances
      occur, or where temporary {{17-29-001, lighting}} is required, for example on
      building sites, in engineering workshops and for similar applications.
    type: intensional
  sources:
