data:
  definition:
  - content: effective irradiance with the spectral irradiance, stem:[Elambda], spectrally weighted with the erythema spectral weighting function, stem:[s_{er}](stem:[lambda]), normalized to 1 at its maximum
    type: intensional
  examples: []
  notes:
  - content: This definition is based on the assumption that an action spectrum is adopted for the actinic effect considered, and that its maximum value is 1.
    type: intensional
  - content: It is essential to specify which action spectrum is used, as the unit is the same for any action spectrum.
    type: intensional
  - content: The erythemal irradiance is expressed in watt per square metre stem:[W cdot m^(-2)].
    type: intensional
  - content: This entry was numbered 17-403 in CIE S 017:2011.
    type: intensional
