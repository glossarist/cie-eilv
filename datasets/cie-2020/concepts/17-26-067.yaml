data:
  definition:
  - content: effective {17-21-053, irradiance} with the {17-21-056, spectral irradiance},
      <i>E<sub>λ</sub></i>, spectrally weighted with the {17-26-065, erythema spectral
      weighting function}, <i>s</i><sub>er</sub>(<i>λ</i>), normalized to 1 at its
      maximum
    type: intensional
  examples: []
  notes:
  - content: This definition is based on the assumption that an {17-26-027, action
      spectrum} is adopted for the {17-26-003, actinic} effect considered, and that
      its maximum value is 1.
    type: intensional
  - content: It is essential to specify which {17-26-027, action spectrum} is used,
      as the unit is the same for any {17-26-027, action spectrum}.
    type: intensional
  - content: The erythemal irradiance is expressed in watt per square metre (W⋅m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 17-403 in CIE S 017:2011.
    type: intensional
