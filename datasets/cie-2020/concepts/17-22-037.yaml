data:
  definition:
  - content: decrease in the {17-22-059, brightness} of a {17-22-125, light stimulus}
      with increasing eccentricity of the position of entry of a pencil of light through
      the pupil
    type: intensional
  examples: []
  notes:
  - content: When the variation is in {17-22-067, hue} and {17-22-073, saturation}
      instead of in {17-22-059, brightness}, the effect is called "Stiles–Crawford
      effect of the second kind".
    type: intensional
  - content: The Stiles–Crawford effect is predominantly present for cone vision.
    type: intensional
  - content: This entry was numbered 845-02-15 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1268 and 17-327 in CIE S 017:2011.
    type: intensional
