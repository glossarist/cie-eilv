data:
  definition:
  - content: vision by the normal eye in which {17-22-003, rods} are the principal
      active photoreceptors
    type: intensional
  examples: []
  notes:
  - content: Scotopic vision normally occurs when the eye is adapted to levels of
      {17-21-050, luminance} of less than 0,005 cd·m<sup>−2</sup>.
    type: intensional
  - content: In comparison with {17-22-016, photopic vision}, scotopic vision is characterized
      by the lack of colour perception and by a shift of the visual sensitivity function
      towards shorter {17-21-025, wavelength}s.
    type: intensional
  - content: This entry was numbered 845-02-10 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1142 in CIE S 017:2011.
    type: intensional
