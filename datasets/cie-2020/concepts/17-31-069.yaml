data:
  definition:
  - content: signal light carried on a vehicle to indicate its location when it is
      viewed from the front
    type: intensional
  examples: []
  notes:
  - content: A front position light can also, particularly if paired with an identical
      light, provide an indication of the width of the vehicle.
    type: intensional
  - content: The terms "sidelight" and "side-marker light" are commonly used for one
      of a pair of front position lights.
    type: intensional
  - content: This entry was numbered {{cite:845-11-73, 845-11-73}} in IEC 60050-845:1987.
    type: intensional
