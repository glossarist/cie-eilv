data:
  definition:
  - content: material whose visual appearance changes significantly depending on the
      angle at which it is illuminated or viewed
    type: intensional
  examples: []
  notes:
  - content: Examples of gonio-apparent materials include metallic flake pigments
      whose lightness changes most significantly, lustre pigments and interferometric
      coated pigments whose hue changes most significantly.
    type: intensional
  sources:
