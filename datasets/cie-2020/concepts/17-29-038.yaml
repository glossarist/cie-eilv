data:
  definition:
  - content: distribution of luminous intensity having at least one axis of symmetry
      or at least one plane of symmetry
    type: intensional
  examples: []
  notes:
  - content: Sometimes the term "symmetrical luminous intensity distribution" is used
      in the sense of the term "rotationally symmetrical luminous intensity distribution".
      This usage is to be discouraged.
    type: intensional
