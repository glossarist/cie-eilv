data:
  definition:
  - content: 'quantity obtained by spectrally weighting the spectral radiant exposure with the actinic action spectrum


      stem:[H_{(act)} = int int E_{(e , lambda)} ( t ) s_{(act)} ( lambda ) d lambda d t]


      where stem:[E_{e,stem:[lambd}])] stem:[is] stem:[the] stem:[spectral] stem:[irradiance] stem:[in] stem:[W cdot m]stem:[^{(-2}] stem:[cdot] stem:[nm]^-1) stem:[and]stem:[s_{act}](stem:[lambda]) is the actinic action spectrum normalized to 1 at its maximum'
    type: intensional
  examples: []
  notes:
  - content: This definition is based on the assumption that an action spectrum is adopted for the actinic effect considered, and that its maximum value is 1.
    type: intensional
  - content: It is essential to specify which actinic action spectrum is used, as the unit is the same for any action spectrum.
    type: intensional
  - content: The actinic dose is expressed in joule per square metre stem:[J cdot m^(-2)]
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-06-23, 845-06-23}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-14 in CIE S 017:2011.
    type: intensional
