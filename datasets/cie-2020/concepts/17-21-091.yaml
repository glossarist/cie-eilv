data:
  definition:
  - content: product of {17-21-035, spectral luminous efficiency} and {17-21-092,
      maximum luminous efficacy} for a specified photometric condition
    type: intensional
  examples: []
  notes:
  - content: The photometric condition should be specified (e.g. photopic, scotopic,
      mesopic). If it is not specified, {17-22-016, photopic vision} is assumed and
      the symbol <i>K</i>(<i>λ</i>) is used. For other photometric conditions the
      respective symbol for identification shall be used.
    type: intensional
  - content: |-
      Spectral luminous efficacy for {17-22-016, photopic vision} is expressed by
      <i>K</i>(<i>λ</i>) = <i>K</i><sub>m</sub> <i>V</i>(<i>λ</i>)
      where <i>K</i><sub>m</sub> is {17-21-092, maximum luminous efficacy}, <i>V</i>(<i>λ</i>) is {17-21-035, spectral luminous efficiency} and <i>λ</i> is {17-21-025, wavelength}.
    type: intensional
  - content: The spectral luminous efficacy is expressed in lumen per watt (lm⋅W<sup>−1</sup>).
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: spectral luminous efficacy
    usage_info: for a specified photometric condition
  - type: symbol
    normative_status: preferred
    designation: K(λ), <for photopic vision>; K′(λ), <for scotopic vision>; Kmes;m(λ),
      <for mesopic vision>; K10(λ), <for the CIE 10° photopic photometric observer>;
      KM(λ), <for the CIE 1988 modified 2° spectral luminous efficiency function for
      photopic vision>
