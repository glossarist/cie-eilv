data:
  definition:
  - content: product of {{concept:cie-2020:17-21-035, spectral luminous efficiency}} and maximum luminous efficacy for a specified photometric condition
    type: intensional
  examples: []
  notes:
  - content: The photometric condition should be specified (e.g. photopic, scotopic, mesopic). If it is not specified, photopic vision is assumed and the symbol stem:[K](stem:[lambda]) is used. For other photometric conditions, the respective symbol for identification shall be used.
    type: intensional
  - content: 'Spectral luminous efficacy for photopic vision is expressed by


      stem:[K](stem:[lambda]) = stem:[K_m] stem:[V](stem:[lambda])


      where stem:[K_m] is maximum luminous efficacy, stem:[V](stem:[lambda]) is spectral luminous efficiency and stem:[lambda] is wavelength.'
    type: intensional
  - content: The spectral luminous efficacy is expressed in lumen per watt (lmcdotW^-1^).
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: spectral luminous efficacy
    usage_info: for a specified photometric condition
  - type: symbol
    normative_status: preferred
    designation: stem:[K(lambda)], <for photopic vision>; K'(stem:[lambda]), <for scotopic vision>; Kmes;stem:[m(lambda)], <for mesopic vision>; K1stem:[0(lambda)], <for the CIE 10stem:[deg] photopic photometric observer>; Kstem:[M(lambda)], <for the CIE 1988 modified 2stem:[deg] spectral luminous efficiency function for photopic vision>
  language_code: eng
