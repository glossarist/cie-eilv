data:
  definition:
  - content: discharge tube having cathodes which can be coated with an electron emitting material and which, during the starting process without external heating, emits electrons by field emission
    type: intensional
  examples: []
  notes:
  - content: Tubular cold-cathode discharge lamps have a low-pressure filling of a rare gas (or a mixture of rare gases) and possibly mercury vapour.
    type: intensional
  - content: Tubular cold-cathode discharge lamps can have an inside coating of {{concept:cie-2020:17-24-041, fluorescent material}}s.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: tubular cold-cathode discharge lamp
  - type: expression
    normative_status: preferred
    designation: neon tube
