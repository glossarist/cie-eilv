data:
  definition:
  - content: measure of the degree to which the psychophysical colour of a CIE test sample illuminated by the test illuminant conforms to that of the same sample illuminated by the reference illuminant, suitable allowance having been made for the state of chromatic adaptation
    type: intensional
  examples: []
  notes:
  - content: See also CIE 13, _Method of Measuring and Specifying Colour Rendering of Light Sources_.
