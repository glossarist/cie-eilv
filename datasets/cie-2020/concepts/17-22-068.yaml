data:
  definition:
  - content: '{{concept:cie-2020:17-22-067, hue}} that cannot be further described by the use of hue names other than its own'
    type: intensional
  examples: []
  notes:
  - content: 'There are four unique hues: red, green, yellow and blue forming two pairs of opponent hues: red and green, yellow and blue.


      Note 2 to entry added: A "unique hue" is sometimes referred to as an "elementary hue".'
    type: intensional
