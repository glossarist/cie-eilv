data:
  definition:
  - content: "{{17-21-050, luminance}} in a given direction that results from {{17-24-001,
      emission}} at the surface of a photoluminescent medium under specified conditions
      of illumination, compared to the {{17-21-050, luminance}} in the same direction
      by the {{17-24-060, perfect reflecting diffuser}} identically illuminated"
    type: intensional
  examples: []
  notes:
  - content: The luminescent luminance factor depends upon the spectral power distribution
      of the illumination and this quantity is typically specified for a given {{17-23-019,
      CIE illuminant}} condition.
    type: intensional
  - content: The luminescent luminance factor has unit one.
    type: intensional
  - content: This entry was numbered 17-723 in CIE S 017:2011.
    type: intensional
