data:
  definition:
  - content: energy of electromagnetic waves weighted by the {{17-21-035, spectral
      luminous efficiency}} multiplied by maximum luminous efficacy of a specified
      photometric condition
    type: intensional
  examples: []
  notes:
  - content: |-
      Luminous energy for photopic vision is expressed by

      stem:[Q_v = K_m int_0^(oo) Q_((e , lambda)) ( lambda ) V ( lambda ) d lambda]

      where stem:[Q_(e,stem:[lambda])](stem:[lambda]) is the spectral radiant energy at wavelength stem:[lambda], stem:[V](stem:[lambda]) is spectral luminous efficiency, and stem:[K_m] is maximum luminous efficacy.
    type: intensional
  - content: The term "quantity of light" is no longer used.
    type: intensional
  - content: Luminous energy can be emitted, transferred or received.
    type: intensional
  - content: |-
      Luminous energy can be expressed by the time integral of the luminous flux, stem:[Phi_v], over a given duration, stem:[Delta t]:

      stem:[Q_v = int_((Delta t)) Phi_v d t]
    type: intensional
  - content: The corresponding radiometric quantity is "radiant energy". The corresponding
      quantity for photons is "photon energy".
    type: intensional
  - content: The luminous energy is expressed in lumen second (lm·s) or lumen hour
      (lm·h).
    type: intensional
  - content: This entry was numbered {{cite:845-01-28, 845-01-28}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-733 and 17-1007 in CIE S 017:2011.
    type: intensional
