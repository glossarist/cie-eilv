data:
  definition:
  - content: time required for a detector output to rise from a stated low percentage
      to a stated high percentage of the maximum value when a steady input is instantaneously
      applied
    type: intensional
  examples: []
  notes:
  - content: A value of 10 % is usually considered to be the low percentage value,
      whereas a value of 90 % is usually considered to be the high percentage value.
    type: intensional
  - content: The rise time is expressed in seconds (s).
    type: intensional
