data:
  definition:
  - content: quotient of the vertical optical thickness of a turbid atmosphere and
      the vertical optical thickness of the pure and dry atmosphere (Rayleigh atmosphere),
      related to the whole solar spectrum
    type: intensional
  examples: []
  notes:
  - content: |-
      The total turbidity factor can be expressed by

      stem:[T_L] = (stem:[delta_R] + stem:[delta_A] + stem:[delta_Z] + stem:[delta_W]) / stem:[delta_R]

      ~

      where~ stem:[delta_R] is the optical thickness with respect to Rayleigh scattering at the air molecules, and stem:[delta_A], stem:[delta_Z], stem:[delta_W] are the optical thicknesses with respect to Mie scattering and absorption at the aerosol particles, to ozone absorption, and to water vapour absorption respectively.
    type: intensional
  - content: The total turbidity factor has unit one.
    type: intensional
