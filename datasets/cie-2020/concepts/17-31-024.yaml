data:
  definition:
  - content: smallest {{17-21-060, illuminance}} ({{17-21-096, point brilliance}}),
      produced at the eye of an observer by a {{17-27-001, light source}} seen in
      {{17-31-023, point vision}}, which renders the {{17-21-032, source}} perceptible
      against a background of given {{17-21-050, luminance}}, where the {{17-21-060,
      illuminance}} is considered on a surface element that is normal to the incident
      rays at the eye
    type: intensional
  examples: []
  notes:
  - content: For visual signalling, the {{17-27-001, light source}} has to be rendered
      recognizable, and hence a higher threshold of illuminance is to be expected.
    type: intensional
  - content: This entry was numbered 845-11-26 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1313 in CIE S 017:2011.
    type: intensional
