data:
  definition:
  - content: lighting design technique where the light equally falls on objects in
      directions with and against the traffic
    type: intensional
  examples: []
  notes:
  - content: Symmetric lighting is characterized by using luminaires that show a luminous
      intensity distribution that is symmetric in relation to the plane normal to
      the direction of the traffic.
    type: intensional
  - content: See also "{{17-31-095, pro-beam lighting}}", "{{17-31-096, counter-beam
      lighting}}".
    type: intensional
  - content: This entry was numbered 17-1293 in CIE S 017:2011.
    type: intensional
