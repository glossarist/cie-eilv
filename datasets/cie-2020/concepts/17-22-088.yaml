data:
  definition:
  - content: smallest perceptible difference in luminance of two adjacent fields
    type: intensional
  examples: []
  notes:
  - content: A field superimposed on a second larger field (background) can also be taken as two adjacent fields.
    type: intensional
  - content: The value of the luminance difference threshold depends on the methodology, luminance, and on the viewing conditions, including the state of adaptation.
    type: intensional
  - content: The luminance difference threshold is expressed in candela per square metre (cdcdotm^-2^ = lmcdotm^-2^cdotsr^-1^).
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-02-46, 845-02-46}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-715 in CIE S 017:2011.
    type: intensional
