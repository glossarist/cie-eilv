data:
  definition:
  - content: "{{17-21-050, luminance}} of a comparison field in which radiation of
      frequency 540 × 10<sup>12</sup> Hz has the same {{17-22-059, brightness}} as
      the field considered under the specified photometric conditions of measurement,
      where the comparison field must have a specified size and shape which can be
      different from that of the field considered"
    type: intensional
  examples: []
  notes:
  - content: Radiation at a frequency of 540 × 10<sup>12</sup> Hz has a {{17-21-025,
      wavelength}} in standard air of approximately 555,017 nm.
    type: intensional
  - content: A comparison field can also be used in which the radiation has any {{17-21-030,
      relative spectral distribution}}, if the equivalent luminance of this field
      is known under the same conditions of measurement.
    type: intensional
  - content: The equivalent luminance is expressed in candela per square metre (cd⋅m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 845-01-58 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-397 in CIE S 017:2011.
    type: intensional
