data:
  definition:
  - content: quantity relating to the difference in {17-21-050, luminance} between
      two surfaces
    type: intensional
  examples: []
  notes:
  - content: |-
      Widely accepted definitions include:
      <i>C</i> = (<i>L</i><sub>1</sub> − <i>L</i><sub>2</sub>) / <i>L</i><sub>1</sub> with <i>L</i><sub>1</sub>> <i>L</i><sub>2 </sub> (positive contrast),
      <i>C</i> = (<i>L</i><sub>1</sub> − <i>L</i><sub>2</sub>) / <i>L</i><sub>1</sub> with <i>L</i><sub>1</sub> < <i>L</i><sub>2 </sub> (negative contrast),
      <i>C</i> = (<i>L</i><sub>1</sub> − <i>L</i><sub>2</sub>) / (<i>L</i><sub>1 </sub>+ <i>L</i><sub>2</sub>) with <i>L</i><sub>1</sub> > <i>L</i><sub>2</sub>,
      where <i>C</i> is the luminance contrast and <i>L</i><sub>1</sub> and <i>L</i><sub>2</sub> are the luminances of the two surfaces.
    type: intensional
  - content: Although luminance contrast is intended to correlate with brightness
      contrast, it is possible that it does not do so directly because brightness
      contrast depends on other factors such as the angular separation, the {17-21-050,
      luminance} gradient, and any size difference between the two surfaces.
    type: intensional
  sources:
