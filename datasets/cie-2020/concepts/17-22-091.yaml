data:
  definition:
  - content: quantity relating to the difference in luminance between two surfaces
    type: intensional
  examples: []
  notes:
  - content: "Widely accepted definitions include:\n\n<ul style=\"list-style-type:none;\">\n\n*
      stem:[C] = (stem:[L_1] − stem:[L_2])/stem:[L_1] with stem:[L_1] &gt; stem:[L_2]
      (positive contrast),\n\n* stem:[C] = (stem:[L_1] − stem:[L_2])/stem:[L_1] with
      stem:[L_1] &lt; stem:[L_2] (negative contrast), \n\n* stem:[C] = (stem:[L_1]
      − stem:[L_2])/(stem:[L_1] + stem:[L_2]) with stem:[L_1] &gt; stem:[L_2], \n\n\n\nwhere
      stem:[C] is the luminance contrast and stem:[L_1] and stem:[L_2] are the luminances
      of the two surfaces."
    type: intensional
  - content: Although luminance contrast is intended to correlate with brightness
      contrast, it is possible that it does not do so directly because brightness
      contrast depends on other factors such as the angular separation, the luminance
      gradient, and any size difference between the two surfaces.
    type: intensional
  sources:
