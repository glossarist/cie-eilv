data:
  definition:
  - content: quotient of the {{concept:cie-2020:17-21-029, spectral distribution}} of radiance due to fluorescence at wavelength stem:[lambda] and the sum of the tabulated values of this distribution across the fluorescence band
    type: intensional
  examples: []
  notes:
  - content: Fluorescence is understood to include both fluorescent and phosphorescent phenomena with time constants short enough to be ignored for the application.
    type: intensional
  - content: 'The relative spectral fluorescence distribution, stem:[F](stem:[lambda]), when multiplied by the spectral external radiant efficiency of the fluorescent specimen, stem:[Q], for excitation at wavelength, stem:[mu], gives the bispectral luminescent radiance factor, stem:[beta_(L,lambda)](stem:[mu]), of a {{concept:cie-2020:17-24-040, photoluminescent material}} according to:


      stem:[beta_(L,lambda)](stem:[mu]) = stem:[F](stem:[lambda])cdotstem:[Q](stem:[mu])'
    type: intensional
  - content: The relative spectral fluorescence distribution has unit one.
    type: intensional
  sources:
  - origin:
