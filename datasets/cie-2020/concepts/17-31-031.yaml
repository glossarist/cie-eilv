data:
  definition:
  - content: signal light designed to show a signal of one character over a narrow arc of the horizon, and used to indicate a particular direction
    type: intensional
  examples: []
  notes:
  - content: A direction light can also indicate an arc of the horizon to each side by dissimilar characters.
    type: intensional
