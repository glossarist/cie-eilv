data:
  definition:
  - content: quotient of the <<113-01-34, speed of light in vacuum>> and the speed
      of light in a medium
    type: intensional
  examples: []
  notes:
  - content: The value of the refractive index can depend on the <<103-06-02, frequency>>,
      polarization, and direction.
    type: intensional
  - content: The refractive index is expressed by stem:[n] = stem:[c_0]/stem:[c,]
      where stem:[c_0] is the speed of light in vacuum and stem:[c] is the speed of
      light in the medium.
    type: intensional
  - content: See also "{{17-24-111, complex refractive index}}.
    type: intensional
  - content: The refractivity is expressed by stem:[n] − 1, where stem:[n] is refractive
      index.
    type: intensional
  - content: The refractive index has unit one.
    type: intensional
  - content: This entry was numbered 845-04-101 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1074 in CIE S 017:2011.
    type: intensional
