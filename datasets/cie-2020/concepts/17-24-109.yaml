data:
  definition:
  - content: quotient of the speed of light in vacuum and the speed of light in a
      medium
  notes:
  - content: The value of the refractive index can depend on the frequency, polarization,
      and direction.
  - content: The refractive index is expressed by <i>n</i> = <i>c</i><sub>0</sub>/<i>c,</i>
      where <i>c</i><sub>0</sub> is the speed of light in vacuum and <i>c</i> is the
      speed of light in the medium.
  - content: See also "complex refractive index".
  - content: The refractivity is expressed by <i>n</i>−1, where <i>n</i> is refractive
      index.
  - content: The refractive index has unit one.
  - content: This entry was numbered 845-04-101 in IEC 60050-845:1987.
  - content: This entry was numbered 17-1074 in CIE S 017:2011.
