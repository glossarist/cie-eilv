data:
  definition:
  - content: measurement of quantities referring to radiation as evaluated according
      to a given {{17-21-035, spectral luminous efficiency}}, e.g. stem:[V](stem:[lambda])
      or stem:[V]′(stem:[lambda])
    type: intensional
  examples: []
  notes:
  - content: The term "photometry" is sometimes used in a broader sense covering the
      science of {{17-21-002, optical radiation}} measurement ({{17-25-005, radiometry}}),
      but this use is deprecated.
    type: intensional
  - content: This entry was numbered {{cite:845-05-09, 845-05-09}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-914 in CIE S 017:2011.
    type: intensional
