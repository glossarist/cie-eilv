data:
  definition:
  - content: weighting function that combines the normalized spectral sensitivities
      of the human eye and skin to {{17-21-008, ultraviolet radiation}} for radiation
      protection purposes
    type: intensional
  examples: []
  notes:
  - content: The {{17-21-025, wavelength}} range for the ultraviolet hazard spectral
      weighting function is specified in ICNIRP-recommendations as <i>λ</i> = 180
      nm to <i>λ</i> = 400 nm.
    type: intensional
  - content: This entry was numbered 17-1363 in CIE S 017:2011.
    type: intensional
