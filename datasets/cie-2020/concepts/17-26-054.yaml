data:
  definition:
  - content: weighting function that combines the normalized spectral sensitivities
      of the human eye and skin to {{concept:cie-2020:17-21-008, ultraviolet radiation}}
      for radiation protection purposes
    type: intensional
  examples: []
  notes:
  - content: The wavelength range for the ultraviolet hazard spectral weighting function
      is specified in ICNIRP-recommendations as stem:[lambda] = 180 nm to stem:[lambda] =
      400 nm.
    type: intensional
  - content: This entry was numbered 17-1363 in CIE S 017:2011.
    type: intensional
