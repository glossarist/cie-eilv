data:
  definition:
  - content: quotient of five times the sum of the area of the walls bounded by the floor and the working plane and the sum of the areas of the floor and the working plane, used in the calculation of the utilization factor or utilance
    type: intensional
  examples: []
  notes:
  - content: 'The floor cavity ratio is given by the formula


      stem:[K_f = (5 h_f (a+b))/(ab)]


      where stem:[a] and stem:[b] are the dimensions of the sides of the room and stem:[h_f] is the distance from the floor to the utilization plane.'
    type: intensional
  - content: See also "{{concept:cie-2020:17-29-074, ceiling cavity ratio}}" and "{{concept:cie-2020:17-29-072, room cavity ratio}}".
    type: intensional
  - content: The floor cavity ratio has unit one.
    type: intensional
  - content: This entry was numbered 17-452 in CIE S 017:2011.
    type: intensional
