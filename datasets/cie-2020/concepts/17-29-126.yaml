data:
  definition:
  - content: quotient of the illuminance on a horizontal plane at a given point inside
      a building due to the light received directly from the sky and the illuminance
      due to an unobstructed hemisphere of sky of uniform luminance equal to that
      of the visible sky
    type: intensional
  examples: []
  notes:
  - content: The sky factor has unit one.
    type: intensional
