data:
  definition:
  - content: delayed emission of {{17-21-002, optical radiation}} which appears 10
      ns or longer after the excitation
    type: intensional
  examples: []
  notes:
  - content: Technically, the term "phosphorescence" should be used only for the delayed
      emission due to a "forbidden transition" from an excited triplet state to a
      ground singlet state.
    type: intensional
  - content: This entry was numbered {{cite:845-04-23, 845-04-23}} in IEC 60050-845:1987.
