data:
  definition:
  - content: delayed {17-24-001, emission} of {17-21-002, optical radiation} which
      appears 10 ns or longer after the {17-24-020, excitation}
    type: intensional
  examples: []
  notes:
  - content: Technically, the term "phosphorescence" should be used only for the delayed
      {17-24-001, emission} due to a "forbidden transition" from an excited triplet
      state to a ground singlet state.
    type: intensional
  - content: This entry was numbered 845-04-23 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-880 in CIE S 017:2011.
    type: intensional
