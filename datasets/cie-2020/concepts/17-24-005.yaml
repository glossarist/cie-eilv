data:
  definition:
  - content: |-
      law giving the {{17-21-029, spectral distribution}} of {{17-21-049, radiance}} of a {{17-24-004, Planckian radiator}} as a function of {{17-21-025, wavelength}} and temperature

      where <i>L</i><sub>e,</sub><i><sub>λ</sub></i> is the {{17-21-052, spectral radiance}}, <i>λ</i> is the {{17-21-025, wavelength}} in vacuum, <i>T</i> is the thermodynamic temperature, , <i>c</i><sub>2</sub> = <i>h</i> <i>c</i><sub>0</sub> / <i>k</i>, <i>h</i> is the {{17-21-108, Planck constant}}, <i>c</i><sub>0 </sub>is the speed of light in vacuum, and <i>k</i> is the Boltzmann constant
    type: intensional
  examples: []
  notes:
  - content: The formula is sometimes written with instead of , where <i>Ω</i><sub>0</sub>
      is the {{17-21-109, solid angle}} of magnitude 1 sr.
    type: intensional
  - content: |-
      For a {{17-25-035, detector}} in a medium of {{17-24-109, refractive index}} <i>n</i>, the measured {{17-21-049, radiance}} is:
      <i>n</i><sup>2</sup><i>L</i><sub>e,</sub><i><sub>λ</sub></i>(<i>λ</i>, <i>T</i>).
    type: intensional
  - content: Planck's law can also be expressed to give the {{17-21-029, spectral
      distribution}} of {{17-21-080, radiant exitance}}, <i>M</i><sub>e,</sub><i><sub>λ</sub></i>(<i>λ</i>,
      <i>T</i>); the first factor in the formula is then <i>c</i><sub>1</sub> instead
      of .
    type: intensional
  - content: Both quantities ({{17-21-049, radiance}} and {{17-21-080, radiant exitance}})
      apply to the {{17-21-021, unpolarized radiation}} as emitted.
    type: intensional
  - content: For the up-to-date values of the {{17-21-108, Planck constant}}, <i>h</i>,
      the speed of light in vacuum, <i>c</i><sub>0</sub>, and the Boltzmann constant,
      <i>k</i>, see CODATA.
    type: intensional
  - content: This entry was numbered 845-04-05 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-958 in CIE S 017:2011.
    type: intensional
