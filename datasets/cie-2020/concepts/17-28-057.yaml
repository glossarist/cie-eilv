data:
  definition:
  - content: electronic device, being part of the {17-28-048, control gear}, designed
      for controlling the electric energy to the {17-27-053, LED light source}
    type: intensional
  examples: []
  notes:
  - content: The purpose of controlling the electric energy can be colour mixing,
      responding to depreciating {17-21-039, luminous flux}, and other features.
    type: intensional
  - content: In {17-27-060, semi-integrated LED module}s, the control unit of the
      {17-28-048, control gear} is part of the {17-27-058, LED module} and separate
      from the {17-28-056, power supply of the control gear}.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: control unit of the control gear
    usage_info: for an LED light source
