data:
  definition:
  - content: electronic device, being part of the control gear, designed for controlling the electric energy to the LED light source
    type: intensional
  examples: []
  notes:
  - content: The purpose of controlling the electric energy can be colour mixing, responding to depreciating luminous flux, and other features.
    type: intensional
  - content: In LEDsi modules, the control unit of the control gear is part of the LED module and separate from the power supply of the control gear.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: control unit of the control gear
    usage_info: for an LED light source
