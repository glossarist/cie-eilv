data:
  definition:
  - content: property of a quantity, stem:[X], pertaining to electromagnetic radiation
      that indicates that stem:[X] is a function of the {{17-21-025, wavelength}},
      stem:[lambda]
    type: intensional
  examples: []
  notes:
  - content: The quantity stem:[X] can also be expressed as a function of <<103-06-02,
      frequency>>, stem:[nu], {{17-21-026, wavenumber}}, stem:[sigma], etc.; the corresponding
      symbols are stem:[X](stem:[nu]), stem:[X](stem:[sigma]), etc. and stem:[Xnu],
      stem:[Xsigma], etc. See also "{{17-21-029, spectral distribution}}".
    type: intensional
  - content: This entry was numbered 845-01-16 in IEC 60050-845:1987.
    type: intensional
