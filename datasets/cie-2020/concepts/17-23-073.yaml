data:
  definition:
  - content: |-
      uniform chromaticity scale diagram produced by plotting in rectangular coordinates <i>v</i>′ against <i>u</i>′, quantities defined by the equations:
      <i>u</i>′ = 4 <i>X</i> / (<i>X</i> + 15<i>Y</i> + 3<i>Z</i>) = 4<i>x</i> / (−2<i>x</i> + 12<i>y</i> + 3)
      <i>v</i>′ = 9 <i>Y</i> / (<i>X</i> + 15<i>Y</i> + 3<i>Z</i>) = 9<i>y</i> / (−2<i>x</i> +12<i>y</i> + 3)
      where <i>X</i>, <i>Y</i>, <i>Z</i> are the {{17-23-038, tristimulus values}} in the CIE 1931 or 1964 standard colorimetric systems, and <i>x</i>, <i>y</i> are the corresponding {{17-23-053, chromaticity coordinates}} of the {{17-23-002, colour stimulus}} considered
    type: intensional
  examples: []
  notes:
  - content: 'The CIE 1976 uniform-chromaticity-scale diagram is a modification of,
      and supersedes, the {{17-23-079, CIE 1960 uniform-chromaticity-scale diagram}}
      in which <i>v</i> was plotted against <i>u</i> in rectangular coordinates. The
      relationships between the two pairs of coordinates are: <i>u</i>′ = <i>u</i>;
      <i>v</i>′ = 1,5 <i>v</i>.'
    type: intensional
  - content: This entry was numbered 845-03-53 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-162 and 17-161 in CIE S 017:2011.
    type: intensional
