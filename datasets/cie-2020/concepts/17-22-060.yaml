data:
  definition:
  - content: attribute of a {17-22-082, visual perception} according to which a {17-29-004,
      luminous environment} appears to contain more or less light
    type: intensional
  examples: []
  notes:
  - content: Spatial brightness can be perceived while immersed within a space or
      when a space is observed remotely but fills a large part of the {17-22-080,
      visual field}.
    type: intensional
  - content: Spatial brightness does not necessarily relate to the {17-22-059, brightness}
      of any individual objects or surfaces in the environment, but can be influenced
      by the {17-22-059, brightness} of these individual items.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: spatial brightness
  language_code: eng
