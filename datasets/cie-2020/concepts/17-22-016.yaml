data:
  definition:
  - content: vision by the normal eye in which {{17-22-002, cones}} are the principal
      active photoreceptors
    type: intensional
  examples: []
  notes:
  - content: Photopic vision normally occurs when the eye is adapted to levels of
      {{17-21-050, luminance}} of at least 5 cd·m<sup>−2</sup>.
    type: intensional
  - content: Colour perception is typical of photopic vision.
    type: intensional
  - content: This entry was numbered 845-02-09 in IEC 60050-845:1987.
    type: intensional
