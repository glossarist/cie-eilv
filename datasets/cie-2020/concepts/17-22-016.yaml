data:
  definition:
  - content: vision by the normal eye in which cones are the principal active photoreceptors
    type: intensional
  examples: []
  notes:
  - content: Photopic vision normally occurs when the eye is adapted to levels of
      luminance of at least 5 cd·m^−2^.
    type: intensional
  - content: Colour perception is typical of photopic vision.
    type: intensional
