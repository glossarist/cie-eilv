data:
  definition:
  - content: physical, chemical or biological change produced by the interaction of {{concept:cie-2020:17-21-002, optical radiation}} with matter, characterized by one photon interacting with one atom or molecule
    type: intensional
  examples: []
  notes:
  - content: Photoeffects include photoelectric, photo-optical, photochemical and photobiological effects, but radiant heating is normally not considered a photoeffect.
    type: intensional
