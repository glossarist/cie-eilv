data:
  definition:
  - content: electromagnetic radiation in which the electric field vector rotates at the radiation frequency, but varies in magnitude at a rate equal to twice the radiation frequency with the terminal point of the electric field vector describing an ellipse
    type: intensional
  examples: []
  notes:
  - content: Elliptically polarized radiation is described as right-handed (or left-handed) if the rotation of the electric field vector is clockwise (or anticlockwise) as viewed by an observer receiving the radiation.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-376, 17-376}} in CIE S 017:2011.
    type: intensional
