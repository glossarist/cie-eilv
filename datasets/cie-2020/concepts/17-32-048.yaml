data:
  definition:
  - content: file format and encoding used to store transforms that relate one {17-32-006,
      colour encoding} with another, in a form defined by the International Color
      Consortium (ICC)
    type: intensional
  examples: []
  notes:
  - content: For example, the ICC file format can be used to store the transforms
      used to convert device {17-32-009, colour image data} to colorimetrically equivalent
      {17-32-009, colour image data}, encoded in one of the ICC profile connection
      colour spaces, as part of a {17-32-014, colour management} system. The ICC file
      format specifies a number of transforms to be in each ICC profile file.
    type: intensional
  - content: This entry was numbered 17-544 and 17-547 in CIE S 017:2011.
    type: intensional
