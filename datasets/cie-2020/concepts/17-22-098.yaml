data:
  definition:
  - content: condition of vision in which there is discomfort or a reduction in the
      ability to see details or objects, caused by an unsuitable distribution or range
      of luminance, or by extreme luminance contrasts
    type: intensional
  examples: []
  notes:
  - content: See also "disability glare", "discomfort glare".
    type: intensional
