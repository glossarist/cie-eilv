data:
  definition:
  - content: 'density of incident photon flux with respect to area at a point on a real or imaginary surface


      stem:[E_p = ((d Phi_p))/((d A))]


      where stem:[Phi_p] is photon flux and stem:[A] is the area on which the photon flux is incident'
    type: intensional
  examples: []
  notes:
  - content: The corresponding radiometric quantity is "irradiance". The corresponding photometric quantity is "illuminance".
    type: intensional
  - content: The photon irradiance is expressed in second to the power minus one per square metre stem:[s^(-1) cdot m^(-2)].
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-39, 845-01-39}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-929 in CIE S 017:2011.
    type: intensional
