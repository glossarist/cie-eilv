data:
  definition:
  - content: quotient of the {17-21-045, luminous intensity}, <i>I</i>, of the {17-24-100,
      retroreflector} in the direction of observation and the {17-21-060, illuminance},
      <i>E</i><sub>⊥</sub>, at the {17-24-100, retroreflector} on a plane perpendicular
      to the direction of the incident light
    type: intensional
  examples: []
  notes:
  - content: The coefficient of luminous intensity is expressed in candela per lux
      (cd⋅lx<sup>−1</sup>).
    type: intensional
