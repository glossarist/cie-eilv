data:
  definition:
  - content: 'quotient of the luminous intensity, stem:[R = I/(E_(_|_))], of the retroreflector in the direction of observation and the illuminance, stem:[E_{ _|_ }], at the retroreflector on a plane perpendicular to the direction of the incident light


      stem:[R = (I)/((E_{ _|_ }))]'
    type: intensional
  examples: []
  notes:
  - content: The coefficient of luminous intensity is expressed in candela per lux stem:[cd cdot lx^(-1)].
    type: intensional
