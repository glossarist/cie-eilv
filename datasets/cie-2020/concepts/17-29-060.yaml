data:
  definition:
  - content: quotient of the sum of the individually rated luminous fluxes of the
      lamps of an installation and the floor area
    type: intensional
  examples: []
  notes:
  - content: The installed lamp flux density is expressed in lumen per square metre
      (lm·m^−2^).
