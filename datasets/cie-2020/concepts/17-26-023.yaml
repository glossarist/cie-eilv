data:
  definition:
  - content: retinal injury caused by brief, intense {17-21-071, radiant exposure}
      of the {17-22-001, retina} from {17-21-025, wavelength}s in the {17-26-048,
      retinal hazard spectral region} (380 nm to 1 400 nm) within which the normal
      ocular media transmit {17-21-002, optical radiation} to the {17-22-001, retina}
    type: intensional
  examples: []
  notes:
  - content: In IEC 62471/CIE S 009<i> Photobiological safety of lamp and lamp systems</i>
      the maximum assessment time is taken as 10 s.
    type: intensional
  - content: This entry was numbered 17-1101 in CIE S 017:2011.
    type: intensional
