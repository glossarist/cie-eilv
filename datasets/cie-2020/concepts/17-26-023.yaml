data:
  definition:
  - content: retinal injury caused by brief, intense radiant exposure of the retina from wavelengths in the retinal hazard spectral region (380 nm to 1 400 nm) within which the normal ocular media transmit {{concept:cie-2020:17-21-002, optical radiation}} to the retina
    type: intensional
  examples: []
  notes:
  - content: In IEC 62471/CIE S 009, _Photobiological safety of lamp and lamp systems_, the maximum assessment time is taken as 10 s.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-1101, 17-1101}} in CIE S 017:2011.
    type: intensional
