data:
  definition:
  - content: "{17-25-035, detector} of {17-21-002, optical radiation} whose quantum
      efficiency is independent of {17-21-025, wavelength} over the spectral range
      considered"
    type: intensional
  examples: []
  notes:
  - content: Quantum efficiency can refer to {17-25-074, external quantum efficiency}
      or {17-25-076, internal quantum efficiency}. If not explicitly stated, {17-25-074,
      external quantum efficiency} is assumed.
    type: intensional
  - content: See also "{17-25-109, quantum counter}".
    type: intensional
