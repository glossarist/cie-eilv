data:
  definition:
  - content: apparatus which distributes, filters or transforms the light transmitted
      from at least one {17-21-032, source} of {17-21-002, optical radiation} and
      which includes, except the {17-21-032, source}s themselves, all the parts necessary
      for fixing and protecting the {17-21-032, source}s and, where necessary, circuit
      auxiliaries together with the means for connecting them to the power supply
    type: intensional
