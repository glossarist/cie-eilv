data:
  definition:
  - content: ideal {{concept:cie-2020:17-24-003, thermal radiator}} that absorbs completely all incident radiation, whatever the wavelength, the direction of incidence or the polarization
    type: intensional
  examples: []
  notes:
  - content: A Planckian radiator has, for any wavelength and any direction, the maximum {{concept:cie-2020:17-21-029, spectral distribution}} of radiance for a thermal radiator in thermal equilibrium at a given temperature.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-04, 845-04-04}} in IEC 60050-845:1987.
    type: intensional
