data:
  definition:
  - content: ideal {17-24-003, thermal radiator} that absorbs completely all incident
      radiation, whatever the {17-21-025, wavelength}, the direction of incidence
      or the polarization
    type: intensional
  examples: []
  notes:
  - content: A Planckian radiator has, for any {17-21-025, wavelength} and any direction,
      the maximum {17-21-029, spectral distribution} of {17-21-049, radiance} for
      a {17-24-003, thermal radiator} in thermal equilibrium at a given temperature.
    type: intensional
  - content: This entry was numbered 845-04-04 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-960 and 17-93 in CIE S 017:2011.
    type: intensional
