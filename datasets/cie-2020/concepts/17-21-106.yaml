data:
  definition:
  - content: |-
      measure that expresses the attenuation of the {{17-29-158, direct illuminance}} when the Sun's rays cross vertically the pure and dry atmosphere (Rayleigh atmosphere)

      where <i>m</i> is the {{17-29-109, relative optical air mass}} weighted to take account of the relative spectral {{17-24-065, transmittance}} characteristics of the atmosphere
    type: intensional
  examples: []
  notes:
  - content: The luminous extinction coefficient has unit one.
    type: intensional
  - content: This entry was numbered 17-737 in CIE S 017:2011.
    type: intensional
