data:
  definition:
  - content: hollow sphere, the interior of which is formed from, or coated with,
      a diffusely-reflecting material that is as {{17-24-122, spectrally neutral}}
      and as spatially uniform as possible
    type: intensional
  examples: []
  notes:
  - content: Owing to the internal {{17-24-047, reflection}}s within the sphere, the
      {{17-21-060, illuminance}} on any part of the inside surface of the sphere for
      which the direct flux is hidden is theoretically proportional to the {{17-21-039,
      luminous flux}} entering the sphere or produced inside the sphere. The {{17-21-060,
      illuminance}} of the internal sphere wall can be measured via a small window.
    type: intensional
  - content: The window of an integrating sphere is often used in radiometric measurement
      systems to provide a {{17-21-032, source}} with good spatial uniformity and
      with an angular distribution of {{17-21-049, radiance}} or {{17-21-050, luminance}}
      that is close to {{17-24-062, Lambert's cosine law}}.
    type: intensional
  - content: This entry was numbered 845-05-24 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-591 and 17-1358 in CIE S 017:2011.
    type: intensional
