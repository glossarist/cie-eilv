data:
  definition:
  - content: 'density of incident luminous flux with respect to area at a point on a real or imaginary surface


      stem:[E_v = ((d Phi_v))/((d A))]


      where stem:[Phi_v] is luminous flux and stem:[A] is the area on which the luminous flux is incident'
    type: intensional
  examples: []
  notes:
  - content: 'Illuminance can be derived from the spectral irradiance distribution by


      stem:[E_v \ = \ K_m int_0^{oo} E_{(e , lambda)} ( lambda ) V ( lambda ) d lambda]


      where stem:[K_m] is maximum luminous efficacy, stem:[E_{e,stem:[lambd}])](stem:[lambda]) is the spectral irradiance at wavelength stem:[lambda] and stem:[V](stem:[lambda]) is {{concept:cie-2020:17-21-035, spectral luminous efficiency}}.'
    type: intensional
  - content: The corresponding radiometric quantity is "irradiance". The corresponding quantity for photons is "photon irradiance".
    type: intensional
  - content: The illuminance is expressed in lux stem:[lx = lm cdot m^(-2)].
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-38, 845-01-38}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-550 in CIE S 017:2011.
    type: intensional
