data:
  definition:
  - content: irradiance, when used in photochemistry, phototherapy and photobiology
    type: intensional
  examples: []
  notes:
  - content: When reporting the dose rate, the {{17-21-029, spectral distribution}}
      of the {{17-21-002, optical radiation}} shall be specified.
    type: intensional
  - content: The notion of rate applies similarly to actinic dose and effective dose.
    type: intensional
  - content: The dose rate is expressed in watt per square metre (W·m^−2^).
    type: intensional
