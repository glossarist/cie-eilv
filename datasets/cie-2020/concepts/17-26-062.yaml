data:
  definition:
  - content: 'quotient of blue light hazard weighted radiant flux and the stem:[a_(B,V) = (int Phi_(e,lambda)(lambda)*B(lambda)*"d"lambda)/(int Phi_(e,lambda)(lambda)*V(lambda)*"d"lambda)](stem:[lambda]) weighted radiant flux


      stem:[a_{(B ,v)} = ((int Phi_{(e , lambda)} ( lambda ) * B ( lambda ) * d lambda))/((int Phi_{(e , lambda)} ( lambda ) * V ( lambda ) * d lambda))]


      where stem:[lambda] is wavelength, stem:[Phi_{e,stem:[lambd}])](stem:[lambda]) is spectral radiant flux, stem:[B](stem:[lambda]) is the blue light hazard spectral weighting function, and stem:[V](stem:[lambda]) is the CIE {{concept:cie-2020:17-21-035, spectral luminous efficiency}} function for photopic vision'
    type: intensional
  examples: []
  notes:
  - content: Luminous radiation refers to {{concept:cie-2020:17-21-002, optical radiation}} weighted with the CIE spectral luminous efficiency function for photopic vision, stem:[V](stem:[lambda]).
    type: intensional
  - content: The use of this term is only reasonable if parts of the optical radiation are in the visible range and thus stem:[int Phi_(e,lambda)(lambda) * V(lambda) * "d" lambda != 0].
    type: intensional
  - content: The blue light hazard factor of luminous radiation has unit one.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: blue light hazard factor of luminous radiation
  - type: symbol
