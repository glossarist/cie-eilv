data:
  definition:
  - content: coordinates expressing the quotients of each of a set of three {{17-23-038,
      tristimulus values}} and their sum
    type: intensional
  examples: []
  notes:
  - content: As the sum of the three chromaticity coordinates is equal to 1, two of
      them are sufficient to define a chromaticity.
    type: intensional
  - content: In the CIE standard colorimetric systems, the chromaticity coordinates
      are represented by the symbols stem:[x], stem:[y], stem:[z] or stem:[x_(10)],
      stem:[y_(10)], stem:[z_(10)].
    type: intensional
  - content: The chromaticity coordinates have unit one.
    type: intensional
  - content: This entry was numbered 845-03-33 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-145 in CIE S 017:2011.
    type: intensional
