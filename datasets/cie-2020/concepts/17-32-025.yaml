data:
  definition:
  - content: region extending from the image to the limit of the surround
    type: intensional
  examples: []
  notes:
  - content: 'The natural viewing condition of colour imaging includes several physical
      regions: the image content, the background (content just beyond the image) and
      the surround. Each region has an effect on the total {{17-23-026, colour appearance}}
      of the image.'
