data:
  definition:
  - content: |-
      density of exiting photon flux with respect to area at a point on a real or imaginary surface

      stem:[M_p = ((d Phi_p))/((d A))]

      where stem:[Phi_p] is photon flux and stem:[A] is the area from which the photon flux leaves
    type: intensional
  examples: []
  notes:
  - content: The corresponding radiometric quantity is "radiant exitance". The corresponding
      photometric quantity is "luminous exitance".
    type: intensional
  - content: The photon exitance is expressed in second to the power minus one per
      square metre (s^−1^·m^−2^).
    type: intensional
  - content: This entry was numbered {{cite:845-01-49, 845-01-49}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-923 in CIE S 017:2011.
    type: intensional
