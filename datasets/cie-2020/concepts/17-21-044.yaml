data:
  definition:
  - content: 'density of radiant flux with respect to solid angle in a specified direction


      stem:[I_e = ((d Phi_e))/((d omega))]


      where stem:[Phi_e] is the radiant flux emitted in a specified direction, and stem:[Omega] is the solid angle containing that direction'
    type: intensional
  examples: []
  notes:
  - content: The definition holds strictly only for a {{concept:cie-2020:17-21-033, point source}}.
    type: intensional
  - content: 'The distribution of the radiant intensities as a function of the direction of emission, e.g. given by the polar angles (stem:[theta], stem:[phi]), is used to determine the radiant flux, stem:[Phi_e], within a certain solid angle, stem:[Omega], of a source:


      stem:[Phi_e = underset(omega)( iint ) I_e ( vartheta , phi ) sin vartheta d phi \ d vartheta].'
    type: intensional
  - content: The corresponding photometric quantity is "luminous intensity". The corresponding quantity for photons is "photon intensity".
    type: intensional
  - content: The radiant intensity is expressed in watt per steradian stem:[W cdot sr^(-1)].
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-30, 845-01-30}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1026 in CIE S 017:2011.
    type: intensional
