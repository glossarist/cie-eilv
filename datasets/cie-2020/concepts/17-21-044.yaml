data:
  definition:
  - content: |-
      density of {17-21-038, radiant flux} with respect to {17-21-109, solid angle} in a specified direction

      where <i>Φ</i><sub>e</sub> is the {17-21-038, radiant flux} emitted in a specified direction, and <i>Ω</i> is the {17-21-109, solid angle} containing that direction
    type: intensional
  examples: []
  notes:
  - content: The definition holds strictly only for a {17-21-033, point source}.
    type: intensional
  - content: |-
      The distribution of the radiant intensities as a function of the direction of {17-24-001, emission}, e.g. given by the polar angles (<i>ϑ</i>, <i>φ</i>), is used to determine the {17-21-038, radiant flux}, <i>Φ</i><sub>e</sub>, within a certain {17-21-109, solid angle}, <i>Ω</i>, of a {17-21-032, source}:
      .
    type: intensional
  - content: The corresponding photometric quantity is "{17-21-045, luminous intensity}".
      The corresponding quantity for photons is "{17-21-046, photon intensity}".
    type: intensional
  - content: The radiant intensity is expressed in watt per steradian (W⋅sr<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 845-01-30 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1026 in CIE S 017:2011.
    type: intensional
