data:
  definition:
  - content: vision by the normal eye, intermediate between {{17-22-016, photopic
      vision}} and {{17-22-017, scotopic vision}}
    type: intensional
  examples: []
  notes:
  - content: In mesopic vision, both the cones and the rods are active.
    type: intensional
  - content: See also CIE 191:2010, _Recommended System for Mesopic Photometry based
      on Visual Performance._
    type: intensional
