data:
  definition:
  - content: brightening of the night sky that results from the {{17-24-047, reflection}}
      of radiation (visible and non-visible), scattered from the constituents of the
      atmosphere (gas molecules, aerosols and particulate matter), in the direction
      of observation
    type: intensional
  examples: []
  notes:
  - content: 'Sky glow comprises the following separate components: natural sky glow
      and man-made sky glow.'
    type: intensional
