data:
  definition:
  - content: brightening of the night sky that results from the reflection of radiation
      (visible and non-visible), scattered from the constituents of the atmosphere
      (gas molecules, aerosols and particulate matter), in the direction of observation
    type: intensional
  examples: []
  notes:
  - content: 'Sky glow comprises the following separate components: {{concept:cie-2020:17-29-180,
      natural sky glow}} and {{concept:cie-2020:17-29-179, man-made sky glow}}.'
    type: intensional
