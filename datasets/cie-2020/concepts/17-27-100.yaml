data:
  definition:
  - content: value of a quantity, used for specification purposes, declared by the
      manufacturer or responsible vendor and established under standard test conditions
  notes:
  - content: To express the "rated value" of a particular quantity, the term "value"
      is replaced by the quantity name; for example, rated power, rated voltage, rated
      current, and rated temperature.
  - content: The standard test conditions are given in the relevant standard.
  sources:
