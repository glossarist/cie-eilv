data:
  definition:
  - content: light, reflected from an imaging medium, that has not been modulated
      by the means used to produce the image
    type: intensional
  examples: []
  notes:
  - content: Veiling glare lightens and reduces the {17-22-089, contrast} of the darker
      parts of an image.
    type: intensional
  - content: Formerly the term "ambient flare" was used, but this term is deprecated.
    type: intensional
  - content: This entry was numbered 17-1394 in CIE S 017:2011.
    type: intensional
