data:
  definition:
  - content: representation in space, in the form of a surface expressed in polar coordinates, of the angular distribution of (relative) radiant intensity or luminous intensity or of (relative) radiance or luminance of an element of the surface of a medium that diffuses by reflection or transmission
    type: intensional
  examples: []
  notes:
  - content: For a narrow incident beam of radiation, it is convenient to represent the scattering indicatrix in Cartesian coordinates. If the angular distribution has rotational symmetry, a meridian section of the surface is sufficient.
    type: intensional
  - content: The term "indicatrix" is often used to denote, instead of the surface, the curve obtained in a similar manner in a plane normal to the element concerned.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-91, 845-04-91}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-572 in CIE S 017:2011.
    type: intensional
