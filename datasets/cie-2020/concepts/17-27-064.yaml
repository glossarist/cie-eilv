data:
  definition:
  - content: "{{17-27-058, LED module}} designed for mounting or placing separately
      from a luminaire, from an additional box or enclosure or the like"
    type: intensional
  examples: []
  notes:
  - content: An independent LED module provides all the necessary protection with
      regard to safety according to its classification and marking.
    type: intensional
  - content: An example of an independent LED module is a system where the LED module
      is connected via a glass fibre with the luminaire head.
    type: intensional
