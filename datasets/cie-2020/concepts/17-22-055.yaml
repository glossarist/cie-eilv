data:
  definition:
  - content: paint, pigment or dye that exhibits {{17-24-023, fluorescence}} as the
      result of exposure to {{17-29-105, daylight}}
    type: intensional
  examples: []
  notes:
  - content: Daylight fluorescent colours absorb energy from {{17-29-105, daylight}}
      in the shorter {{17-21-025, wavelength}} regions of the visible spectrum and/or
      in the ultraviolet region and re-radiate some of this energy at longer {{17-21-025,
      wavelength}}s, producing radiation in a small range of {{17-21-025, wavelength}}s
      in the visible region.
    type: intensional
  - content: See also "{{17-24-040, photoluminescent material}}", "{{17-24-041, fluorescent
      material}}".
    type: intensional
  - content: This entry was numbered 17-280 in CIE S 017:2011.
    type: intensional
