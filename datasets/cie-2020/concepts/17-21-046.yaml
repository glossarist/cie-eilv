data:
  definition:
  - content: |-
      density of photon flux with respect to solid angle in a specified direction

      stem:[I_p = ((d Phi_p))/((d omega))]

      where stem:[Phi_p] is the photon flux emitted in the given direction, and stem:[Omega] is the solid angle containing that direction
    type: intensional
  examples: []
  notes:
  - content: |-
      The distribution of the photon intensities as a function of the direction of emission, e.g. given by the polar angles (stem:[ϑ], stem:[phi]), is used to determine the photon flux, stem:[Phi_p], within a certain solid angle, stem:[Omega], of a source:

      stem:[Phi_p = underset(omega)( ∬ ) I_p ( vartheta , phi ) sin vartheta \ d phi \ d vartheta].
    type: intensional
  - content: The corresponding radiometric quantity is "radiant intensity". The corresponding
      photometric quantity is "luminous intensity".
    type: intensional
  - content: The photon intensity is expressed in second to the power minus one times
      steradian to the power minus one (s^−1^·sr^−1^).
    type: intensional
  - content: This entry was numbered {{cite:845-01-32, 845-01-32}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-928 in CIE S 017:2011.
    type: intensional
