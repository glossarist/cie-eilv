data:
  definition:
  - content: |-
      density of {17-21-040, photon flux} with respect to {17-21-109, solid angle} in a specified direction
      .
      where <i>Φ</i><sub>p</sub> is the {17-21-040, photon flux} emitted in the given direction, and <i>Ω</i> is the {17-21-109, solid angle} containing that direction
    type: intensional
  examples: []
  notes:
  - content: |-
      The distribution of the photon intensities as a function of the direction of {17-24-001, emission}, e.g. given by the polar angles (<i>ϑ</i>, <i>φ</i>), is used to determine the {17-21-040, photon flux}, <i>Φ</i><sub>p</sub>, within a certain {17-21-109, solid angle}, <i>Ω</i>, of a {17-21-032, source}:
      .
    type: intensional
  - content: The corresponding radiometric quantity is "{17-21-044, radiant intensity}".
      The corresponding photometric quantity is "{17-21-045, luminous intensity}".
    type: intensional
  - content: The photon intensity is expressed in second to the power minus one times
      steradian to the power minus one (s<sup>−1</sup>·sr<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 845-01-32 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-928 in CIE S 017:2011.
    type: intensional
