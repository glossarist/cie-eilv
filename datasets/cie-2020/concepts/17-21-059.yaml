data:
  definition:
  - content: mean value of photon irradiance on the outer curved surface of a very
      small (real or imaginary) sphere at a point in space
    type: intensional
  examples: []
  notes:
  - content: |-
      The photon spherical irradiance can be expressed by

      stem:[E_((p ,o)) = underset((4 pi))( int ) L_p d omega]

      where stem:[Omega] is solid angle and stem:[L_p] is photon radiance.
    type: intensional
  - content: The photon spherical irradiance is expressed in second to the power minus
      one per square metre (s^−1^·m^−2^).
    type: intensional
  - content: This entry was numbered 17-934 and 17-926 in CIE S 017:2011.
    type: intensional
