data:
  definition:
  - content: first part of a road tunnel, directly after the entrance portal
    type: intensional
  examples: []
  notes:
  - content: The threshold zone starts either at the beginning of the road tunnel
      or at the beginning of the sun screen when a sun screen is installed. The length
      of the threshold zone is at least equal to the stopping distance.
    type: intensional
