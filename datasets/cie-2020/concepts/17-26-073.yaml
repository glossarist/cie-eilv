data:
  definition:
  - content: quantity developed for the public domain, for weather forecasting and
      climatology, which quantifies the erythemal potential (or sunburning power)
      of the ambient solar {17-21-008, ultraviolet radiation}, but could also be applied
      to other {17-21-032, source}s
    type: intensional
  examples: []
  notes:
  - content: |-
      The International Global UV Index, <i>I</i><sub>UV</sub>, is defined by the formula:

      where <i>E<sub>λ</sub></i>(<i>λ</i>) is the solar {17-21-056, spectral irradiance} expressed in W⋅m<sup>−2</sup>⋅nm<sup>−1</sup> at {17-21-025, wavelength} <i>λ</i>, <i>s</i><sub>er</sub>(<i>λ</i>) is the {17-26-065, erythema spectral weighting function}, and <i>k</i><sub>er</sub> is a constant equal to 40 m<sup>2</sup>⋅W<sup>−1</sup>.
    type: intensional
  - content: The global UV index has unit one.
    type: intensional
  - content: This entry was numbered 17-498 in CIE S 017:2011.
    type: intensional
