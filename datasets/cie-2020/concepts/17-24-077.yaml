data:
  definition:
  - content: |-
      quotient of the luminance of a surface element in a specified direction, stem:[L_(v,n)], and the luminance of the perfect reflecting diffuser or perfect transmitting diffuser identically illuminated and viewed, stem:[L_(v,d)]

      stem:[beta_v = ((L_((v ,n))))/((L_((v ,d))))]
    type: intensional
  examples: []
  notes:
  - content: The definition holds for a surface element of a non-luminous medium,
      in a given direction and under specified conditions of irradiation.
    type: intensional
  - content: This quantity is also defined spectrally and is called "spectral luminance
      factor".
    type: intensional
  - content: |-
      For photoluminescent media, the luminance factor consists of two components: the reflected luminance factor, stem:[beta_(v,R)], and the luminescent luminance factor, stem:[beta_(v,L)]. The sum of the reflected and luminescent luminance factors is called "total luminance factor" and can be expressed by stem:[beta_(v,T)]: stem:[beta_(v,T)] = stem:[beta_(v,R)] + stem:[beta_(v,L)].

      The subscript R is used here for the reflected luminance factor because it is more intuitive than the traditional S and avoids confusion with the use of S to denote a state of polarization.
    type: intensional
  - content: The luminance factor has unit one.
    type: intensional
  - content: This entry was numbered {{cite:845-04-69, 845-04-69}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-717 in CIE S 017:2011.
    type: intensional
