data:
  definition:
  - content: 'product of the Planck constant and {{cite:IEV:103-06-02, frequency}}


      stem:[Q_p] = stem:[h]stem:[cdot]stem:[nu]


      where stem:[h] is the Planck constant and stem:[nu] is the frequency of the corresponding electromagnetic wave'
    type: intensional
  examples: []
  notes:
  - content: Photon energy can be emitted, transferred or received.
    type: intensional
  - content: The energy of {{concept:cie-2020:17-21-014, monochromatic radiation}}, stem:[Q_{PF}], by a photon flux of photons of frequency stem:[nu] is equal to the photon number, stem:[N_p], times the photon energy (stem:[Q_{PF}] = stem:[N_p]stem:[cdot]stem:[h]stem:[cdot]stem:[nu]).
    type: intensional
  - content: The corresponding radiometric quantity is "radiant energy". The corresponding photometric quantity is "{{concept:cie-2020:17-21-037, luminous energy}}".
    type: intensional
  - content: The photon energy is expressed in joule stem:[J = W cdot s].
    type: intensional
