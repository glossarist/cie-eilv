data:
  definition:
  - content: exposure of the human eye to {17-21-003, visible radiation} for the treatment
      of affective disorders or disorders due to circadian disruption
    type: intensional
  examples: []
  notes:
  - content: |-
      a) for affective disorders: seasonal affective disorder or winter depression;
      b) for disorders due to circadian disruption: advanced phase sleep disorder, circadian desynchronization related to shift work or jet travel
