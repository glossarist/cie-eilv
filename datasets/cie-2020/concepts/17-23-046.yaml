data:
  definition:
  - content: system for determining the {{17-23-038, tristimulus values}} of any spectral
      power distribution using the set of reference colour stimuli &amp;lsqb;X~10~&amp;rsqb;,
      &amp;lsqb;Y~10~&amp;rsqb;, &amp;lsqb;Z~10~&amp;rsqb; and the three CIE colour-matching
      functions stem:[bar x_((10)) ( lambda ) , bar y_((10)) ( lambda ) , bar z_((10))
      ( lambda )] adopted by the CIE in 1964
    type: intensional
  examples: []
  notes:
  - content: The CIE 1964 standard colorimetric system is applicable to centrally
      viewed fields of angular subtense greater than about 4° (0,07 rad).
    type: intensional
  - content: When the CIE 1964 standard colorimetric system is used, all symbols that
      represent colorimetric measures are distinguished by use of the subscript 10.
    type: intensional
  - content: See also CIE 15, stem:[Colorimetry].
    type: intensional
  - content: This entry was numbered {{cite:845-03-29, 845-03-29}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-152 in CIE S 017:2011.
    type: intensional
