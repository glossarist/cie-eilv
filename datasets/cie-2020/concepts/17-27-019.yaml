data:
  definition:
  - content: "{{concept:cie-2020:17-27-018, electric discharge}} in which the secondary
      emission from the cathode is much greater than the thermionic emission"
    type: intensional
  examples: []
  notes:
  - content: The glow discharge is characterized by a considerable cathode fall (typically
      70 V or more) and by low current density at the cathode (some 10 A·m^−2^).
    type: intensional
