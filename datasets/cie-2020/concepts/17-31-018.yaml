data:
  definition:
  - content: length of the path in the atmosphere that is required to attenuate by
      95 % the {{17-21-039, luminous flux}} in a collimated beam from a {{17-21-032,
      source}} at a {{17-23-067, colour temperature}} of 2 700 K
    type: intensional
  examples: []
  notes:
  - content: The value of the attenuation has been chosen so that the meteorological
      optical range provides an approximate measure of the commonly used concept of
      {{17-31-147, meteorological visibility}}.
    type: intensional
  - content: |-
      The meteorological optical range, <i>v</i>, is related to the {{17-31-017, atmospheric transmissivity}}, <i>T</i>, assumed to be uniform, by the formula
      or
      where <i>d</i><sub>0</sub> is the length specified in the definition of {{17-31-017, atmospheric transmissivity}}.
      These formulae are sometimes written
      or
      with <i>d</i><sub>0</sub> set to unity.
    type: intensional
