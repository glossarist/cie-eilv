data:
  definition:
  - content: distance in the direction of propagation of a periodic wave between two
      successive positions at which the phase is the same
    type: intensional
  examples: []
  notes:
  - content: 'The wavelength in a medium is equal to the wavelength in vacuo divided
      by the {{17-24-109, refractive index}} of the medium. In {{17-25-013, photometry}},
      unless otherwise stated, values of wavelength are generally those in air. The
      {{17-24-109, refractive index}} of standard air (for spectroscopy: <i>T</i>
      = 15° C, <i>p</i> = 101 325 Pa) lies between 1,000 27 and 1,000 29 for {{17-21-003,
      visible radiation}}.'
    type: intensional
  - content: In some specific applications, such as {{17-24-023, fluorescence}} measurements,
      the symbol <i>μ</i> is used for the wavelengths of {{17-24-020, excitation}}
      radiation.
    type: intensional
  - content: "<i>λ</i> = <i>v</i> / ν, where <i>λ</i> is the wavelength in a medium,
      <i>v</i> is the phase velocity in that medium and ν is the frequency."
    type: intensional
  - content: The wavelength is expressed in metres (m) or decimal multiples and submultiples
      of metre.
    type: intensional
  - content: In {{17-21-002, optical radiation}} the units nanometre (nm) and micrometre
      (μm) are generally used.
    type: intensional
  - content: This entry was numbered 845-01-14 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1426 in CIE S 017:2011.
    type: intensional
