data:
  definition:
  - content: clouding (opacification) of the lens resulting in a cataract
    type: intensional
  examples: []
  notes:
  - content: Photocataractogenesis results in most cases from chronic exposure to
      excessive ultraviolet {17-21-041, radiant energy} incident upon the lens.
    type: intensional
  - content: Cataracts can also be produced by acute over-exposure to an excimer laser
      beam.
    type: intensional
  - content: This entry was numbered 17-888 and 17-1365 in CIE S 017:2011.
    type: intensional
