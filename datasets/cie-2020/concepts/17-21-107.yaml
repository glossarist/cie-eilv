  definition:
  - content: quantum of electromagnetic radiation considered as a particle of energy
      stem:[hnu], where stem:[h] is the Planck constant and stem:[nu] the {{cite:103-06-02,
      frequency}} of the radiation
    type: intensional
  examples: []
  notes:
