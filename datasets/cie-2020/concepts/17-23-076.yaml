data:
  definition:
  - content: |-
      three-dimensional, approximately {17-23-071, uniform colour space} produced by plotting in rectangular coordinates <i>L</i>*, <i>a</i>*, <i>b</i>*, quantities defined by the equations:
      <i>L</i>* = 116 <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) − 16
      <i>a</i>* = 500 [<i>f</i> (<i>X</i>/<i>X</i><sub>n</sub>) − <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>)]
      <i>b</i>* = 200 [<i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) − <i>f</i> (<i>Z</i>/<i>Z</i><sub>n</sub>)]
      where
      <i>f</i> (<i>X</i>/<i>X</i><sub>n</sub>) = (<i>X</i>/<i>X</i><sub>n</sub>)<sup>1/3</sup> if (<i>X</i>/<i>X</i><sub>n</sub>) > (6/29)<sup>3</sup>
      <i>f</i> (<i>X</i>/<i>X</i><sub>n</sub>) = (841/108) (<i>X</i>/<i>X</i><sub>n</sub>) + 4/29 if (<i>X</i>/<i>X</i><sub>n</sub>) ≤ (6/29)<sup>3</sup>
      and
      <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) = (<i>Y</i>/<i>Y</i><sub>n</sub>)<sup>1/3</sup> if (<i>Y</i>/<i>Y</i><sub>n</sub>) > (6/29)<sup>3</sup>
      <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) = (841/108) (<i>Y</i>/<i>Y</i><sub>n</sub>) + 4/29 if (<i>Y</i>/<i>Y</i><sub>n</sub>) ≤ (6/29)<sup>3</sup>
      and
      <i>f</i> (<i>Z</i>/<i>Z</i><sub>n</sub>) = (<i>Z</i>/<i>Z</i><sub>n</sub>)<sup>1/3 </sup>if (<i>Z</i>/<i>Z</i><sub>n</sub>) > (6/29)<sup>3</sup>
      <i>f</i> (<i>Z</i>/<i>Z</i><sub>n</sub>) = (841/108) (<i>Z</i>/<i>Z</i><sub>n</sub>) + 4/29 if (<i>Z</i>/<i>Z</i><sub>n</sub>) ≤ (6/29)<sup>3</sup>
      and <i>X</i>, <i>Y</i>, <i>Z</i> describe the {17-23-002, colour stimulus} considered and <i>X</i><sub>n</sub>, <i>Y</i><sub>n</sub>, <i>Z</i><sub>n</sub> describe a specified white {17-23-009, achromatic stimulus}.
    type: intensional
  examples: []
  notes:
  - content: |-
      Approximate correlates of {17-22-063, lightness}, {17-22-074, chroma} and {17-22-067, hue} can be calculated as follows:
      CIE 1976 lightness
      <i>L</i>* = 116 <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) − 16
      where
      <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) = (<i>Y</i>/<i>Y</i><sub>n</sub>)<sup>1/3</sup> if (<i>Y</i>/<i>Y</i><sub>n</sub>) > (6/29)<sup>3</sup>
      <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) = (841/108) (<i>Y</i>/<i>Y</i><sub>n</sub>) + 4/29 if (<i>Y</i>/<i>Y</i><sub>n</sub>) ≤ (6/29)<sup>3</sup>
      CIE 1976 <i>a</i>, <i>b</i> chroma

      CIE 1976 <i>a</i>, <i>b</i> hue angle
      <i> h</i><sub>ab</sub> = arctan (<i>b</i>*/<i>a</i>*)
    type: intensional
  - content: See also CIE 15 <i>Colorimetry</i>.
    type: intensional
  - content: 'See also ISO/CIE 11664-4<i> Colorimetry – Part 4: CIE 1976 L*a*b* Colour
      Space</i>.'
