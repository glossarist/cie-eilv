data:
  definition:
  - content: visual photometer in which the observer sees either an undivided field
      illuminated successively, or two adjacent fields illuminated alternately, by
      two sources to be compared, the {{cite:IEV:103-06-02, frequency}} of alteration
      being conveniently chosen so that it is above the {{concept:cie-2020:17-22-093,
      critical flicker frequency}} for colours but below the fusion frequency for
      brightness
    type: intensional
  examples: []
