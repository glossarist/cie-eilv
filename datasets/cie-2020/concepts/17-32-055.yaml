data:
  definition:
  - content: quotient of the maximum {{17-21-050, luminance}} level that appears unclipped
      and the minimum {{17-21-050, luminance}} level that can be reproduced with an
      incremental signal to temporal noise ratio of at least 1
    type: intensional
  examples: []
  notes:
  - content: As determined according to ISO 15739 <i>Photography - Electronic still-picture
      imaging - Noise measurements</i>.
    type: intensional
  - content: The ISO digital still camera dynamic range has unit one.
    type: intensional
  - content: This entry was numbered 17-612 in CIE S 017:2011.
    type: intensional
