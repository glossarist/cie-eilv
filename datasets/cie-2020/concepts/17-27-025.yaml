data:
  definition:
  - content: tube, or other vessel or device, which is constructed of translucent
      material, hermetically sealed, and designed for the {{17-24-001, emission}}
      of light arising from the passage of an electric current through a gas or vapour
      contained within it
    type: intensional
  examples: []
  notes:
  - content: The tube can be with or without a fluorescent coating.
    type: intensional
