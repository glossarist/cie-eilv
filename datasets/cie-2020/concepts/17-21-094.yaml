data:
  definition:
  - content: quotient of radiant flux weighted by the {{concept:cie-2020:17-21-035, spectral luminous efficiency}} and the corresponding radiant flux for a specified photometric condition
    type: intensional
  examples: []
  notes:
  - content: The photometric condition should be specified (e.g. photopic, scotopic, mesopic). If it is not specified, photopic vision is assumed and the symbol stem:[V] is used. For other photometric conditions, the respective symbol for identification shall be used.
    type: intensional
  - content: 'Luminous efficiency for photopic vision is expressed by


      stem:[V = ((int_0^(oo) Phi_((e , lambda)) ( lambda ) V ( lambda ) d lambda))/((int_0^(oo) Phi_((e , lambda)) ( lambda ) d lambda)) = (K)/((K_m))]


      where stem:[Phi_(e,lambda)] is spectral radiant flux, stem:[V](stem:[lambda]) is spectral luminous efficiency, stem:[lambda] is wavelength, stem:[K] is luminous efficacy of radiation, and stem:[K_m] is maximum luminous efficacy.'
    type: intensional
  - content: The luminous efficiency has unit one.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-57, 845-01-57}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-731 in CIE S 017:2011.
    type: intensional
