data:
  definition:
  - content: quotient of {{17-21-038, radiant flux}} weighted by the {{17-21-035,
      spectral luminous efficiency}} and the corresponding {{17-21-038, radiant flux}}
      for a specified photometric condition
    type: intensional
  examples: []
  notes:
  - content: The photometric condition should be specified (e.g. photopic, scotopic,
      mesopic). If it is not specified, {{17-22-016, photopic vision}} is assumed
      and the symbol <i>V</i> is used. For other photometric conditions the respective
      symbol for identification shall be used.
    type: intensional
  - content: |-
      Luminous efficiency for {{17-22-016, photopic vision}} is expressed by

      where <i>Φ</i><sub>e,</sub><i><sub>λ</sub></i> is spectral radiant flux, <i>V</i>(<i>λ</i>) is {{17-21-035, spectral luminous efficiency}}, <i>λ</i> is {{17-21-025, wavelength}}, <i>K</i> is {{17-21-090, luminous efficacy of radiation}}, and <i>K</i><sub>m</sub> is {{17-21-092, maximum luminous efficacy}}.
    type: intensional
  - content: The luminous efficiency has unit one.
    type: intensional
  - content: This entry was numbered 845-01-57 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-731 in CIE S 017:2011.
    type: intensional
