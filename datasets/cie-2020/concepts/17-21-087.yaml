data:
  definition:
  - content: quotient of the {17-21-038, radiant flux} of the emitted radiation and
      the power consumed by the {17-21-032, source}
    type: intensional
  examples: []
  notes:
  - content: It is necessary to specify whether the power dissipated by auxiliary
      equipment (such as {17-28-044, ballast}s), if any, is included in the power
      consumed by the {17-21-032, source}.
    type: intensional
  - content: The radiant efficiency has unit one.
    type: intensional
  - content: This entry was numbered 845-01-54 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1018 in CIE S 017:2011.
    type: intensional
