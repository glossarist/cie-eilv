data:
  definition:
  - content: quotient of the radiant flux of the emitted radiation and the power consumed
      by the source
    type: intensional
  examples: []
  notes:
  - content: It is necessary to specify whether the power dissipated by auxiliary
      equipment (such as ballasts), if any, is included in the power consumed by the
      source.
    type: intensional
  - content: The radiant efficiency has unit one.
    type: intensional
  - content: This entry was numbered {{cite:845-01-54, 845-01-54}} in IEC 60050-845:1987.
