data:
  definition:
  - content: "{17-24-088, spectral internal transmittance} of a layer of an absorbing
      material such that the path of the radiation is of dimension length, and under
      conditions in which the boundary of the material has no influence"
    type: intensional
  examples: []
  notes:
  - content: The unit of length has to be specified. If a new unit of length is used
      that is <i>k</i> times the magnitude of the original one, then the value of
      <i>τ</i><sub>i,o</sub>(<i>λ</i>) will change to .
    type: intensional
  - content: The spectral transmissivity has unit one.
    type: intensional
  - content: This entry was numbered 845-04-87 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1231 in CIE S 017:2011.
    type: intensional
