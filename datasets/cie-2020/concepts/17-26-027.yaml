data:
  definition:
  - content: function representing the relative spectral effectiveness of {17-21-002,
      optical radiation}, for a specified biological effect, in a specified system
    type: intensional
  examples: []
  notes:
  - content: The normalized action spectrum is the {17-21-025, wavelength} dependence
      of the inverse of the {17-26-033, dose} of {17-21-014, monochromatic radiation}
      required to induce a certain (biologic) response; the action spectrum is commonly
      normalized to a value of 1 at the {17-21-025, wavelength} of "maximum action",
      i.e. where the smallest {17-26-033, dose} suffices to induce the required effect.
    type: intensional
  - content: This entry was numbered 845-06-14 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-17 and 17-1232 in CIE S 017:2011.
    type: intensional
