data:
  definition:
  - content: "{{17-21-099, irradiation}} or measurement of reflecting materials at
      8° to the normal, at one azimuth angle"
    type: intensional
  examples: []
  notes:
  - content: Eight-degree geometry is used to substitute the 0° directional geometry
      in many practical applications of {{17-24-047, reflection}} measurements, as
      it permits differentiation between {{17-25-082, specular}}-component-included
      and {{17-25-082, specular}}-component-excluded measurements.
    type: intensional
  - content: This geometry is restricted to measurements using an {{17-25-028, integrating
      sphere}} as described in CIE 15<i> Colorimetry</i>.
    type: intensional
  - content: This entry was numbered 17-363 in CIE S 017:2011.
    type: intensional
