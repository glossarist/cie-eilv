data:
  definition:
  - content: irradiation or measurement of reflecting materials at 8stem:[deg] to the normal, at one azimuth angle
    type: intensional
  examples: []
  notes:
  - content: Eight-degree geometry is used to substitute the 0stem:[deg] directional geometry in many practical applications of reflection measurements, as it permits differentiation between specular-component-included and specular-component-excluded measurements.
    type: intensional
  - content: This geometry is restricted to measurements using an integrating sphere as described in CIE 15, stem:[Colorimetry].
    type: intensional
