data:
  definition:
  - content: "{17-21-050, luminance} that, when added by superposition to the {17-21-050,
      luminance} of both the adapting background and the object, makes the {17-22-087,
      luminance threshold} or the {17-22-088, luminance difference threshold} the
      same under the two following conditions: (1) {17-22-098, glare} present, but
      no additional {17-21-050, luminance}; (2) additional {17-21-050, luminance}
      present, but no {17-22-098, glare}"
    type: intensional
  examples: []
  notes:
  - content: The equivalent veiling luminance is expressed in candela per square metre
      (cd·m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 845-02-58 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-398 in CIE S 017:2011.
    type: intensional
