data:
  definition:
  - content: system for determining the {{17-23-038, tristimulus values}} of any spectral
      power distribution using the set of {{17-23-037, reference colour stimuli}}
      [X], [Y], [Z] and the three {{17-23-047, CIE colour-matching functions}} adopted
      by the CIE in 1931
    type: intensional
  examples: []
  notes:
  - content: is identical to <i>V</i>(<i>λ</i>) and hence the {{17-23-038, tristimulus
      values}} <i>Y</i> are proportional to values of {{17-21-050, luminance}}.
    type: intensional
  - content: The CIE 1931 standard colorimetric system is applicable to centrally
      viewed fields of {{17-25-085, angular subtense}} between about 1° and about
      4° (0,017 rad and 0,07 rad).
    type: intensional
  - content: The CIE 1931 standard colorimetric system can be derived from the CIE
      1931 RGB colorimetric system using a transformation based on a set of three
      linear equations. The CIE 1931 RGB system is based on three real monochromatic
      reference stimuli.
    type: intensional
  - content: See also CIE 15<i> Colorimetry</i>.
    type: intensional
  - content: This entry was numbered 845-03-28 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-150 in CIE S 017:2011.
    type: intensional
