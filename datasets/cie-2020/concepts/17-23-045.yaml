data:
  definition:
  - content: system for determining the {{concept:cie-2020:17-23-038, tristimulus values}} of any spectral power distribution using the set of reference colour stimuli [X], [Y], [Z] and the three CIE colour-matching functions stem:[bar x ( lambda ) , bar y ( lambda ) , bar z ( lambda )] adopted by the CIE in 1931
    type: intensional
  examples: []
  notes:
  - content: stem:[bar y ( lambda )] is identical to stem:[V](stem:[lambda]) and hence the tristimulus values stem:[Y] are proportional to values of luminance.
    type: intensional
  - content: The CIE 1931 standard colorimetric system is applicable to centrally viewed fields of angular subtense between about 1stem:[deg] and about 4stem:[deg] (0,017 rad and 0,07 rad).
    type: intensional
  - content: The CIE 1931 standard colorimetric system can be derived from the CIE 1931 RGB colorimetric system using a transformation based on a set of three linear equations. The CIE 1931 RGB system is based on three real monochromatic reference stimuli.
    type: intensional
  - content: See also CIE 15, stem:[Colorimetry].
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-03-28, 845-03-28}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-150 in CIE S 017:2011.
    type: intensional
