data:
  definition:
  - content: volume, area, or solid in a colour space, consisting of all those colours that are either<ol type="a">. present in a specific scene, artwork, photograph, photomechanical, or other reproduction; or. capable of being created using a particular output device and/or medium
    type: intensional
  examples: []
  notes:
  - content: In reproduction and media applications only the volume or solid in a colour space is regarded as colour gamut. In applications such as signal lighting the colour gamut is an area.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-211, 17-211}} in CIE S 017:2011.
    type: intensional
