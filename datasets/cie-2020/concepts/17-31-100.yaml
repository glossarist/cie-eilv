data:
  definition:
  - content: |-
      surround or extension to a {17-31-002, sign} used
      - to improve {17-31-121, conspicuity of a sign} by increasing its size and isolating it from its {17-31-099, background};
      - to improve {17-31-121, conspicuity of a sign} by virtue of the {17-22-040, colour} of the backing board;
      - to reduce the effects of {17-22-098, glare} when the Sun is low and behind the {17-31-002, sign}
    type: intensional
