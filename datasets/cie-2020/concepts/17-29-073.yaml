data:
  definition:
  - content: quotient of the sum of the areas of the ceiling and the plane of the
      luminaires and the sum of the area of the walls bounded by the ceiling and the
      plane of the luminaires, used in the calculation of the utilization factor or
      utilance
    type: intensional
  examples: []
  notes:
  - content: |-
      The ceiling cavity index is given by the formula

      stem:[K_c = ((a b))/((h_c ( a + b )))]

      where stem:[a] and stem:[b] are the dimensions of the sides of the room and stem:[h_c] is the distance from the ceiling to the plane of the luminaires.
    type: intensional
  - content: See also "{{17-29-075, floor cavity index}}" and "{{17-29-071, room index}}".
    type: intensional
  - content: The ceiling cavity index has unit one.
    type: intensional
  - content: This entry was numbered 17-131 in CIE S 017:2011.
    type: intensional
