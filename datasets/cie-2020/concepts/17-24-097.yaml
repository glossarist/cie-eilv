data:
  definition:
  - content: "{17-25-079, angle of observation} at which the {17-21-050, luminance}
      has half the value of the {17-21-050, luminance} of the diffused light at the
      angle of 0°, with perpendicular incidence of the light"
    type: intensional
  examples: []
  notes:
  - content: For indicating the shape of the {17-24-098, scattering indicatrix} it
      is recommended that the {17-24-096, diffusion factor}, <i>σ</i>, be used for
      strongly diffusing materials, and the half-value angle, <i>γ</i>, for poorly
      diffusing materials.
    type: intensional
  - content: The half-value angle is expressed in radian (rad) or degree (°).
    type: intensional
  - content: This entry was numbered 845-04-90 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-515 in CIE S 017:2011.
    type: intensional
