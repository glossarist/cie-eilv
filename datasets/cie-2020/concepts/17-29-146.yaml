data:
  definition:
  - content: quotient of {{17-21-060, illuminance}} produced by the {{17-29-034, lighting
      installation}} after a certain <a href="http://std.iec.ch/iev/iev.nsf/display?openform&ievref=113-01-10">time
      interval</a> and the {{17-21-060, illuminance}} produced by the installation
      when new
    type: intensional
  examples: []
  notes:
  - content: The term "light loss factor" is no longer used.
    type: intensional
  - content: The term "depreciation factor" was formerly used to designate the reciprocal
      of the above quotient.
    type: intensional
  - content: The maintenance factor takes into account light losses caused by dirt
      accumulation on {{17-30-001, luminaire}}s and room surfaces (in interiors) or
      other relevant surfaces (in exteriors, where appropriate), and the decrease
      in the {{17-21-039, luminous flux}} of lamps.
    type: intensional
  - content: The maintenance factor has unit one.
    type: intensional
  - content: This entry was numbered 17-753 and 17-774 in CIE S 017:2011.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  - origin:
