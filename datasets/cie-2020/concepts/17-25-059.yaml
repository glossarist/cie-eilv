data:
  definition:
  - content: that part of the output current of a photoelectric detector which is
      caused by incident radiation
    type: intensional
  examples: []
  notes:
  - content: In photomultipliers a distinction has to be made between the cathode
      photocurrent and the anode photocurrent.
    type: intensional
  - content: The photocurrent is expressed in ampere (A).
    type: intensional
  - content: This entry was numbered 845-05-52 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-893 in CIE S 017:2011.
    type: intensional
