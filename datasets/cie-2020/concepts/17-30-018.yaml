data:
  definition:
  - content: luminaire intended by the manufacturer to be fully or partly recessed
      into a mounting surface
    type: intensional
  examples: []
  notes:
  - content: The term applies both to luminaires for operation in enclosed cavities
      and to luminaires for mounting through a surface such as a suspended ceiling.
    type: intensional
