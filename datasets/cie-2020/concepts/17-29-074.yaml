data:
  definition:
  - content: quotient of five times the sum of the area of the walls bounded by the ceiling and the plane of the luminaires and the sum of the areas of the ceiling and the plane of the luminaires, used in the calculation of the utilization factor or utilance
    type: intensional
  examples: []
  notes:
  - content: 'The ceiling cavity ratio is given by the formula


      stem:[K_c = (5 hc(a+b))/(ab)]


      where stem:[a] and stem:[b] are the dimensions of the sides of the room and stem:[h_c] is the distance from the ceiling to the plane of the luminaires.'
    type: intensional
  - content: See also "{{concept:cie-2020:17-29-076, floor cavity ratio}}" and "{{concept:cie-2020:17-29-072, room cavity ratio}}".
    type: intensional
  - content: The ceiling cavity ratio has unit one.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-132, 17-132}} in CIE S 017:2011.
    type: intensional
