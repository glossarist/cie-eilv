data:
  definition:
  - content: SI unit of {{17-21-039, luminous flux}}
    type: intensional
  examples: []
  notes:
  - content: 1 lm is equal to the {{17-21-039, luminous flux}} of a beam of {{17-21-014,
      monochromatic radiation}} whose frequency is 540 × 10<sup>12</sup> Hz and whose
      {{17-21-038, radiant flux}} is 1/683 W.
    type: intensional
  - content: According to the 9<sup>th</sup> General Conference of Weights and Measures
      (1948) the lumen is defined as the {{17-21-039, luminous flux}} emitted in unit
      {{17-21-109, solid angle}} (steradian) by a {{17-21-098, uniform point source}}
      having a {{17-21-045, luminous intensity}} of 1 cd.
    type: intensional
  - content: This entry was numbered 845-01-51 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-704 in CIE S 017:2011.
    type: intensional
