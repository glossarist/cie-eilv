data:
  definition:
  - content: "{{17-27-004, electric light source}} provided with at least one {{17-28-015,
      cap}}"
    type: intensional
  examples: []
  notes:
  - content: For products that have the same physical characteristics as electric
      lamps for {{17-29-007, general lighting}}, but that are built to emit {{17-21-002,
      optical radiation}} mainly in the IR or UV spectrum, the term "IR lamp" or "UV
      lamp" is often used.
    type: intensional
  - content: In IEC standards, "lamp" is commonly used with the same meaning.
    type: intensional
