data:
  definition:
  - content: |-
      three-dimensional, approximately {17-23-071, uniform colour space} produced by plotting in rectangular coordinates <i>L</i>*, <i>u</i>*, <i>v</i>*, quantities defined by the equations:
      <i>L</i>* = 116 <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) – 16


      where
      <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) = (<i>Y</i>/<i>Y</i><sub>n</sub>)<sup>1/3</sup> if (<i>Y</i>/<i>Y</i><sub>n</sub>) > (6/29)<sup>3 </sup>
      <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) = (841/108) (<i>Y</i>/<i>Y</i><sub>n</sub>) + 4/29 if (<i>Y</i>/<i>Y</i><sub>n</sub>) ≤ (6/29)<sup>3 </sup>
      and <i>Y</i>, <i>u</i>′, <i>v</i>′ describe the {17-23-002, colour stimulus} considered and <i>Y</i><sub>n</sub>, , describe a specified white {17-23-009, achromatic stimulus}
    type: intensional
  examples: []
  notes:
  - content: |-
      Approximate correlates of {17-22-063, lightness}, {17-22-073, saturation}, {17-22-074, chroma}, and {17-22-067, hue} can be calculated as follows:
      CIE 1976 lightness
      <i>L</i>* = 116 <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) – 16
      where
      <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) = (<i>Y</i>/<i>Y</i><sub>n</sub>)<sup>1/3</sup> if (<i>Y</i>/<i>Y</i><sub>n</sub>) > (6/29)<sup>3 </sup>
      <i>f</i> (<i>Y</i>/<i>Y</i><sub>n</sub>) = (841/108) (<i>Y</i>/<i>Y</i><sub>n</sub>) + 4/29 if (<i>Y</i>/<i>Y</i><sub>n</sub>) ≤ (6/29)<sup>3</sup>
      CIE 1976 <i>u</i>, <i>v</i> saturation

      CIE 1976 <i>u</i>, <i>v</i> chroma

      CIE 1976 <i>u</i>, <i>v</i> hue angle
    type: intensional
  - content: See also CIE 15 <i>Colorimetry.</i>
    type: intensional
