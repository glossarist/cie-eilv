data:
  definition:
  - content: quotient of the sum of the areas of the floor and the {{17-29-068, working
      plane}} and the sum of the area of the walls bounded by the floor and the {{17-29-068,
      working plane}}, used in the calculation of the {{17-29-069, utilization factor}}
      or {{17-29-070, utilance}}
