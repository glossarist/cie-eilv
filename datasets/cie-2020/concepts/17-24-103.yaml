data:
  definition:
  - content: |-
      quotient of the {{17-24-102, coefficient of luminous intensity}}, <i>R</i>, of a plane retroreflective surface and its area, <i>A</i>

      where <i>I</i> is the {{17-21-045, luminous intensity}} of the {{17-24-100, retroreflector}} in the direction of observation and <i>E</i><sub>⊥</sub> is the {{17-21-060, illuminance}} at the {{17-24-100, retroreflector}} on a plane perpendicular to the direction of the incident light
    type: intensional
  examples: []
  notes:
  - content: The coefficient of retroreflection is particularly suitable for describing
      materials in sheet form.
    type: intensional
  - content: Formerly, the symbol <i>R</i>′ was used for this quantity.
    type: intensional
  - content: The coefficient of retroreflection is expressed in candela per lux per
      square metre (cd⋅lx<sup>−1</sup>⋅m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 845-04-97 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-182 in CIE S 017:2011.
    type: intensional
