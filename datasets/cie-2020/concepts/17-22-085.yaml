data:
  definition:
  - content: |-
      quotient of the real difference in {{17-21-050, luminance}} between the target and its background, Δ<i>L</i>, and the {{17-21-050, luminance}} difference needed between a target of a certain angular size and its background for the target to be just visible, Δ<i>L</i><sub>th</sub>, that is at the threshold
      <i>F</i><sub>VL</sub> = Δ<i>L</i> / Δ<i>L</i><sub>th</sub>
    type: intensional
  examples: []
  notes:
  - content: The visibility level indicates how much the {{17-22-089, contrast}} of
      the target is above threshold contrast.
    type: intensional
  - content: The visibility level has unit one.
    type: intensional
  - content: This entry was numbered 17-1401 in CIE S 017:2011.
    type: intensional
