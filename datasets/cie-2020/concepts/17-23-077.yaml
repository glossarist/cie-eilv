data:
  definition:
  - content: "difference between two colour stimuli, defined as the Euclidean distance between the points representing them in the {{concept:cie-2020:17-23-076, CIE 1976 L*a*b* colour space}} and calculated as:\r\n<ul style=\"list-style-type:none;\">* stem:[Delta E_(ab)^** = [(Delta L^**)^2 + (Delta a^**)^2 + (Delta b^**)^2]^(1//2)]"
    type: intensional
  examples: []
  notes:
  - content: See also CIE 15, stem:[Colorimetry].
    type: intensional
  - content: 'See also ISO/CIE 11664-4, _Colorimetry stem:[-] Part 4: CIE 1976 L*a*b* Colour Space_.'
    type: intensional
