data:
  definition:
  - content: attribute of a {17-22-082, visual perception} according to which the
      perceived {17-22-040, colour} of an area appears to be more or less chromatic
    type: intensional
  examples: []
  notes:
  - content: For a {17-23-002, colour stimulus} of a given {17-23-052, chromaticity}
      and, in the case of {17-22-047, related colour}s, of a given {17-24-077, luminance
      factor}, colourfulness usually increases as the {17-21-050, luminance} is raised
      except when the {17-22-059, brightness} is very high.
    type: intensional
  - content: This entry was numbered 845-02-40 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-233 in CIE S 017:2011.
    type: intensional
