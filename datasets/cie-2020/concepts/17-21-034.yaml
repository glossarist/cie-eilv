data:
  definition:
  - content: SI unit of solid angle
    type: intensional
  examples: []
  notes:
  - content: 1 sr is equal to the solid angle that, having its vertex at the centre
      of a sphere, cuts off an area of the surface of the sphere equal to the square
      of the radius of the sphere.
    type: intensional
