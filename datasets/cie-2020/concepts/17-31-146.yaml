data:
  definition:
  - content: quotient of the luminance of a field and the illuminance on the plane
      of that field, for a {{17-29-020, diffused lighting}} and an observation direction
      forming a {{cite:705-04-04, grazing angle}} with the road surface
    type: intensional
  examples: []
  notes:
  - content: The luminance coefficient in diffuse illumination is expressed in candela
      per square metre per lux (cd·m^−2^·lx^−1^).
    type: intensional
  - content: This entry was numbered 17-713 in CIE S 017:2011.
    type: intensional
