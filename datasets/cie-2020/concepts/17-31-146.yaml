data:
  definition:
  - content: quotient of the {{17-21-050, luminance}} of a field and the {{17-21-060,
      illuminance}} on the plane of that field, for a {{17-29-020, diffused lighting}}
      and an observation direction forming a grazing angle with the road surface
    type: intensional
  examples: []
  notes:
  - content: The luminance coefficient in diffuse illumination is expressed in candela
      per square metre per lux (cd⋅m<sup>−2</sup>⋅lx<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 17-713 in CIE S 017:2011.
    type: intensional
