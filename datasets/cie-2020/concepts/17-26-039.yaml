data:
  definition:
  - content: "{17-21-054, spherical irradiance} spectrally weighted with a stated
      photobiological {17-26-027, action spectrum}"
    type: intensional
  examples: []
  notes:
  - content: This definition is based on the assumption that an {17-26-027, action
      spectrum} is adopted for the photobiological effect considered, and that its
      maximum value is 1.
    type: intensional
  - content: It is essential to specify which {17-26-027, action spectrum} is used,
      as the unit is the same for any {17-26-027, action spectrum}.
    type: intensional
  - content: The photobiological fluence rate is expressed in watt per square metre
      (W⋅m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 17-884 in CIE S 017:2011.
    type: intensional
