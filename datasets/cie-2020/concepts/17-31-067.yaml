data:
  definition:
  - content: headlight designed to illuminate without causing undue glare to people
      in front of the vehicle carrying it, particularly to the drivers of approaching
      vehicles
    type: intensional
  examples: []
  notes:
  - content: The headlights as defined in "main-beam headlight" and "dipped-beam headlight"
      can be provided by a single lighting device.
    type: intensional
