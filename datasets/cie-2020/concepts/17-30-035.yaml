data:
  definition:
  - content: angle, measured up from nadir, between the vertical axis and the first
      line of sight at which the light source(s) and the surfaces of high luminance
      are not visible
    type: intensional
  examples: []
  notes:
  - content: The cut-off angle is expressed in radian (rad) or degree (°).
