data:
  definition:
  - content: effective photobiological radiance with the spectral radiance, stem:[Llambda],
      spectrally weighted with the blue light hazard spectral weighting function,
      stem:[B](stem:[lambda])
    type: intensional
  examples: []
  notes:
  - content: The wavelength range for the blue light hazard radiance is specified
      in ICNIRP-recommendations as stem:[lambda] = 300 nm to stem:[lambda] = 700 nm.
    type: intensional
  - content: This definition is based on the assumption that an action spectrum is
      adopted for the actinic effect considered, and that its maximum value is 1.
    type: intensional
  - content: It is essential to specify which actinic action spectrum is used, as
      the unit is the same for any action spectrum.
    type: intensional
  - content: The blue light hazard radiance is expressed in watt per square metre
      per steradian (W·m^−2^·sr^−1^).
    type: intensional
  - content: This entry was numbered 17-99 in CIE S 017:2011.
    type: intensional
