data:
  definition:
  - content: quotient of five times the sum of the area of the walls bounded by the working plane and the plane of the luminaires and the sum of the areas of the working plane and the plane of the luminaires, used in the calculation of the utilization factor or utilance
    type: intensional
  examples: []
  notes:
  - content: 'The room cavity ratio is expressed by the formula


      stem:[K = ((5 h ( a + b )))/((a b))]


      where stem:[a] and stem:[b] are the dimensions of the sides of the room and stem:[h] the mounting height, that is the distance between the working plane and the plane of the luminaires.'
    type: intensional
  - content: See also "{{concept:cie-2020:17-29-074, ceiling cavity ratio}}" and "{{concept:cie-2020:17-29-076, floor cavity ratio}}".
    type: intensional
  - content: The room cavity ratio has unit one.
    type: intensional
  - content: This entry was numbered 17-1120 in CIE S 017:2011.
    type: intensional
