data:
  definition:
  - content: quotient of five times the sum of the area of the walls bounded by the
      {{17-29-068, working plane}} and the plane of the {{17-30-001, luminaire}}s
      and the sum of the areas of the {{17-29-068, working plane}} and the plane of
      the {{17-30-001, luminaire}}s, used in the calculation of the {{17-29-069, utilization
      factor}} or {{17-29-070, utilance}}
    type: intensional
  examples: []
  notes:
  - content: |-
      The room cavity ratio is expressed by the formula

      <sub>


      </sub>where <i>a</i> and <i>b</i> are the dimensions of the sides of the room and <i>h</i> the {{17-29-186, mounting height}}, that is the distance between the {{17-29-068, working plane}} and the plane of the {{17-30-001, luminaire}}s.
    type: intensional
  - content: See also "{{17-29-074, ceiling cavity ratio}}" and "{{17-29-076, floor
      cavity ratio}}".
    type: intensional
  - content: The room cavity ratio has unit one.
    type: intensional
  - content: This entry was numbered 17-1120 in CIE S 017:2011.
    type: intensional
