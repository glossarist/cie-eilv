data:
  definition:
  - content: |-
      density of incident {17-21-038, radiant flux} with respect to area at a point on a real or imaginary surface

      where <i>Φ</i><sub>e</sub> is {17-21-038, radiant flux} and <i>A</i> is the area on which the {17-21-038, radiant flux} is incident
    type: intensional
  examples: []
  notes:
  - content: The corresponding photometric quantity is "{17-21-060, illuminance}".
      The corresponding quantity for photons is "{17-21-058, photon irradiance}".
    type: intensional
  - content: The irradiance is expressed in watt per square metre (W⋅m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 845-01-37 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-608 in CIE S 017:2011.
    type: intensional
