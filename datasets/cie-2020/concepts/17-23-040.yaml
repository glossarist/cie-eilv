data:
  definition:
  - content: 'algebraic or vector representation of the match of two colour stimuli, of which, for instance, one can be an additive mixture of three reference colour stimuli




      In this equation, the sign "-=" indicates a colour match and is read as "matches". The unbracketed symbols represent the amounts of the stimuli indicated by the bracketed symbols: thus stem:[R][R] means stem:[R] units of stimulus [R], and the sign "+" means an additive mixture of colour stimuli. In such an equation, a minus sign means that the stimulus is added to those on the other side of the equation when the colour match is made.'
    type: intensional
  examples: []
  notes:
  - content: 'The reference stimuli are represented as [R], [G] and [B] in which case the sign "-=", read as "matches" should be used. As an alternative, the colour equation can be written using boldface Roman letters when the equal sign "=", read as "equals" should be used: *C* = stem:[X]*X* + stem:[Y]*Y* + stem:[Z]*Z*'
    type: intensional
