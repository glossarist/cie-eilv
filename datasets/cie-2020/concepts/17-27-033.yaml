data:
  definition:
  - content: high intensity discharge lamp in which the major portion of the light
      is produced by radiation from a mixture of a metallic vapour, metal halides
      and the products of the dissociation of metal halides
    type: intensional
  examples: []
  notes:
  - content: The term "metal halide lamp" includes clear and coated electric lamps.
    type: intensional
