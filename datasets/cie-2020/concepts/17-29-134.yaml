data:
  definition:
  - content: "{{17-21-053, irradiance}} produced by direct {{17-29-103, sunlight}}
      on a surface on the Earth that is perpendicular to the direction of {{17-21-099,
      irradiation}} by the Sun"
    type: intensional
  examples: []
  notes:
  - content: Normal solar irradiance is not the same as {{17-29-133, direct solar
      irradiance}}, which is measured on a horizontal surface on the Earth, not necessarily
      perpendicular to the direction of {{17-21-099, irradiation}} by the Sun.
    type: intensional
  - content: The normal solar irradiance is expressed in watt per square metre (W⋅m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 17-826 in CIE S 017:2011.
    type: intensional
