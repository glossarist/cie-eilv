data:
  definition:
  - content: 'relative decrease in radiant flux caused by absorption and scattering, expressed by the relative density of the spectral radiant flux, stem:[mu(lambda) = 1/(Phi_(e,lambda)(lambda)) ("d"Phi_(e,lambda)(lambda))/("d"I)](stem:[lambda]), with respect to propagation length, stem:[l], of a collimated beam at a point in an absorbing and scattering medium


      stem:[mu ( lambda ) = (1)/((Phi_{(e , lambda)} ( lambda ))) ((d Phi_{(e , lambda)} ( lambda )))/((d l))]'
    type: intensional
  examples: []
  notes:
  - content: The spectral linear attenuation coefficient is expressed in metre to the power minus one stem:[m^(-1)].
    type: intensional
