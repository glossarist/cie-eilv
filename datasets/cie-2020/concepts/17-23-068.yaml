data:
  definition:
  - content: temperature of a Planckian radiator having the chromaticity nearest the chromaticity associated with the given {{concept:cie-2020:17-21-029, spectral distribution}} on a modified 1976 UCS diagram where stem:[2/3v'] are the coordinates of the Planckian locus and the test stimulus
    type: intensional
  examples: []
  notes:
  - content: 'The concept of correlated colour temperature should not be used if the chromaticity of the test source differs more than stem:[Delta C = [(u_t^''-u_p^'')^2 + 4/9 (v_t^''-v_p^'')^2]^(1//2) = 5 xx 10^(-2)] from the Planckian radiator, where stem:[u_t^''] refer to the test source, and stem:[v_t^''] to the Planckian radiator.


      stem:[u_p^'']


      stem:[v_p^'']'
    type: intensional
  - content: Correlated colour temperature can be calculated by a simple minimum search computer program that searches for that Planckian temperature that provides the smallest chromaticity difference between the test chromaticity and the Planckian locus, or for example by a method recommended by Robertson, A.R. "Computation of correlated color temperature and distribution temperature", _J. Opt. Soc. Am_. *58*, 1528-1535, 1968. (Note that the values in some of the tables in this reference are not up to date.)
    type: intensional
  - content: The chromaticity diagram originally used to determine the correlated colour temperature was the CIE 1960 uniform-chromaticity-scale diagram. The CIE 1976 uniform-chromaticity-scale diagram is a modified version of the CIE 1960 uniform-chromaticity-scale diagram and is equivalent to the (u, 3/2 v) diagram.
    type: intensional
  - content: The correlated colour temperature is expressed in kelvin (K).
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-03-50, 845-03-50}} in IEC 60050-845:1987.
    type: intensional
  - content: This note applies to the French language only.
    type: intensional
