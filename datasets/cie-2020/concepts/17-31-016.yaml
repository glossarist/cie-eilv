data:
  definition:
  - content: luminous intensity of a source that has a constant output, of the same
      {{17-21-030, relative spectral distribution}} as the flashing light, which would
      have the same {{17-31-026, luminous range}} (or {{17-31-052, visual range}}
      in aviation terminology) as the flashing light under identical conditions of
      observation
    type: intensional
  examples: []
  notes:
  - content: For practical purposes, a conventional effective intensity can be evaluated
      for a flashing light from photometric data by an agreed method.
    type: intensional
  - content: The effective intensity is expressed in candela (cd).
    type: intensional
  - content: This entry was numbered {{cite:845-11-18, 845-11-18}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-360 in CIE S 017:2011.
    type: intensional
