data:
  definition:
  - content: "{{17-26-003, actinic}} effect that occurs away from the place where
      the {{17-21-041, radiant energy}} responsible for the effect is absorbed"
    type: intensional
  examples: []
  notes:
  - content: Photostimulation of endocrine glands; conversion of previtamin D3 to
      vitamin D by a non-photochemical thermal reaction.
    type: intensional
  - content: The distinction between direct and indirect actinic effect mainly applies
      to biological changes.
    type: intensional
