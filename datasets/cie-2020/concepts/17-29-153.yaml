data:
  definition:
  - content: value below which the {{17-29-151, average luminance}} of a specified
      surface is not permitted to fall
    type: intensional
  examples: []
  notes:
  - content: The maintained average luminance is the {{17-29-151, average luminance}}
      of the specified surface at the time maintenance should be carried out.
    type: intensional
  - content: The maintained average luminance is expressed in candela per square metre
      (cd·m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 17-751 in CIE S 017:2011.
    type: intensional
