data:
  definition:
  - content: coordinate system commonly used in the photometry of luminaires in which the C-planes are half-planes that rotate round the vertical line through the photometric centre of the luminaire, and the stem:[gamma]-angles are measured up to 180stem:[deg] from the direction of the perpendicular to the rotation axis of the C-planes
    type: intensional
  examples: []
  notes:
  - content: Other coordinate systems [(A, stem:[alpha]) coordinate system and (B, stem:[beta]) coordinate system] exist as well. See CIE 121, _The Photometry and Goniophotometry of Luminaires_.
    type: intensional
  - content: This entry was numbered 17-116 in CIE S 017:2011.
    type: intensional
