data:
  definition:
  - content: change in {{17-22-067, hue}} produced by changing the luminance (within
      the range of photopic vision) of a colour stimulus while keeping its chromaticity
      constant
    type: intensional
  examples: []
  notes:
  - content: With certain monochromatic stimuli, hue remains constant over a wide
      range of luminances (for a given condition of adaptation). The wavelengths of
      these stimuli are sometimes referred to as "invariant wavelengths".
    type: intensional
  - content: With increasing intensity, below 510 nm hues shift more towards blue,
      and above 510 nm hues shift more towards yellow (reds become yellower with increasing
      brightness).
    type: intensional
  - content: This entry was numbered {{cite:845-02-39, 845-02-39}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-86 in CIE S 017:2011.
    type: intensional
