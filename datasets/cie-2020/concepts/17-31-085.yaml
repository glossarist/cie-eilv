data:
  definition:
  - content: first part of the open road directly after the {17-31-094, exit portal}
      of a {17-31-081, road tunnel}
    type: intensional
  examples: []
  notes:
  - content: The parting zone is not a part of the {17-31-081, road tunnel}, but it
      is closely related to the {17-31-081, road tunnel} {17-29-001, lighting}. The
      parting zone begins at the {17-31-094, exit portal}. It is advised that the
      length of the parting zone is equal to 2 times the stopping distance. A length
      of more than 200 m is not necessary.
    type: intensional
  - content: This entry was numbered 17-863 in CIE S 017:2011.
    type: intensional
