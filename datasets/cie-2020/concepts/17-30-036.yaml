data:
  definition:
  - content: complementary angle of the cut-off angle
    type: intensional
  examples: []
  notes:
  - content: The shielding angle is the angle measured from the horizontal, down to
      which the light source(s) is (are) screened by the luminaire.
    type: intensional
  - content: The shielding angle is expressed in radian (rad) or degree (°).
    type: intensional
