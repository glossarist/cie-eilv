data:
  definition:
  - content: 'change in {{concept:cie-2020:17-21-037, luminous energy}} with time


      stem:[Phi_v = ((d Q_v))/((d t))]


      where stem:[Q_v] is the luminous energy emitted, transferred or received, and stem:[t] is time'
    type: intensional
  examples: []
  notes:
  - content: 'Luminous flux is a quantity derived from the radiant flux, stem:[Phi_e], by evaluating the radiation according to its action upon the {{concept:cie-2020:17-21-036, CIE standard photometric observer}}. Luminous flux can be derived from the spectral radiant flux distribution by


      stem:[Phi_v = K_m int_0^{oo} Phi_{(e , lambda)} ( lambda ) V ( lambda ) d lambda]


      where stem:[K_m] is maximum luminous efficacy, stem:[Phi_{e,stem:[lambd}])](stem:[lambda]) is spectral radiant flux, stem:[V](stem:[lambda]) is {{concept:cie-2020:17-21-035, spectral luminous efficiency}} and stem:[lambda] is wavelength.'
    type: intensional
  - content: 'The distribution of the luminous intensities as a function of the direction of emission, e.g. given by the polar angles (stem:[theta], stem:[phi]), is used to determine the luminous flux, stem:[Phi_v], within a certain solid angle, stem:[Omega], of a source:


      stem:[Phi_v = underset(omega)( iint ) I_v ( vartheta , phi ) sin vartheta \ d phi \ d vartheta].'
    type: intensional
  - content: The corresponding radiometric quantity is "radiant flux". The corresponding quantity for photons is "photon flux".
    type: intensional
  - content: The luminous flux is expressed in lumen (lm).
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-25, 845-01-25}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-738 in CIE S 017:2011.
    type: intensional
