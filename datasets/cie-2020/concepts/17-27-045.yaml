data:
  definition:
  - content: arc lamp, generally of very high pressure, in which the distance between
      the electrodes is of the order of 1 mm to 10 mm
    type: intensional
  examples: []
  notes:
  - content: Certain mercury vapour lamps and xenon lamps are types of short-arc lamp.
    type: intensional
