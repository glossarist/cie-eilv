data:
  definition:
  - content: angle between a defined datum axis related to the {{17-30-001, luminaire}}
      and the horizontal when the {{17-30-001, luminaire}} is mounted for photometric
      measurement
    type: intensional
  examples: []
  notes:
  - content: The defined datum axis can be any feature of the {{17-30-001, luminaire}},
      but it will usually relate to a feature that is nominally aligned with the horizontal
      such as an axis through the luminous opening or an axis through an array of
      {{17-27-050, LED}}s or a fixing spigot entry axis.
    type: intensional
  - content: The tilt during measurement is expressed in radian (rad) or degree (°).
    type: intensional
  - content: This entry was numbered 17-1316 in CIE S 017:2011.
    type: intensional
