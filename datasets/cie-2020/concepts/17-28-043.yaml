data:
  definition:
  - content: device intended, either by itself or in combination with other components,
      to generate voltage pulses to start a discharge lamp without providing for the
      preheating of the electrodes
    type: intensional
  examples: []
  notes:
  - content: The element that releases the starting voltage pulse can be either triggered
      or non-triggered.
    type: intensional
