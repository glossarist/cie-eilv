data:
  definition:
  - content: "{17-28-015, cap} which enables the {17-28-001, luminous element} to
      be brought into a specified position relative to the {17-28-015, cap} during
      manufacture of the {17-27-008, electric lamp} so that reproducible positioning
      can be assured when the {17-27-008, electric lamp} is inserted in a suitable
      {17-28-025, lampholder}"
    type: intensional
