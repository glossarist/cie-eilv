data:
  definition:
  - content: colour space defined by the characteristics of a real or idealized imaging
      device
    type: intensional
  examples: []
  notes:
  - content: Device-dependent colour spaces having a simple functional relationship
      to CIE colorimetry can also be categorized as colorimetric colour spaces. For
      example, additive RGB colour spaces corresponding to real or idealized cathode
      ray tube (CRT) displays can be treated as colorimetric colour spaces.
    type: intensional
  - content: This entry was numbered 17-228 in CIE S 017:2011.
    type: intensional
