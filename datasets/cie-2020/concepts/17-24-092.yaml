data:
  definition:
  - content: |-
      quotient of the natural (Napierian) logarithm of the reciprocal of the {17-24-088, spectral internal transmittance}, <i>τ</i><sub>i </sub>(<i>λ</i>), of a layer of the medium and the length, <i>l</i>, of the path of a beam of radiation traversing that layer

      where <i>A</i><sub>n</sub>(<i>λ</i>) is {17-24-091, Napierian spectral absorbance}.
    type: intensional
  examples: []
  notes:
  - content: The Napierian spectral absorption coefficient is expressed in metre to
      the power minus one (m<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 845-04-85 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-799 in CIE S 017:2011.
    type: intensional
