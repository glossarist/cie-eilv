data:
  definition:
  - content: 'quotient of the natural (Napierian) logarithm of the reciprocal of the spectral internal transmittance, stem:[tau_i](stem:[lambda]), of a layer of the medium and the length, stem:[l], of the path of a beam of radiation traversing that layer


      stem:[a_n ( lambda ) = - ((ln tau_i ( lambda )))/(l) = ((log tau_i ( lambda )))/(l) ln(10) = ((A_n ( lambda )))/(l)]


      where stem:[A_n](stem:[lambda]) is Napierian spectral absorbance.'
    type: intensional
  examples: []
  notes:
  - content: The Napierian spectral absorption coefficient is expressed in metre to the power minus one (m^-1^).
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-85, 845-04-85}} in IEC 60050-845:1987.
    type: intensional
