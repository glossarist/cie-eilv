data:
  definition:
  - content: illuminance produced by direct sunlight on a surface on the Earth that is perpendicular to the direction of illumination by the Sun
    type: intensional
  examples: []
  notes:
  - content: Normal solar illuminance is not the same as direct solar illuminance, which is measured on a horizontal surface on the Earth, not necessarily perpendicular to the direction of illumination by the Sun.
    type: intensional
  - content: The normal solar illuminance is expressed in lux stem:[lx = lm cdot m^(-2)].
    type: intensional
  - content: This entry was numbered 17-825 in CIE S 017:2011.
    type: intensional
