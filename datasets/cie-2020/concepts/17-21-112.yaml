data:
  definition:
  - content: luminous flux leaving the LED and propagating within a given cone angle,
      stem:[alpha], (centred from the LED's mechanical axis) that is determined by
      a circular aperture of 50 mm in diameter and the distance measured from the
      tip of the LED
    type: intensional
  examples: []
  notes:
  - content: A detailed method of measurement is given in CIE 127, _Measurement of
      LEDs_.
    type: intensional
  - content: Partial LED flux is a quantity that applies to a single LED only and
      should not be confused with the term "{{17-21-110, partial luminous flux}}".
    type: intensional
  - content: The partial LED flux is expressed in lumen (lm).
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
