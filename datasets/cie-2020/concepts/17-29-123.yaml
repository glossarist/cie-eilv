data:
  definition:
  - content: quotient of that part of the {{17-21-060, illuminance}} at a point on
      a given plane in an interior which is received directly from external reflecting
      surfaces illuminated directly or indirectly by a sky of assumed or known {{17-21-050,
      luminance}} distribution and the {{17-21-060, illuminance}} on a horizontal
      plane due to an unobstructed hemisphere of this sky, where the contribution
      of direct {{17-29-103, sunlight}} to both {{17-21-060, illuminance}}s is excluded
    type: intensional
  examples: []
  notes:
  - content: When calculating the {{17-29-001, lighting}} of interiors, the contribution
      of direct {{17-29-103, sunlight}} has to be considered separately.
    type: intensional
  - content: The externally reflected component of daylight factor has unit one.
    type: intensional
  - content: This entry was numbered 845-09-99 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-422 in CIE S 017:2011.
    type: intensional
