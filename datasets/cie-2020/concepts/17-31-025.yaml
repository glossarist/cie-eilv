data:
  definition:
  - content: |-
      law relating the {{17-21-060, illuminance}}, <i>E</i><sub>v</sub>, produced on a surface (which is normal to the direction of the {{17-27-001, light source}} and sufficiently distant for the {{17-27-001, light source}} to be considered as a {{17-21-033, point source}}) by a {{17-27-001, light source}} to the {{17-21-045, luminous intensity}}, <i>I</i><sub>v</sub>, of the {{17-27-001, light source}} in the direction of the surface, to the distance, <i>d</i>, between the surface and the {{17-27-001, light source}}, and to the {{17-31-017, atmospheric transmissivity}}, <i>T</i>, which is assumed to be uniform

      where <i>d</i><sub>0</sub> is the length specified in the definition of <i>T</i>
    type: intensional
  examples: []
  notes:
  - content: |-
      to entry: The formula in the definition is sometimes written:

      where the exponent, <i>δ</i>, in <i>T<sup>δ</sup></i> is the numerical value of the distance, <i>d</i>, measured with <i>d</i><sub>0</sub> as "unit".
    type: intensional
  - content: |-
      Taking into account the relationship between {{17-31-017, atmospheric transmissivity}}, <i>T</i>, and {{17-31-018, meteorological optical range}}, <i>v</i>, given in Note 2 to entry of the definition of "{{17-31-018, meteorological optical range}}", Allard's law can also be written as:
      .
    type: intensional
