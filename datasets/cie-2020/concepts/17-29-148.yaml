data:
  definition:
  - content: quotient of the efficiency of a {17-30-001, luminaire} at a given <a
      href="http://std.iec.ch/iev/iev.nsf/display?openform&ievref=113-01-08">instant</a>
      and the initial efficiency value
    type: intensional
  examples: []
  notes:
  - content: The luminaire maintenance factor does not include depreciation in the
      {17-21-039, luminous flux} output of the {17-27-001, light source}.
    type: intensional
  - content: The luminaire maintenance factor has unit one.
    type: intensional
  - content: This entry was numbered 17-710 and 17-687 in CIE S 017:2011.
    type: intensional
