data:
  definition:
  - content: |-
      quotient of the flux reflected in the directions delimited by a given cone with apex at a surface element, stem:[Phi_n], and the flux reflected in the same directions by a perfect reflecting diffuser identically irradiated or illuminated, stem:[Phi_d]

      stem:[R = ((Phi_n))/((Phi_d))]
    type: intensional
  examples: []
  notes:
  - content: The definition holds for a surface element, for the part of the reflected
      radiation contained in a given cone with apex at the surface element, and for
      incident radiation of given spectral composition, polarization and geometric
      distribution.
    type: intensional
  - content: The reflectance factor is also defined spectrally and is called spectral
      reflectance factor, stem:[R](stem:[lambda]).
    type: intensional
  - content: The ideal isotropic (Lambertian) diffuser with reflectance or transmittance
      equal to 1 is called a perfect diffuser.
    type: intensional
  - content: For regularly reflecting surfaces that are irradiated or illuminated
      by a beam of small solid angle, the reflectance factor can be much larger than
      1 if the cone includes the mirror image of the source.
    type: intensional
  - content: If the solid angle of the cone approaches 2π sr, the reflectance factor
      approaches the reflectance for the same conditions of irradiation.
    type: intensional
  - content: If the solid angle of the cone approaches 0 sr, the reflectance factor
      approaches the radiance factor or luminance factor for the same conditions of
      irradiation.
    type: intensional
  - content: The reflectance factor has unit one.
    type: intensional
  - content: This entry was numbered {{cite:845-04-64, 845-04-64}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1059 in CIE S 017:2011.
    type: intensional
