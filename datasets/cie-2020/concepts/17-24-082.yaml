data:
  definition:
  - content: |-
      quotient of absorbed radiant flux, stem:[Phi_a], and incident radiant flux, stem:[Phi_m]

      stem:[alpha = ((Phi_a))/((Phi_m))]
    type: intensional
  examples: []
  notes:
  - content: The absorptance is also defined spectrally in terms of wavelength, in
      which case, "spectral" is added before the quantity name.
    type: intensional
  - content: Due to energy conservation, stem:[alpha] + stem:[rho] + stem:[tau] =
      1 except when {{17-21-017, polarized radiation}} is observed, where stem:[rho]
      is reflectance and stem:[tau] is transmittance.
    type: intensional
  - content: The absorptance has unit one.
    type: intensional
  - content: This entry was numbered {{cite:845-04-75, 845-04-75}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-5 in CIE S 017:2011.
    type: intensional
