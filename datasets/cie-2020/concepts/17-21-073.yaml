data:
  definition:
  - content: 'density of incident photon number with respect to area at a point on a real or imaginary surface


      stem:[H_p = ((d N_p))/((d A))]


      where stem:[N_p] is photon number and stem:[A] is the area on which the photons are incident'
    type: intensional
  examples: []
  notes:
  - content: The corresponding radiometric quantity is "radiant exposure". The corresponding photometric quantity is "luminous exposure".
    type: intensional
  - content: The photon exposure is expressed in metre to the power minus two (m^−2^).
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-44, 845-01-44}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-924 in CIE S 017:2011.
    type: intensional
