data:
  definition:
  - content: |-
      quotient of the {17-21-053, irradiance} or {17-21-060, illuminance}, <i>E</i><sub>2</sub> (or <i>E</i><sub>1</sub>), at a point on surface S<sub>2</sub> (or S<sub>1</sub>) due to the flux received from surface S<sub>1</sub> (or S<sub>2</sub>) and the {17-21-080, radiant exitance} or {17-21-081, luminous exitance}, <i>M</i><sub>1</sub> (or <i>M</i><sub>2</sub>), of surface S<sub>1</sub> (or S<sub>2</sub>)

      or
    type: intensional
  examples: []
  notes:
  - content: |-
      The relation between the configuration factor, <i>c</i>, and the (mutual) exchange coefficient, <i>g</i>, is:

      where <i>Φ</i><sub>2</sub> (or <i>Φ</i><sub>1</sub>) is the flux received over surface S<sub>2</sub> (or S<sub>1</sub>) from surface S<sub>1</sub> (or S<sub>2</sub>) and <i>A</i><sub>2</sub> (or <i>A</i><sub>1</sub>) is the area of surface S<sub>2</sub> (or S<sub>1</sub>)
    type: intensional
  - content: The configuration factor has unit one.
