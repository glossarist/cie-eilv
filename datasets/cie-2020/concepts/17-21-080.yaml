data:
  definition:
  - content: |-
      density of exiting {17-21-038, radiant flux} with respect to area at a point on a real or imaginary surface

      where <i>Φ</i><sub>e</sub> is {17-21-038, radiant flux} and <i>A</i> is the area from which the {17-21-038, radiant flux} leaves
    type: intensional
  examples: []
  notes:
  - content: For Planckian radiation, <i>M</i><sub>e</sub> = <i>σ</i> <i>T</i><sup>4</sup>
      where <i>σ</i> is the Stefan–Boltzmann constant and <i>T</i> is thermodynamic
      temperature.
    type: intensional
  - content: The corresponding photometric quantity is "{17-21-081, luminous exitance}".
      The corresponding photon quantity is "{17-21-082, photon exitance}".
    type: intensional
  - content: The radiant exitance is expressed in watt per square metre (W⋅m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 845-01-47 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1020 in CIE S 017:2011.
    type: intensional
