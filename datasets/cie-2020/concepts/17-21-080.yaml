data:
  definition:
  - content: 'density of exiting radiant flux with respect to area at a point on a real or imaginary surface


      stem:[M_e = ("d" Phi_e)/("d" A)]


      where stem:[Phi_e] is radiant flux and stem:[A] is the area from which the radiant flux leaves'
    type: intensional
  examples: []
  notes:
  - content: For Planckian radiation, stem:[M_e] = stem:[sigmaT^4] where stem:[sigma] is the Stefan-Boltzmann constant and stem:[T] is thermodynamic temperature.
    type: intensional
  - content: The corresponding photometric quantity is "luminous exitance". The corresponding photon quantity is "photon exitance".
    type: intensional
  - content: The radiant exitance is expressed in watt per square metre stem:[W cdot m^(-2)].
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-01-47, 845-01-47}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1020 in CIE S 017:2011.
    type: intensional
