data:
  definition:
  - content: digital encoding of {{17-23-001, colour}} values, together with any information
      necessary to interpret properly the {{17-23-001, colour}} values such as the
      {{17-32-050, image state}}, the intended image viewing environment and the {{17-32-062,
      reference medium}}
    type: intensional
  examples: []
  notes:
  - content: In some cases the intended image viewing environment will be explicitly
      defined for the colour image encoding. In other cases, the intended image viewing
      environment, i.e. details of the {{17-32-050, image state}}, can be specified
      on an image-by-image basis using metadata associated with the digital image.
    type: intensional
  - content: Some colour image encodings will indicate particular {{17-32-062, reference
      medium}} characteristics, such as a reflection print with a specified density
      range. In other cases the {{17-32-062, reference medium}} will be not applicable,
      such as with a scene-referred encoding, or will be specified using image metadata.
    type: intensional
  - content: Colour image encodings are not limited to pictorial digital images that
      originate from an original scene, but are also applicable to digital images
      with content such as text, line art, vector graphics and other forms of original
      artwork.
    type: intensional
  - content: This entry was numbered 17-217 in CIE S 017:2011.
    type: intensional
