data:
  definition:
  - content: material which exhibits {{17-24-022, photoluminescence}} as the result
      of exposure to {{17-21-002, optical radiation}}
    type: intensional
  examples: []
  notes:
  - content: Photoluminescent materials absorb energy from {{17-21-002, optical radiation}}
      in the shorter {{17-21-025, wavelength}} regions of the visible spectrum and/or
      in the ultraviolet region and re-radiate some of this energy at longer {{17-21-025,
      wavelength}}s, producing narrow bands of {{17-24-001, emission}} in the visible
      region.
    type: intensional
  - content: See also "{{17-24-041, fluorescent material}}", "{{17-22-055, daylight
      fluorescent colour}}".
    type: intensional
  - content: This entry was numbered 17-908 in CIE S 017:2011.
    type: intensional
  sources:
