data:
  definition:
  - content: spectrum of radiation whose {{17-21-029, spectral distribution}} of a
      radiometric quantity as a function of wavelength is constant throughout the
      visible region
    type: intensional
  examples: []
  notes:
  - content: The radiation of the equi-energy spectrum is sometimes regarded as an
      illuminant, in which case it is denoted by the symbol E.
    type: intensional
