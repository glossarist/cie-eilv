data:
  definition:
  - content: factor describing the protective quality of a sunscreen against solar
      {{17-21-008, ultraviolet radiation}}, normally determined by in vivo testing
    type: intensional
  examples: []
  notes:
  - content: |-
      The sun protection factor is usually determined by comparing the dose of ultraviolet radiation from a solar simulator (often a xenon lamp) required to produce just-perceptible actinic erythema approximately 24 h after exposure in ultraviolet-irradiated human volunteers, with and without a standard amount of the sunscreen being present (F~MED,f~ and F~MED,i~, respectively) and is calculated as follows:

      stem:[F_(SP)] = stem:[F_(MED,f)] / stem:[F_(MED,i)].
    type: intensional
  - content: The sun protection factor can also be determined by equivalent in vitro
      methods.
    type: intensional
  - content: The sun protection factor has unit one.
    type: intensional
  - content: This entry was numbered 17-1278 and 17-1243 in CIE S 017:2011.
    type: intensional
