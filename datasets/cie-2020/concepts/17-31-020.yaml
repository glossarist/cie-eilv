data:
  definition:
  - content: 'law relating the apparent contrast, stem:[C_d = C_0T^(d//d_0)], of an object against a sky background, at a given distance of observation, stem:[d], to the inherent contrast, stem:[C_0], and to the atmospheric transmissivity, stem:[T], which is assumed to be uniform


      stem:[C_d = C_0 T^{d // d_0}]


      where stem:[d_0] is the length specified for the definition of stem:[T]'
    type: intensional
  examples: []
  notes:
  - content: 'The formula is sometimes written


      stem:[C_d = C_0 T^delta]


      where the exponent, stem:[delta], in stem:[Tdelta] is the numerical value of stem:[d] measured with stem:[d_0] as "unit".'
    type: intensional
  - content: 'Taking into account the relationship between atmospheric transmissivity, stem:[C_d = C_0(0.05^(d//v))], and meteorological optical range, stem:[v], given in Note 2 to entry of "{{concept:cie-2020:17-31-018, meteorological optical range}}", Koschmieder''s law can be also written as


      stem:[C_d = C_0 ( 0,05^{d // v} )]'
    type: intensional
  - content: The contrast is taken to be the quotient of the difference between the luminance of the object and the luminance of the background, and the luminance of the background.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-11-22, 845-11-22}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-629, 17-629}} in CIE S 017:2011.
    type: intensional
