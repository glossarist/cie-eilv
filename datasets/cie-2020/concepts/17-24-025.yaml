data:
  definition:
  - content: "{17-24-022, photoluminescence} whose radiation is located in a spectral
      region of shorter {17-21-025, wavelength}s than that of the exciting radiation"
    type: intensional
  examples: []
  notes:
  - content: Anti-Stokes luminescence happens, for instance, when the energy of the
      emitted {17-21-107, photon}s originates from the {17-24-081, absorption} of
      two exciting {17-21-107, photon}s.
    type: intensional
