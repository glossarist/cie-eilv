data:
  definition:
  - content: quotient of the mean of the values of {{17-21-050, luminance}}, <i>L</i>,
      measured at 20° and 70° (0,35 rad and 1,22 rad) and the {{17-21-050, luminance}}
      measured at 5° (0,09 rad) from the normal, when the surface considered is illuminated
      normally
    type: intensional
  examples: []
  notes:
  - content: The diffusion factor is intended to give an indication of the spatial
      distribution of the diffused flux. It is equal to 1 for every isotropic {{17-30-039,
      diffuser}}, whatever the value of the {{17-24-068, diffuse reflectance}} or
      {{17-24-069, diffuse transmittance}}.
    type: intensional
  - content: This way of defining the diffusion factor can be applied only to materials
      for which the {{17-24-098, scattering indicatrix}} does not differ appreciably
      from that of ordinary opal glasses.
    type: intensional
  - content: For indicating the shape of the {{17-24-098, scattering indicatrix}}
      it is recommended that the diffusion factor, <i>σ</i>, be used for strongly
      diffusing materials, and the {{17-24-097, half-value angle}}, <i>γ</i>, for
      poorly diffusing materials.
    type: intensional
  - content: The diffusion factor has unit one.
    type: intensional
  - content: This entry was numbered 845-04-89 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-312 in CIE S 017:2011.
    type: intensional
