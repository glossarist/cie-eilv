data:
  definition:
  - content: |-
      quotient of the mean of the values of luminance, stem:[L], measured at 20° and 70° (0,35 rad and 1,22 rad) and the luminance measured at 5° (0,09 rad) from the normal, when the surface considered is illuminated normally

      stem:[sigma = ((L ( 20 ° ) + L ( 70 ° )))/((2 L ( 5 ° )))]
    type: intensional
  examples: []
  notes:
  - content: The diffusion factor is intended to give an indication of the spatial
      distribution of the diffused flux. It is equal to 1 for every isotropic diffuser,
      whatever the value of the diffuse reflectance or diffuse transmittance.
    type: intensional
  - content: This way of defining the diffusion factor can be applied only to materials
      for which the scattering indicatrix does not differ appreciably from that of
      ordinary opal glasses.
    type: intensional
  - content: For indicating the shape of the scattering indicatrix it is recommended
      that the diffusion factor, stem:[sigma], be used for strongly diffusing materials,
      and the half-value angle, stem:[gamma], for poorly diffusing materials.
    type: intensional
  - content: The diffusion factor has unit one.
    type: intensional
  - content: This entry was numbered {{cite:845-04-89, 845-04-89}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-312 in CIE S 017:2011.
    type: intensional
