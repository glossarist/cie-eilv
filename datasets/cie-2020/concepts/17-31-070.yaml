data:
  definition:
  - content: signal light carried on a vehicle to indicate its location when it is viewed from the back
    type: intensional
  examples: []
  notes:
  - content: A rear position light can also, particularly if paired with an identical light, provide an indication of the width of the vehicle.
    type: intensional
