data:
  definition:
  - content: temperature of the Planckian radiator for which the radiance at the specified
      wavelength has the same spectral concentration as for the thermal radiator considered
    type: intensional
  examples: []
  notes:
  - content: The radiance temperature is expressed in kelvin (K).
