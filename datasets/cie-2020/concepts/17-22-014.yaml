data:
  definition:
  - content: phenomenon in which the {{17-32-058, adopted white}} in a given viewing
      environment does not actually appear white to an observer
    type: intensional
  examples: []
  notes:
  - content: Familiar instances of viewing environments in which incomplete adaptation
      occurs include colour images on newsprint or displays that appear "too yellow"
      or "too blue".
    type: intensional
  - content: This entry was numbered 17-19 in CIE S 017:2011.
    type: intensional
