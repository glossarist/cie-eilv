data:
  definition:
  - content: angle between two imaginary lines in a plane through the {17-27-076,
      optical beam axis}, such that these lines pass through the centre of the front
      face of the device and through points at which the {17-21-045, luminous intensity}
      is 50 % of the {17-27-078, centre beam intensity}
    type: intensional
  examples: []
  notes:
  - content: The beam angle is a full angle measure, not a half angle measure.
    type: intensional
  - content: The beam angle is expressed in degree (°).
    type: intensional
  sources:
