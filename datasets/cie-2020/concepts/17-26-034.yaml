data:
  definition:
  - content: "{17-26-033, dose} which produces the effect considered"
    type: intensional
  examples: []
  notes:
  - content: This definition is based on the assumption that an {17-26-027, action
      spectrum} is adopted for the effect considered, and that its maximum value is
      1.
    type: intensional
  - content: It is essential to specify which {17-26-027, action spectrum} is used,
      as the unit is the same for any {17-26-027, action spectrum}.
    type: intensional
  - content: The effective dose is expressed in joule per square metre (J·m<sup>−2</sup>).
    type: intensional
  - content: This entry was numbered 845-06-22 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-359 in CIE S 017:2011.
    type: intensional
