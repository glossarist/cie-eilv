data:
  definition:
  - content: dose which produces the effect considered
    type: intensional
  examples: []
  notes:
  - content: This definition is based on the assumption that an action spectrum is
      adopted for the effect considered, and that its maximum value is 1.
    type: intensional
  - content: It is essential to specify which action spectrum is used, as the unit
      is the same for any action spectrum.
    type: intensional
  - content: The effective dose is expressed in joule per square metre (J·m^−2^).
    type: intensional
  - content: This entry was numbered {{cite:845-06-22, 845-06-22}} in IEC 60050-845:1987.
    type: intensional
