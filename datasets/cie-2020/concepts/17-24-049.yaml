data:
  definition:
  - content: process by which the spatial distribution of a beam of radiation is changed
      when it is deviated in many directions by a surface or by a medium, without
      change in {{cite:IEV:103-06-02, frequency}} of its monochromatic components
    type: intensional
  examples: []
  notes:
  - content: A distinction is made between {{concept:cie-2020:17-24-050, selective
      scattering}} and {{concept:cie-2020:17-24-051, non-selective scattering}} according
      to whether or not the scattering properties vary with the wavelength of the
      incident radiation.
    type: intensional
  - content: The frequency is unchanged only if there is no Doppler effect due to
      the motion of the materials from which the radiation is returned.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-44, 845-04-44}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1139 and 17-311 in CIE S 017:2011.
    type: intensional
