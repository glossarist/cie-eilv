data:
  definition:
  - content: regularly transmitting device used to modify the absolute flux level
      (radiant or luminous) or {{17-21-030, relative spectral distribution}}, or both,
      of the radiation passing through it
    type: intensional
  examples: []
  notes:
  - content: A distinction is made between {{17-24-116, selective filter}}s and {{17-24-115,
      non-selective filter}}s or neutral filters according to whether they do or do
      not alter the {{17-21-030, relative spectral distribution}} of the radiation.
      A {{17-24-116, selective filter}} that makes a significant change in the {{17-23-052,
      chromaticity}} of the radiation is called a {{17-24-114, colour filter}}; one
      that alters the {{17-21-029, spectral distribution}} but, because of {{17-23-006,
      metamerism}}, transmits radiation of nearly the same {{17-23-052, chromaticity}}
      as that of the incident radiation, can be called a "grey filter".
    type: intensional
  - content: This entry was numbered 845-04-105 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-434 in CIE S 017:2011.
    type: intensional
