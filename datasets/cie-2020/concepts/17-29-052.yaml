data:
  definition:
  - content: quotient of the total luminous flux of the luminaire, measured under specified practical conditions with its own lamp(s) and equipment, and the sum of the individual luminous fluxes of the same lamp(s) when operated outside the luminaire with the same equipment, under specified conditions
    type: intensional
  examples: []
  notes:
  - content: For luminaires using incandescent lamps only, the optical light output ratio and the light output ratio are the same in practice.
    type: intensional
  - content: The light output ratio has unit one.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-09-39, 845-09-39}} in IEC 60050-845:1987.
    type: intensional
  - content: This note applies to the French language only.
    type: intensional
