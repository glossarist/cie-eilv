data:
  definition:
  - content: law stating that the total {17-21-071, radiant exposure} required to
      elicit a given photobiological or photochemical response is independent of the
      duration over which the exposure occurs
    type: intensional
  examples: []
  notes:
  - content: The Bunsen–Roscoe law generally holds only over a given limited range
      of {17-26-071, exposure duration}s. Reciprocity failure can occur due to repair
      mechanisms, recombination effects over long periods, or {17-21-107, photon}
      saturation for extremely short periods.
    type: intensional
  - content: This entry was numbered 17-114 and 17-1045 in CIE S 017:2011.
    type: intensional
  sources:
