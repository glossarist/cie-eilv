data:
  definition:
  - content: "{{17-29-001, lighting}} design technique where the light falls on objects
      from a direction opposite to that of the traffic"
    type: intensional
  examples: []
  notes:
  - content: Counter-beam lighting is characterized by using {{17-30-001, luminaire}}s
      that show a {{17-29-037, luminous intensity distribution}} that is asymmetric
      in relation to the plane normal to the direction of the traffic, where the maximum
      {{17-21-045, luminous intensity}} is aimed against the direction of the traffic.
      The term refers only to the direction of normal travel.
    type: intensional
  - content: See also "{{17-31-095, pro-beam lighting}}", "{{17-31-097, symmetric
      lighting}}"
    type: intensional
  - content: This entry was numbered 17-261 and 17-129 in CIE S 017:2011.
    type: intensional
  sources:
