data:
  definition:
  - content: colour perceived to belong to an area that appears to be transmitting
      or diffusely reflecting light as a secondary light source
    type: intensional
  examples: []
  notes:
  - content: Secondary light sources seen in their natural surroundings normally exhibit
      the appearance of non-luminous colours in this sense.
    type: intensional
