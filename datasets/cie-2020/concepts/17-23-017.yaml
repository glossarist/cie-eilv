data:
  definition:
  - content: arrangement of samples according to a set of principles for the ordering
      and denotation of their colour, usually according to defined scales
    type: intensional
  examples: []
  notes:
  - content: A colour order system is usually exemplified by a set of physical samples,
      but this is not a prerequisite for defining a colour order system.
    type: intensional
  - content: See also "{{17-21-029, colour atlas}}".
    type: intensional
