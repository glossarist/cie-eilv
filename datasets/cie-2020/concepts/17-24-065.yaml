data:
  definition:
  - content: quotient of transmitted {17-21-038, radiant flux}, <i>Φ</i><sub>t</sub>,
      and incident {17-21-038, radiant flux}, <i>Φ</i><sub>m </sub>
    type: intensional
  examples: []
  notes:
  - content: Transmittance is also defined spectrally in terms of {17-21-025, wavelength},
      in which case, "spectral" is added before the quantity name.
    type: intensional
  - content: Due to energy conservation, <i>α</i> + <i>ρ</i> + <i>τ</i> = 1 except
      when {17-21-017, polarized radiation} is observed, where <i>α</i> is absorptance
      and <i>ρ</i> is {17-24-064, reflectance}.
    type: intensional
  - content: 'Transmittance, <i>τ</i>, is the sum of {17-24-067, regular transmittance},
      <i>τ</i><sub>r</sub>, and {17-24-069, diffuse transmittance}, <i>τ</i><sub>d</sub>:
      <i>τ</i> = <i>τ</i><sub>r</sub> + <i>τ</i><sub>d</sub>.'
    type: intensional
  - content: The transmittance has unit one.
    type: intensional
  - content: This entry was numbered 845-04-59 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1337 in CIE S 017:2011.
    type: intensional
