data:
  definition:
  - content: 'quotient of transmitted radiant flux, stem:[Phi_t], and incident radiant flux, stem:[Phi_m]


      stem:[tau = ((Phi_t))/((Phi_m))]'
    type: intensional
  examples: []
  notes:
  - content: Transmittance is also defined spectrally in terms of wavelength, in which case "spectral" is added before the quantity name.
    type: intensional
  - content: Due to energy conservation, stem:[alpha] + stem:[rho] + stem:[tau] = 1 except when {{concept:cie-2020:17-21-017, polarized radiation}} is observed, where stem:[alpha] is absorptance and stem:[rho] is reflectance.
    type: intensional
  - content: 'Transmittance, stem:[tau], is the sum of regular transmittance, stem:[tau_r], and diffuse transmittance, stem:[tau_d]: stem:[tau] = stem:[tau_r] + stem:[tau_d].'
    type: intensional
  - content: The transmittance has unit one.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-59, 845-04-59}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1337 in CIE S 017:2011.
    type: intensional
