data:
  definition:
  - content: effective irradiance with the spectral irradiance, stem:[Elambda], spectrally
      weighted with the ultraviolet hazard spectral weighting function, stem:[S_(UV)](stem:[lambda])
    type: intensional
  examples: []
  notes:
  - content: The wavelength range for ultraviolet hazard irradiance is specified in
      ICNIRP-recommendations as stem:[lambda] = 180 nm to stem:[lambda] = 400 nm.
    type: intensional
  - content: The ultraviolet hazard irradiance is expressed in watt per square metre
      (W·m^−2^).
    type: intensional
  - content: This entry was numbered 17-1361 in CIE S 017:2011.
    type: intensional
