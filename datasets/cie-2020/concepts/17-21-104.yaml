data:
  definition:
  - content: quotient of the reflected {17-21-049, radiance} at a point on a surface
      of a non-self-radiating medium in a given direction and that of the {17-24-060,
      perfect reflecting diffuser} identically irradiated and viewed
    type: intensional
  examples: []
  notes:
  - content: In general, the reflected radiance factor from a surface does not depend
      upon the {17-21-030, relative spectral distribution} of the {17-21-099, irradiation}.
      This is not the case for a photoluminescent surface, where it is necessary to
      specify this quantity.
    type: intensional
  - content: The reflected radiance factor has unit one.
    type: intensional
  - content: This entry was numbered 17-1064 in CIE S 017:2011.
    type: intensional
