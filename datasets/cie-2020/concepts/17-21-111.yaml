data:
  definition:
  - content: part of the luminous flux of a light source that contributes predominantly to the lighting task
    type: intensional
  examples: []
  notes:
  - content: For non-directional light sources, the useful luminous flux is the total luminous flux of the light source.
    type: intensional
  - content: For directional light sources the useful luminous flux is the partial luminous flux in a defined cone angle, the axis of the cone being the optical beam axis of the light source.
    type: intensional
  - content: The cone angle, stem:[alpha], which can be expressed either in degree (°) or radian (rad), is given by the full conic angle and has to be specified, e.g. stem:[Phi_(u,90°)] or stem:[Phi_(u,pi/2)].
    type: intensional
  - content: The optical beam axis of a light source is the axis about which the luminous intensity is substantially symmetrical.
    type: intensional
  - content: The useful luminous flux is expressed in lumen (lm).
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: useful luminous flux
    usage_info: of a directional light source
  - type: symbol
    normative_status: preferred
    designation: stem:[Phi]v,u,stem:[alpha] ; stem:[Phi]u,stem:[alpha]
