data:
  definition:
  - content: emission of {{17-21-002, optical radiation}} when a substance is exposed
      to any type of electromagnetic radiation, where the emitted radiation generally
      appears within 10 ns after the excitation
    type: intensional
  examples: []
  notes:
  - content: Fluorescence is due to an "allowed" transition generally from an excited
      singlet state to a ground singlet state.
    type: intensional
