data:
  definition:
  - content: "{{17-22-040, colour}} perceived to belong to an area that appears to
      be emitting light as a {{17-27-002, primary light source}}, or that appears
      to be specularly reflecting such light"
    type: intensional
  examples: []
  notes:
  - content: "{{17-27-002, primary light source}}s seen in their natural surroundings
      normally exhibit the {{17-22-019, appearance}} of luminous colours in this sense."
