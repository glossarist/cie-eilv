data:
  definition:
  - content: "{{17-30-001, luminaire}} that cannot easily be moved from one place
      to another, either because the fixing is such that the {{17-30-001, luminaire}}
      can only be removed with the aid of a tool, or because it is intended for use
      out of arm's reach"
    type: intensional
  examples: []
  notes:
  - content: In general, fixed luminaires are designed for permanent connection to
      the power supply, but connection can also be made by means of a plug or similar
      device.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
