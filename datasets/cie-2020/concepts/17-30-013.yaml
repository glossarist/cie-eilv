data:
  definition:
  - content: luminaire that cannot easily be moved from one place to another, either
      because the fixing is such that the luminaire can only be removed with the aid
      of a tool, or because it is intended for use out of {{cite:195-06-12, arm's
      reach}}
    type: intensional
  examples: []
  notes:
  - content: In general, fixed luminaires are designed for permanent connection to
      the power supply, but connection can also be made by means of a plug or similar
      device.
    type: intensional
