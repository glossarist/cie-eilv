data:
  definition:
  - content: radiation with a relative spectral power distribution defined over the
      wavelength range that influences object colour perception
    type: intensional
  examples: []
  notes:
  - content: In everyday English, the meaning of the term "illuminant" is not restricted
      to this sense, but is also used for any kind of light falling on a body or scene.
    type: intensional
