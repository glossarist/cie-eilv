data:
  definition:
  - content: quotient of the diffusely reflected part of the (whole) reflected flux
      and the incident flux
    type: intensional
  examples: []
  notes:
  - content: 'Reflectance, stem:[rho], is the sum of regular reflectance, stem:[rho_r],
      and diffuse reflectance, stem:[rho_d]: stem:[rho] = stem:[rho_r] + stem:[rho_d].'
    type: intensional
  - content: The diffuse reflectance has unit one.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-62, 845-04-62}} in IEC 60050-845:1987.
    type: intensional
