data:
  definition:
  - content: quotient of the diffusely reflected part of the (whole) reflected flux
      and the incident flux
    type: intensional
  examples: []
  notes:
  - content: "{17-24-064, reflectance}, <i>ρ</i>, is the sum of {17-24-066, regular
      reflectance}, <i>ρ</i><sub>r</sub>, and diffuse reflectance, <i>ρ</i><sub>d</sub>:<sub>
      </sub><i>ρ</i> = <i>ρ</i><sub>r</sub> + <i>ρ</i><sub>d</sub>."
    type: intensional
  - content: The diffuse reflectance has unit one.
    type: intensional
  - content: This entry was numbered 845-04-62 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-304 in CIE S 017:2011.
    type: intensional
