data:
  definition:
  - content: Lambert's law for a surface element whose {17-21-049, radiance} or {17-21-050,
      luminance} is the same in all directions of the hemisphere above the surface
    type: intensional
  examples: []
  notes:
  - content: |-
      Lambert's cosine law can be expressed by
      <i>I</i>(<i>θ</i>) = <i>I</i><sub>n </sub>cos<i>θ</i>
      where <i>I</i>(<i>θ</i> ) and <i>I</i><sub>n</sub> are the radiant intensities or luminous intensities of the surface element in a direction at an angle, <i>θ</i>, from the normal to the surface and in the direction of that normal, respectively.
    type: intensional
  - content: This entry was numbered 845-04-56 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-632 in CIE S 017:2011.
    type: intensional
