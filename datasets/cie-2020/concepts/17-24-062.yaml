data:
  definition:
  - content: Lambert's law for a surface element whose radiance or luminance is the same in all directions of the hemisphere above the surface
    type: intensional
  examples: []
  notes:
  - content: 'Lambert''s cosine law can be expressed by


      stem:[I](stem:[theta]) = stem:[I_{n }]cos stem:[theta]


      where stem:[I](stem:[theta]) and stem:[I_n] are the radiant intensities or luminous intensities of the surface element in a direction at an angle, stem:[theta], from the normal to the surface and in the direction of that normal, respectively.'
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-56, 845-04-56}} in IEC 60050-845:1987.
    type: intensional
