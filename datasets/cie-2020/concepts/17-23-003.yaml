data:
  definition:
  - content: function describing the {{17-21-029, spectral distribution}} of the {{17-23-002,
      colour stimulus}}
    type: intensional
  examples: []
  notes:
  - content: The colour stimulus function is generated by the {{17-21-029, spectral
      distribution}} of a radiometric quantity, such as {{17-21-049, radiance}} or
      {{17-21-038, radiant flux}}.
    type: intensional
  - content: For {{17-22-042, object colour}}s the colour stimulus function, <i>φ<sub>λ</sub></i>(<i>λ</i>),
      is equal to the product of the {{17-21-030, relative spectral distribution}},
      <i>S</i>(<i>λ</i>), and either the spectral {{17-24-064, reflectance}}, <i>ρ</i>(<i>λ</i>),
      or the spectral {{17-24-075, radiance factor}}, <i>β</i>(<i>λ</i>), or the spectral
      {{17-24-065, transmittance}}, <i>τ</i>(<i>λ</i>), depending on the application.
    type: intensional
  - content: This entry was numbered 845-03-03 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-230 in CIE S 017:2011.
    type: intensional
