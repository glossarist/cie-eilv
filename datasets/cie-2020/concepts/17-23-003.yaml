data:
  definition:
  - content: function describing the spectral distribution of the colour stimulus
    type: intensional
  examples: []
  notes:
  - content: The colour stimulus function is generated by the {{17-21-029, spectral
      distribution}} of a radiometric quantity, such as radiance or radiant flux.
    type: intensional
  - content: For object colours, the colour stimulus function, stem:[philambda](stem:[lambda]),
      is equal to the product of the {{17-21-030, relative spectral distribution}},
      stem:[S](stem:[lambda]), and either the spectral reflectance, stem:[rho](stem:[lambda]),
      or the spectral radiance factor, stem:[beta](stem:[lambda]), or the spectral
      transmittance, stem:[tau](stem:[lambda]), depending on the application.
    type: intensional
  - content: This entry was numbered 845-03-03 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-230 in CIE S 017:2011.
    type: intensional
