data:
  definition:
  - content: physical quantity yielded by a detector in response to an optical input
    type: intensional
  examples: []
  notes:
  - content: The output can be electrical, e.g. current, voltage or a change in resistance,
      or chemical, e.g. in a photographic film or an actinometer, or mechanical, e.g.
      in a Golay detector.
