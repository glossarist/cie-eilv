data:
  definition:
  - content: quotient of the regularly transmitted part of the (whole) transmitted flux and the incident flux
    type: intensional
  examples: []
  notes:
  - content: 'Transmittance, stem:[tau], is the sum of regular transmittance, stem:[tau_r], and diffuse transmittance, stem:[tau_d]: stem:[tau] = stem:[tau_r] + stem:[tau_d].'
    type: intensional
  - content: The regular transmittance has unit one.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-61, 845-04-61}} in IEC 60050-845:1987.
    type: intensional
