data:
  definition:
  - content: quotient of the regularly transmitted part of the (whole) transmitted
      flux and the incident flux
    type: intensional
  examples: []
  notes:
  - content: "{17-24-065, transmittance}, <i>τ</i>, is the sum of regular transmittance,
      <i>τ</i><sub>r</sub>, and {17-24-069, diffuse transmittance}, <i>τ</i><sub>d</sub>:<sub>
      </sub><i>τ</i> = <i>τ</i><sub>r</sub> + <i>τ</i><sub>d</sub>."
    type: intensional
  - content: The regular transmittance has unit one.
    type: intensional
