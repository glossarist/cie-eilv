data:
  definition:
  - content: quotient of the regularly reflected part of the (whole) reflected flux
      and the incident flux
    type: intensional
  examples: []
  notes:
  - content: "{17-24-064, reflectance}, <i>ρ</i>, is the sum of regular reflectance,
      <i>ρ</i><sub>r</sub>, and {17-24-068, diffuse reflectance}, <i>ρ</i><sub>d</sub>:<sub>
      </sub><i>ρ</i> = <i>ρ</i><sub>r</sub> + <i>ρ</i><sub>d</sub>."
    type: intensional
  - content: The regular reflectance has unit one.
    type: intensional
  - content: This entry was numbered 845-04-60 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1076 in CIE S 017:2011.
    type: intensional
