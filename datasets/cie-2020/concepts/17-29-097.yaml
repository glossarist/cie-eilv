data:
  definition:
  - content: irradiance produced by the extraterrestrial solar radiation on a surface
      perpendicular to the Sun's rays at mean Sun-Earth distance
    type: intensional
  examples: []
  notes:
  - content: The solar constant is expressed in watt per square metre (W·m^−2^).
    type: intensional
