data:
  definition:
  - content: reciprocal of the least perceptible {17-22-091, luminance contrast},
      usually expressed as <i>L</i>/Δ<i>L</i><sub>th</sub>, where <i>L</i> is the
      {17-29-151, average luminance} and Δ<i>L</i><sub>th</sub> is the {17-22-088,
      luminance difference threshold}
    type: intensional
  examples: []
  notes:
  - content: The value of <i>S</i><sub>c</sub> depends on a number of factors including
      the {17-21-050, luminance}, the viewing conditions and the {17-22-015, state
      of adaptation}.
    type: intensional
  - content: The contrast sensitivity has unit one.
    type: intensional
  - content: This entry was numbered 845-02-48 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-255 in CIE S 017:2011.
    type: intensional
