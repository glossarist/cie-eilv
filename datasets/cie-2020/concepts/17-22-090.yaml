data:
  definition:
  - content: reciprocal of the least perceptible luminance contrast, usually expressed
      as stem:[L]/stem:[Delta L_(th)], where stem:[L] is the average luminance and
      stem:[Delta L_(th)] is the luminance difference threshold
    type: intensional
  examples: []
  notes:
  - content: The value of stem:[S_c] depends on a number of factors including the
      luminance, the viewing conditions and the state of adaptation.
    type: intensional
  - content: The contrast sensitivity has unit one.
    type: intensional
  - content: This entry was numbered 845-02-48 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-255 in CIE S 017:2011.
    type: intensional
