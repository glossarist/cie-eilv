data:
  definition:
  - content: time required for an output to fall from a stated high percentage to
      a stated lower percentage of the maximum value when a steady input is instantaneously
      removed
    type: intensional
  examples: []
  notes:
  - content: A value of 90 % is usually considered to be the high percentage value,
      whereas a value of 10 % is usually considered to be the low percentage value.
    type: intensional
  - content: The fall time is expressed in seconds (s).
    type: intensional
  - content: This entry was numbered 845-05-61 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-427 in CIE S 017:2011.
    type: intensional
