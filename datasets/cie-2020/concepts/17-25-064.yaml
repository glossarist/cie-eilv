data:
  definition:
  - content: |-
      quotient of the {{17-25-063, spectral responsivity}}, <i>s</i>(<i>λ</i>), of the {{17-25-035, detector}} at {{17-21-025, wavelength}}, <i>λ</i>, and a specified reference value, <i>s</i><sub>m</sub><sub>


      </sub>
    type: intensional
  examples: []
  notes:
  - content: The specified reference value, <i>s</i><sub>m</sub>, can be an average
      value, a maximum value or an arbitrarily chosen value of <i>s</i>(<i>λ</i>).
    type: intensional
  - content: The relative spectral responsivity has unit one.
    type: intensional
