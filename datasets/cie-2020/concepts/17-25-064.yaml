data:
  definition:
  - content: |-
      quotient of the spectral responsivity, stem:[s](stem:[lambda]), of the detector at wavelength, stem:[lambda], and a specified reference value, stem:[s_m]

      stem:[s_r ( lambda ) = ((s ( lambda )))/((s_m))]
    type: intensional
  examples: []
  notes:
  - content: The specified reference value, stem:[s_m], can be an average value, a
      maximum value or an arbitrarily chosen value of stem:[s](stem:[lambda]).
    type: intensional
  - content: The relative spectral responsivity has unit one.
    type: intensional
  - content: This entry was numbered {{bib:845-05-57, 845-05-57}} in IEC 60050-845:1987.
    type: intensional
