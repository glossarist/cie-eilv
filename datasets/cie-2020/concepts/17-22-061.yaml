data:
  definition:
  - content: pertaining to high levels of brightness
    type: intensional
  examples: []
  notes:
  - content: 'The adjectives "{{17-22-061, bright}}" and "{{17-22-064, light}}" principally
      have the same meaning, but usually have different applications: lights are described
      as "bright" or "dim", whereas surface colours are described as "light" or "dark".
      However, this distinction is not universal.'
    type: intensional
