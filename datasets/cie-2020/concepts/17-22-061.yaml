data:
  definition:
  - content: pertaining to high levels of {{17-22-059, brightness}}
    type: intensional
  examples: []
  notes:
  - content: 'The adjectives "{{17-22-061, bright}}" and "{{17-22-064, light}}" principally
      have the same meaning, but usually have different applications: lights are described
      as "bright" or "{{17-22-062, dim}}", whereas {{17-22-043, surface colour}}s
      are described as "{{17-22-064, light}}" or "{{17-22-065, dark}}". However, this
      distinction is not universal.'
    type: intensional
