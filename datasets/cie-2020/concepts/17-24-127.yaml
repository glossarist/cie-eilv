data:
  definition:
  - content: cloudy {{17-22-019, appearance}} due to {{17-22-089, contrast}} reduction,
      usually attributable to light {{17-24-049, scattering}}
    type: intensional
  examples: []
  notes:
  - content: |-
      Correlated measures in {{17-24-047, reflection}} are:
      a) {{17-24-049, scattering}} of light at the glossy surface of a specimen responsible for the apparent reduction in {{17-22-089, contrast}} of objects viewed by {{17-24-047, reflection}} at the surface;
      b) percentage of reflected light scattered by a specimen having a glossy surface so that its direction deviates more than a specified angle from the direction of {{17-24-052, regular reflection}}.
    type: intensional
  - content: |-
      Correlated measures in {{17-24-048, transmission}} are:
      a) {{17-24-049, scattering}} of light by a specimen responsible for the apparent reduction in {{17-22-089, contrast}} of objects viewed through it;
      b) percentage of transmitted light that is scattered so that its direction deviates more than a specified angle from the direction of the incident beam.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: haze
  language_code: eng
  annotations: []
