data:
  definition:
  - content: "{17-21-002, optical radiation} for which the {17-21-025, wavelength}s
      are longer than those for {17-21-003, visible radiation}"
    type: intensional
  examples: []
  notes:
  - content: |-
      For infrared radiation, the range between 780 nm and 1 mm is commonly subdivided into:
      {17-21-005, IR-A}: 780 nm to 1 400 nm, or 0,78 μm to 1,4 μm;
      {17-21-006, IR-B}: 1,4 μm to 3,0 μm;
      {17-21-007, IR-C}: 3 μm to 1 mm.
    type: intensional
  - content: A precise border between visible radiation and infrared radiation cannot
      be defined because {17-22-083, visual sensation} at {17-21-025, wavelength}s
      greater than 780 nm can be experienced.
    type: intensional
  - content: In some applications the infrared spectrum has also been divided into
      "near", "middle", and "far" infrared; however, the borders necessarily vary
      with the application.
    type: intensional
  - content: This entry was numbered 845-01-04 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-580 and 17-610 in CIE S 017:2011.
    type: intensional
