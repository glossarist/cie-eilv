data:
  definition:
  - content: energy emitted, transferred or received in form of electromagnetic waves
    type: intensional
  examples: []
  notes:
  - content: |-
      Radiant energy can be expressed by the time integral of {{17-21-038, radiant flux}}, <i>Φ</i><sub>e</sub>, over a given duration, Δ<i>t</i>:<i>


      </i><sub>.</sub>
    type: intensional
  - content: Radiant energy is expressed as a function of {{17-21-025, wavelength}},
      <i>λ</i>, as a function of frequency, <i>ν</i>, or as a function of {{17-21-026,
      wavenumber}}, <i>σ</i>.
    type: intensional
  - content: The corresponding photometric quantity is "{{17-21-037, luminous energy}}".
      The corresponding quantity for photons is "{{17-21-042, photon energy}}".
    type: intensional
  - content: The radiant energy is expressed in joule (J = W·s).
    type: intensional
  - content: This entry was numbered 845-01-27 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1019 in CIE S 017:2011.
    type: intensional
