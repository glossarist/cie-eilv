data:
  definition:
  - content: medium in which the transmission is mainly regular and which usually
      has a high regular transmittance in the spectral range of interest
    type: intensional
  examples: []
  notes:
  - content: Objects can be seen distinctly through a medium which is transparent
      in the visible region, if the geometric form of the medium is suitable.
    type: intensional
