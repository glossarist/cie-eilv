data:
  definition:
  - content: ideal observer having a relative spectral responsivity curve that conforms to the {{concept:cie-2020:17-21-035, spectral luminous efficiency}} function for photopic vision, stem:[V](stem:[lambda]), or to the function for scotopic vision, stem:[V]'(stem:[lambda]), and that complies with the summation law implied in the definition of luminous flux
