data:
  definition:
  - content: where <i>Φ</i><sub>e</sub> is the {{17-21-038, radiant flux}} of a collimated
      beam entering the upper limit layers of the atmosphere at an angle <i>ε</i>
      to the vertical, and is the attenuated {{17-21-038, radiant flux}} of that beam
      reaching the surface of the Earth
    type: intensional
  examples: []
  notes:
  - content: See also "{{17-24-087, spectral optical thickness}}".
    type: intensional
  - content: The optical thickness has unit one.
    type: intensional
  - content: This entry was numbered 845-09-86 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-850 and 17-844 in CIE S 017:2011.
