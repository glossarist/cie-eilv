data:
  definition:
  - content: colour stimulus having the same chromaticity as the {{17-32-058, adopted
      white}}
    type: intensional
  examples: []
  notes:
  - content: When stating that an image area is a colorimetric neutral, it is necessary
      to designate the adopted white. For reflection {{17-32-045, hardcopies}}, the
      adopted white is typically considered to be either the media white or a perfectly
      diffuse reflecting surface illuminated by the light source.
    type: intensional
  - content: The adopted white of colorimetric neutral can or cannot correspond to
      the {{17-23-081, adapted white}} according to an observer.
    type: intensional
  - content: This entry was numbered 17-194 in CIE S 017:2011.
    type: intensional
