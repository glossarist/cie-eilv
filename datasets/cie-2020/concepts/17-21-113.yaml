data:
  definition:
  - content: ratio of the luminous output of a source evaluated according to the CIE scotopic {{concept:cie-2020:17-21-035, spectral luminous efficiency}}, stem:[V'](stem:[lambda]), to the luminous output evaluated according to the CIE photopic spectral luminous efficiency, stem:[V](stem:[lambda])
    type: intensional
  examples: []
  notes:
  - content: 'The S/P ratio can be expressed by


      stem:[R_(SP) = (K_m^'' int_0^oo S(lambda) V''(lambda) "d"lambda)/(K_m int_0^oo S(lambda)V(lambda) "d"lambda)]


      where stem:[K_m^'']''~stem:[m]~ ~~ 1 700 stem:[lm cdot W]^(-1) stem:[is] stem:[the] stem:[maximum] stem:[luminous] stem:[efficacy] stem:[for] stem:[scotopic] stem:[vision],stem:[K_m]~~ 683 stem:[lm cdot W]^(-1) stem:[is] stem:[the] stem:[maximum] stem:[luminous] stem:[efficacy] stem:[for] stem:[photopic] stem:[vision],stem:[S](stem:[lambda]) is the {{concept:cie-2020:17-21-030, relative spectral distribution}} of the source, and stem:[lambda] is the wavelength.'
    type: intensional
  - content: The S/P ratio has unit one.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: S/P ratio
  - type: abbreviation
    normative_status: preferred
    designation: RSP
