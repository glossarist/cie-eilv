data:
  definition:
  - content: law stating that {17-26-034, effective dose}s can be added to a total
      {17-26-034, effective dose}, even if the {17-26-064, dose response curve}s for
      different wavebands are different
    type: intensional
  examples: []
  notes:
  - content: This means at the same time that no conductive (i.e. catalytic) or hindering
      (i.e. antagonistic) effects occur.
    type: intensional
  - content: This entry was numbered 17-25 in CIE S 017:2011.
    type: intensional
