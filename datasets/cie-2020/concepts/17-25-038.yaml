data:
  definition:
  - content: "{17-25-035, detector} of {17-21-002, optical radiation} which utilizes
      the interaction between radiation and matter resulting in the {17-24-081, absorption}
      of {17-21-107, photon}s and the consequent liberation of electrons from their
      states, thereby generating an electric potential or current, or causing a change
      in electrical resistance, but excluding electrical phenomena caused by temperature
      changes"
    type: intensional
