data:
  definition:
  - content: radiation in which the electric field vector is of constant amplitude and rotates about the direction of propagation at a rate equal to the radiation frequency
    type: intensional
  examples: []
  notes:
  - content: Circularly polarized radiation is described as right-handed (or left-handed) if the rotation of the electric field vector is clockwise (or anticlockwise) as viewed by an observer receiving the radiation.
    type: intensional
  - content: This entry was numbered {{cite:cie-2011:17-177, 17-177}} in CIE S 017:2011.
    type: intensional
