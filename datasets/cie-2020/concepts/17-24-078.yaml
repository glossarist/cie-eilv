data:
  definition:
  - content: |-
      quotient of the {{17-21-049, radiance}} at a surface element of a medium in a given direction and the {{17-21-053, irradiance}} on the medium

      stem:[q_e = ((L_e))/((E_e))]

      where stem:[L_e] is radiance and stem:[E_e] is irradiance
    type: intensional
  examples: []
  notes:
  - content: The bi-directional reflectance distribution function (BRDF) is similar
      to the radiance coefficient except that it is defined for directional incident
      radiation.
    type: intensional
  - content: The radiance coefficient is expressed in steradian to the power minus
      one (sr^−1^).
    type: intensional
  - content: This entry was numbered {{cite:845-04-70, 845-04-70}} in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1013 in CIE S 017:2011.
    type: intensional
