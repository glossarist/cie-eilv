data:
  definition:
  - content: quotient of the {17-21-049, radiance} per unit emission bandpass, d<i>λ</i>,
      at a specified emission {17-21-025, wavelength}, <i>λ</i>, due to {17-24-022,
      photoluminescence} from the specimen when irradiated at a specified {17-24-020,
      excitation} wavelength, <i>μ</i>, and the {17-21-049, radiance} of the {17-24-060,
      perfect reflecting diffuser} identically irradiated and viewed
    type: intensional
  examples: []
  notes:
  - content: Spectral quantities with a subscript <i>λ</i> in their designation indicate
      differential spectral radiometric quantities.
    type: intensional
  - content: When integrated or summed over the spectral bandpass of the instrument,
      this quantity becomes the bandpass-weighted bispectral luminescent radiance
      factor, <i>β</i><sub>L,</sub><i><sub>λ</sub></i>(<i>μ</i>) Δ<i>λ</i>.
    type: intensional
  - content: The complete tabular form of bispectral luminescent radiance factor and
      {17-21-104, reflected radiance factor} data is the Donaldson matrix representation
      of bispectral radiance factor, <i>D</i>(<i>μ</i>, <i>λ</i>). The {17-24-020,
      excitation} wavelengths, <i>μ</i>, are tabulated in the vertical direction,
      the emission {17-21-025, wavelength}s, <i>λ</i>, in the horizontal direction,
      the {17-21-104, reflected radiance factor}s, <i>β</i><sub>R</sub>(<i>λ</i>),
      appear on the diagonal where the {17-24-020, excitation} and emission (detection)
      {17-21-025, wavelength}s are equal, and the array of bandpass-weighted bispectral
      luminescent radiance factor data, <i>β</i><sub>L,</sub><i><sub>λ</sub></i>(<i>μ</i>)
      Δ<i>λ</i>, appear on the off-diagonals.
    type: intensional
  - content: The bispectral luminescent radiance factor is expressed in nanometre
      to the power minus one (nm<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 17-91 in CIE S 017:2011.
    type: intensional
