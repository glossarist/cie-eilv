data:
  definition:
  - content: radiation characterized by a single <<103-06-02, frequency>> or a single
      wavelength
    type: intensional
  examples: []
  notes:
  - content: If the wavelength is used to characterize a monochromatic radiation,
      the medium has to be stated.
    type: intensional
  - content: In practice, monochromatic radiation is radiation of a very small range
      of frequencies or wavelengths that can be described by stating a single frequency
      or wavelength.
    type: intensional
  - content: This entry was numbered 845-01-07 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-788 in CIE S 017:2011.
    type: intensional
