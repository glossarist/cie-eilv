data:
  definition:
  - content: |-
      quotient of the luminance, stem:[L], of a plane retroreflective surface in the direction of observation and the illuminance, stem:[E_( _|_ )], at the retroreflector on a plane perpendicular to the direction of the incident light

      stem:[R_L = (L)/((E_( _|_ )))]
    type: intensional
  examples: []
  notes:
  - content: The coefficient of retroreflected luminance is particularly suitable
      for describing materials in sheet form.
    type: intensional
  - content: The coefficient of retroreflected luminance is expressed in candela per
      square metre per lux (cd·m^−2^·lx^−1^).
    type: intensional
  - content: This entry was numbered {{cite:845-04-98, 845-04-98}} in IEC 60050-845:1987.
    type: intensional
