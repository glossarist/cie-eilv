data:
  definition:
  - content: quotient of the {17-21-050, luminance}, <i>L</i>, of a plane retroreflective
      surface in the direction of observation and the {17-21-060, illuminance}, <i>E</i><sub>⊥</sub>,
      at the {17-24-100, retroreflector} on a plane perpendicular to the direction
      of the incident light
    type: intensional
  examples: []
  notes:
  - content: The coefficient of retroreflected luminance is particularly suitable
      for describing materials in sheet form.
    type: intensional
  - content: The coefficient of retroreflected luminance is expressed in candela per
      square metre per lux (cd⋅m<sup>−2</sup>⋅lx<sup>−1</sup>).
    type: intensional
  - content: This entry was numbered 845-04-98 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-181 in CIE S 017:2011.
    type: intensional
