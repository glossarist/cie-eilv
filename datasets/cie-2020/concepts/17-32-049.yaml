data:
  definition:
  - content: colour space encoding used to connect the source and destination transforms
      (from the source and destination profiles) in the International Color Consortium
      (ICC) colour management architecture
    type: intensional
  examples: []
  notes:
  - content: 'The ICC.1:2001 specification defines two variations of the profile connection
      space (PCS): a general profile connection space for colorimetric intent transforms,
      and an output-referred profile connection space for perceptual intent transforms.'
    type: intensional
  - content: This entry was numbered 17-546 and 17-545 in CIE S 017:2011.
    type: intensional
