data:
  definition:
  - content: LED light source having either at least one PCB cap or no cap, and incorporating
      at least one LED package
    type: intensional
  examples: []
  notes:
  - content: An LED module can be an {{17-27-059, integrated LED module}} (LEDi module),
      a {{17-27-060, semi-integrated LED module}} (LEDsi module) (IEV) or a {{17-27-061,
      non-integrated LED module}} (LEDni module).
    type: intensional
  - content: An LED module is usually designed to be part of an LED lamp or an LED
      luminaire.
    type: intensional
  - content: 'An LED module can include one or more of the following: electric, optical,
      mechanical, and thermal components, interfaces and control gear.'
    type: intensional
