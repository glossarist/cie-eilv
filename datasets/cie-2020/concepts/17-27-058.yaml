data:
  definition:
  - content: "{17-27-053, LED light source} having either at least one {17-28-021,
      printed circuit board cap} or no {17-28-015, cap}, and incorporating at least
      one {17-27-065, LED package}"
    type: intensional
  examples: []
  notes:
  - content: An LED module can be an {17-27-059, integrated LED module} (LEDi module),
      a {17-27-060, semi-integrated LED module} (LEDsi module) or a {17-27-061, non-integrated
      LED module} (LEDni module).
    type: intensional
  - content: An LED module is usually designed to be part of an {17-27-054, LED lamp}
      or an {17-30-056, LED luminaire}.
    type: intensional
  - content: 'An LED module can include one or more of the following: electric, optical,
      mechanical, and thermal components, interfaces and {17-28-048, control gear}.'
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2020
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: LED module
  language_code: eng
