data:
  definition:
  - content: |-
      unwanted light that forms part of the measurement



      Light that reaches the detector which is at a wavelength other than the wavelength intended to be measured.
    type: intensional
  examples: []
  notes:
  - content: |-
      Light that reaches the {{concept:cie-2020:17-25-035, detector}} from directions other than the desired path from the {{concept:cie-2020:17-21-032, source}} to the {{concept:cie-2020:17-25-035, detector}}, e.g. light scattered from walls, ceilings or optical components within the measuring system.
      Light that reaches the {{concept:cie-2020:17-25-035, detector}} which is at a {{concept:cie-2020:17-21-025, wavelength}} other than the {{concept:cie-2020:17-21-025, wavelength}} intended to be measured.
    type: intensional
  - content: This entry was numbered 17-1273 in CIE S 017:2011.
    type: intensional
