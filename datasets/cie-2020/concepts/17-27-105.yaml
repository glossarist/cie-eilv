data:
  definition:
  - content: termination of the ability of an item to perform a required function
  notes:
  - content: After the failure the item is in fault condition.
  - content: A failure is an event, as distinguished from a fault, which is a state.
  - content: This concept as defined does not apply to items consisting of software
      only.
