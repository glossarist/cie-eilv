data:
  definition:
  - content: conversion of {{17-21-041, radiant energy}} to energy in chemical bonds
    type: intensional
  examples: []
  notes:
  - content: Photosynthesis in plants is well known and involves assimilation of carbon
      dioxide into simple sugars. The energy from {{17-29-103, sunlight}} or artificial
      light (principally in the {{17-21-025, wavelength}} range 400 nm to 700 nm),
      is converted into chemical bond energy in the sugars. Photosynthesis in the
      skin occurs when 7-dehydrocholesterol in the skin absorbs UV‑B {{17-29-096,
      solar radiation}} and is converted to previtamin D3.
    type: intensional
  - content: This entry was numbered 17-942 in CIE S 017:2011.
    type: intensional
