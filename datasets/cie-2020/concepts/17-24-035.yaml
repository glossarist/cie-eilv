data:
  definition:
  - content: quotient of the {17-21-040, photon flux} of the radiation emitted by
      a {17-24-040, photoluminescent material} and the {17-21-040, photon flux} of
      the exciting radiation absorbed by that material
    type: intensional
  examples: []
  notes:
  - content: See also "{17-25-075, external photoluminescence quantum yield}".
    type: intensional
  - content: The photoluminescence quantum yield has unit one.
    type: intensional
