data:
  definition:
  - content: quotient of the photon flux of the radiation emitted by a {{concept:cie-2020:17-24-040, photoluminescent material}} and the photon flux of the exciting radiation absorbed by that material
    type: intensional
  examples: []
  notes:
  - content: See also "{{concept:cie-2020:17-25-075, external photoluminescence quantum yield}}".
    type: intensional
  - content: The photoluminescence quantum yield has unit one.
    type: intensional
  - content: This entry was numbered {{cite:IEV:845-04-32, 845-04-32}} in IEC 60050-845:1987.
    type: intensional
