data:
  definition:
  - content: modification of the visual response that occurs when two colour stimuli
      (of any spectral irradiance distribution) are viewed side-by-side, where each
      stimulus affects the appearance of the other
    type: intensional
  examples: []
  notes:
  - content: It is often referred to as simultaneous or spatial contrast because the
      effect is one of enhancement of colour difference.
    type: intensional
  - content: The effect is virtually instantaneous, in contrast to chromatic adaptation
      which is considered to develop slowly in the visual system.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
