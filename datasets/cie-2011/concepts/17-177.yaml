data:
  definition:
  - content: radiation in which the electric field vector is of constant amplitude
      and rotates about the direction of propagation at a rate equal to the radiation
      frequency
    type: intensional
  examples: []
  notes:
  - content: Circularly polarized radiation is described as right-handed (left-handed)
      if the rotation of the E-vector is clockwise (anti-clockwise) as viewed by an
      observer receiving the radiation.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: circularly polarized radiation
  language_code: eng
  annotations: []
