data:
  definition:
  - content: measure of disability glare expressed as the percentage increase in luminance
      contrast threshold required between an object and its background for it to be
      seen equally well with a source of glare present
    type: intensional
  examples: []
  notes:
  - content: Increasing values of threshold increment correspond to increasing disability
      glare.
