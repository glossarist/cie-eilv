data:
  definition:
  - content: luminance coefficient multiplied by the cube of the cosine of the angle
      of incidence of the light on a point on a surface
    type: intensional
  examples: []
  notes:
  - content: |-
      This can be expressed by the equation
      <i>r</i>= <i>q</i> (cos<i>ε</i>)<sup>3</sup>
      where
      <i>q</i> is the luminance coefficient in sr<sup>-1</sup>;
      <i>ε</i> is the angle of incidence in °.
    type: intensional
  - content: The angle of observation, <i>α</i>, affects the value of <i>r</i>. By
      convention this angle is fixed at 1° for road lighting calculations.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: reduced luminance coefficient (for a point on a surface)
  - type: symbol
    normative_status: preferred
    designation: r
  - type: symbol
    normative_status: preferred
    designation: "<i>r</i>"
