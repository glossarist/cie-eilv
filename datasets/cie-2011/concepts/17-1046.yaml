data:
  definition:
  - content: luminance coefficient multiplied by the cube of the cosine of the angle of incidence of the light on a point on a surface
    type: intensional
  examples: []
  notes:
  - content: 'This can be expressed by the equation

      stem:[r]= stem:[q] (cosstem:[epsilon])stem:[^{3}]

      stem:[where]

      stem:[q] stem:[is] stem:[the] stem:[luminance] stem:[coefficient] stem:[in] stem:[sr^(-1)];

      stem:[epsilon] is the angle of incidence in stem:[deg].'
    type: intensional
  - content: The angle of observation, stem:[alpha], affects the value of stem:[r]. By convention this angle is fixed at 1stem:[deg] for road lighting calculations.
    type: intensional
  sources:
