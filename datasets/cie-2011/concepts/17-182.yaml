data:
  definition:
  - content: 'quotient of the coefficient of luminous intensity, stem:[R_A = R/A = (I//E_(_|_))/A], of a plane retroreflective surface and its area, stem:[A]


      stem:[R_A = (R)/(A) = ((I // E_{ _|_ }))/(A)]


      where stem:[I] is the luminous intensity of the retroreflector in the direction of observation, and stem:[E_{ _|_ }] is the illuminance at the retroreflector on a plane perpendicular to the direction of the incident light'
    type: intensional
  examples: []
  notes:
  - content: This quantity is particularly suitable for describing materials in sheet form.
    type: intensional
  - content: Formerly the symbol stem:[R]' was used for this quantity.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
