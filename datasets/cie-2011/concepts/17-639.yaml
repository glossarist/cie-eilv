data:
  definition:
  - content: device that holds the electric lamp in position, usually by having the
      cap inserted in it, in which case it also provides the means of connecting the
      electric lamp to the power supply
    type: intensional
  examples: []
  notes:
  - content: The term "socket" or, when the context is clear, the abbreviation "holder"
      are commonly used instead of "lampholder".
    type: intensional
  - content: See NOTE 2 to "{{17-119, cap}}" and to "{{17-76, base (US)}}".
    type: intensional
