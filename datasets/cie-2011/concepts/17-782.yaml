data:
  definition:
  - content: actinic dose, using the erythema spectral weighting function, that produces
      a just noticeable actinic erythema on a single individual's previously unexposed
      skin
    type: intensional
  examples: []
  notes:
  - content: |-
      This is a subjective measure based on the reddening of the skin; it depends on many variables, e.g. individual sensitivity to UVR, radiometric characteristics of the source, skin pigmentation, anatomic site, elapsed time between irradiation and observing the reddening (typical value: 24 h), etc. Since it varies with each individual, it should be reserved solely for observational studies in humans and other animals.
      See also “{{17-1255, standard erythema dose}}”
      Abbreviation: “MED”
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: minimal erythema dose
  - type: abbreviation
    normative_status: preferred
    designation: MED
  language_code: eng
