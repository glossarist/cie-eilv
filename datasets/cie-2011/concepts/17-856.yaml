data:
  definition:
  - content: physical quantity yielded by a detector in response to an optical input
    type: intensional
  examples: []
  notes:
  - content: This quantity, usually electrical, may for example be current, voltage
      or a change in resistance; the output may also be chemical, as in a photographic
      film or an actinometer, or mechanical as in a Golay detector.
    type: intensional
