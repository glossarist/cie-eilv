data:
  definition:
  - content: display that incorporates a practically flat surface, and is generally
      much thinner than its diagonal, for the presentation of visual information and
      whose surface contains an active area consisting of a regular array of electrically
      alterable, discrete picture elements (pixels) in rows and columns
