data:
  definition:
  - content: retinal injury caused by brief, intense radiant exposure of the retina
      from wavelengths in the retinal hazard spectral region (380 nm to 1 400 nm)
      within which the normal ocular media transmit optical radiation to the retina
    type: intensional
  examples: []
  notes:
  - content: In IEC62471:2006/CIES009:2002 stem:[Photobiological safety of lamp and
      lamp systems]the maximum assessment time is taken as 10 s.
    type: intensional
  - content: In some cases a blue light photoretinitis is also termed a "retinal burn".
    type: intensional
