data:
  definition:
  - content: colour stimulus having the same chromaticity as the adopted white
    type: intensional
  examples: []
  notes:
  - content: When stating that an image area is a colorimetric neutral, it is necessary
      to designate the adopted white. For reflection hardcopy images, the adopted
      white is typically considered to be either the media white or a perfectly diffuse
      reflecting surface illuminated by the illumination source.
    type: intensional
  - content: The adopted white of colorimetric neutral may or may not correspond to
      the adapted white according to an observer.
    type: intensional
