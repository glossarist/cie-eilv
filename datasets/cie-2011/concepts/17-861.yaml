data:
  definition:
  - content: type of preheating of the electrodes of a discharge lamp in which the
      electrodes are fed by separate circuits
    type: intensional
  examples: []
  notes:
  - content: Each electrode is usually connected across a low voltage winding which
      may be part of the ballast and provides the preheating current. In certain circuits,
      this low voltage is automatically decreased after the arc has struck.
    type: intensional
  sources:
  - origin:
