data:
  definition:
  - content: perceived colour possessing hue
    type: intensional
  examples: []
  notes:
  - content: |-
      In everyday speech, the word colour is often used in this sense in contradistinction to white, grey or black. The adjective coloured usually refers to chromatic colour.
      2. in the psychophysical sense: see "{{concept:cie-2011:17-143, chromatic stimulus}}"
