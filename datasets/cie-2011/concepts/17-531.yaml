data:
  definition:
  - content: change in brightness of perceived colour, produced by increasing the
      purity of a colour stimulus while keeping its luminance constant within the
      range of photopic vision
    type: intensional
  examples: []
  notes:
  - content: For related perceived colours, a change in lightness can also occur when
      the purity is increased while keeping the luminance factor of the colour stimulus
      constant.
    type: intensional
