  definition:
  - content: irradiation of the skin or other tissues, typically with ultraviolet
      radiation, in the treatment of diseases (e.g. psoriasis)
    type: intensional
  examples: []
  notes:
  - content: The term "photodynamic therapy" has been used where special photo-sensitising
