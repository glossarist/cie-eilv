data:
  definition:
  - content: '1. lamp that delivers its energy in the form of a single pulse or a train of pulses where each pulse is assumed to have a duration of less than 0,25 s


      2. lamp with a continuous train of pulses or modulated radiant energy where the peak radiated power is at least 10 times the average radiated power'
    type: intensional
  examples: []
  notes:
  - content: The duration of a lamp pulse is the time interval between the half-peak-power points on the leading and the trailing edges of the pulse.
    type: intensional
  - content: In IEC62471:2006/CIES009:2002 stem:[Photobiological safety of lamp and lamp systems], general lighting service lamps are defined to be continuous wave lamps. Examples of pulsed lamps include photoflash lamps, flash lamps in photocopy machines, pulse-modulated LEDs, and strobe lights.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
