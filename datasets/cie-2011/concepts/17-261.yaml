data:
  definition:
  - content: lighting design technique where the light falls on objects from a direction
      opposite to that of the traffic
    type: intensional
  examples: []
  notes:
  - content: |-
      Counter-beam lighting is characterized by using luminaires that show a luminous intensity distribution that is asymmetric in relation to the plane normal to the direction of the traffic, where the maximum luminous intensity is aimed against the direction of the traffic. The term refers only to the direction of normal travel.
      See also "{{17-986, pro-beam lighting (in a tunnel)}}", "{{17-1293, symmetric lighting (in a tunnel)}}"
      Abbreviation: "CBL"
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
