data:
  definition:
  - content: luminous intensity of a source that has a constant output, of the same
      relative spectral distribution as the flashing light, which would have the same
      luminous range (or visual range in aviation terminology) as the flashing light
      under identical conditions of observation
    type: intensional
  examples: []
  notes:
  - content: For practical purposes, a conventional effective intensity may be evaluated
      for a flashing light from photometric data by an agreed method.
    type: intensional
