data:
  definition:
  - content: quotient of the vertical optical thickness of a real turbid atmosphere
      and the vertical optical thickness of the pure and dry atmosphere (Rayleigh
      atmosphere), related to the visible part of the solar spectrum
    type: intensional
  examples: []
  notes:
  - content: |-
      The luminous turbidity factor can be expressed by

      stem:[T_v = ((- ln ( E_((vs)) // E_v )))/((a_v m))]

      where stem:[E_(vs)] is the direct-beam illuminance on a horizontal surface (at the ground), stem:[E_v] is the extraterrestrial horizontal illuminance, stem:[a_v] is the luminous extinction coefficient, and stem:[m] is the relative optical air mass.
    type: intensional
  - content: The luminous turbidity factor has unit one.
    type: intensional
  - content: This entry was numbered 17-743 in CIE S 017:2011.
    type: intensional
