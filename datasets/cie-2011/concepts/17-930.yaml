data:
  definition:
  - content: 'quotient of radiant energy and photon energy


      stem:[N_p = ((Q_e))/((h nu))]


      where stem:[Q_e] is radiant energy, stem:[h] is the Planck constant, and stem:[nu] is the frequency of the corresponding electromagnetic wave'
