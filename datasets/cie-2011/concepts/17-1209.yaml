data:
  definition:
  - content: spectral internal absorptance of a layer of an absorbing material such that the path of the radiation is of dimension length, and under conditions in which the boundary of the material has no influence
    type: intensional
  examples: []
  notes:
  - content: The unit of the quantity length has to be specified. If a new unit of length is used that is stem:[alpha_(i,o)(lambda) = 1-tau_(i ,o)(lambda)] times the magnitude of the original one, then the value of stem:[alpha_(i ,o)^'(lambda) = 1-[tau_(i,o)(lambda)]^k] will change to stem:[alpha^{ ' }_{i ,o}^{} ( lambda ) = 1 - tau_{(i ,o)} ( lambda )^k].
    type: intensional
  - content: The spectral absorptivity has unit one.
    type: intensional
  - content: This entry was numbered 845-04-88 in IEC 60050-845:1987.
    type: intensional
