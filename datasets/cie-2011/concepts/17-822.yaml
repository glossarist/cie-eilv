data:
  definition:
  - content: detector of optical radiation whose quantum efficiency is independent
      of wavelength over the spectral range considered
    type: intensional
  examples: []
  notes:
  - content: It should be stated whether the external or internal quantum efficiency
      is being considered. If not explicitly stated, it shall be taken as the external
      quantum efficiency.
    type: intensional
  - content: A photoluminescent material having a photoluminescence yield independent
      of the wavelength of the exciting radiation over a wide spectral range is sometimes
      called a "quantum counter".
    type: intensional
