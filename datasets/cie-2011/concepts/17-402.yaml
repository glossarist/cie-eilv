data:
  definition:
  - content: |-
      time integral of erythemal irradiance

      stem:[H_((er)) = int int E_(lambda) ( lambda , t ) s_((er)) ( lambda ) d lambda d t]

      where stem:[Elambda](stem:[lambda], stem:[t]) is spectral irradiance and stem:[s_(er)](stem:[lambda]) is the erythema spectral weighting function normalized to 1 at its maximum
    type: intensional
  examples: []
  notes:
  - content: This definition implies that an action spectrum is adopted for the actinic
      effect considered, and that its maximum value is 1. When giving a quantitative
      amount, it is essential to specify according to which actinic action spectrum
      the dose is meant, as the unit is the same.
    type: intensional
