data:
  definition:
  - content: |-
      value of the initial luminous flux of a given type of lamp declared by the manufacturer or the responsible vendor, the lamp being operated under specified conditions

      Unit: lm
    type: intensional
  examples: []
  notes:
  - content: The initial luminous flux is the luminous flux of a lamp after a short
      ageing period as specified in the relevant lamp standard.
    type: intensional
  - content: The rated luminous flux is sometimes marked on the lamp.
    type: intensional
  - content: In French, formerly "flux lumineux nominal".
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: rated luminous flux (of a type of lamp)
  language_code: eng
  annotations: []
