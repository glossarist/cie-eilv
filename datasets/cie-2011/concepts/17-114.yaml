data:
  definition:
  - content: law stating that the total radiant exposure required to elicit a given
      photobiological or photochemical response is independent of the duration over
      which the exposure occurs
    type: intensional
  examples: []
  notes:
  - content: This relationship generally holds only over a given limited range of
      exposure durations. Reciprocity failure can occur due to repair mechanisms,
      recombination effects over long periods, or photon saturation for extremely
      short periods.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
