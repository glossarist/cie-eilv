data:
  definition:
  - content: function representing the relative spectral sensitivity of the human eye to blue light hazards, based upon the relative spectral effectiveness of optical radiation to induce retinal photochemical injury (e.g. photic maculopathy)
    type: intensional
  examples: []
  notes:
  - content: Specified in ICNIRP-recommendations for stem:[λ]stem:[]= 300 nm to 700 nm.
    type: intensional
  sources:
