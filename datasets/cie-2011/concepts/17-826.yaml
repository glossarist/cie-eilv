data:
  definition:
  - content: irradiance produced by direct sunlight on a surface on the Earth that is perpendicular to the direction of irradiation by the Sun
    type: intensional
  examples: []
  notes:
  - content: This is not the same as direct solar irradiance, which is measured on a horizontal surface on the Earth, not necessarily perpendicular to the direction of irradiation by the Sun.
    type: intensional
