data:
  definition:
  - content: set of 15 sky luminance distributions which model the sky from heavily
      overcast sky to cloudless sky
    type: intensional
  examples: []
  notes:
  - content: The relative luminance distributions are described in ISO 15469:2004/CIE
      S 011:2003 stem:[Spatial distribution of daylight – CIE standard general sky].
      The CIE standard clear sky is incorporated as a particular case, and the CIE
      standard overcast sky is added as a separate formula.
    type: intensional
