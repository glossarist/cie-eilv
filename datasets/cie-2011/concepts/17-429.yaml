data:
  definition:
  - content: solid angle as "seen" by the detector (acceptance angle), e.g. of a radiometer or spectroradiometer, out of which the detector receives radiation
    type: intensional
  examples: []
  notes:
  - content: The field of view should not be confused with the angular subtense of the apparent source, stem:[alpha].
    type: intensional
  - content: A plane angle is sometimes used to describe a circular symmetric solid angle field of view.
    type: intensional
