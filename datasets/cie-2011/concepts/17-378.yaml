data:
  definition:
  - content: quotient of the emergency luminous flux of the electric lamp supplied
      by the emergency ballast and the luminous flux of the same electric lamp operated
      with the appropriate reference ballast at its rated voltage and frequency
    type: intensional
  examples: []
  notes:
  - content: The emergency ballast lumen factor is the minimum of the values measured
      at the appropriate time after failure of the normal supply and continuously
      to the end of the rated time duration.
    type: intensional
