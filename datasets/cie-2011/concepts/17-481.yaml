data:
  definition:
  - content: |-
      lamp in which the light is produced, directly or indirectly, by an electric discharge through a gas, a metal vapour, or a mixture of several gases and vapours

      Equivalent term: "gaseous discharge lamp"
    type: intensional
  examples: []
  notes:
  - content: According to whether the light is mainly produced in a gas or in a metal
      vapour, one distinguishes between gas discharge lamps, for example xenon, neon,
      helium, nitrogen, carbon dioxide lamp, and metal vapour lamps, for example the
      mercury vapour lamp and the sodium vapour lamp.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: gas discharge lamp
  - type: expression
    normative_status: admitted
    designation: gaseous discharge lamp
  language_code: eng
  annotations: []
