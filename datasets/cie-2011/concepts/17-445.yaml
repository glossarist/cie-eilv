data:
  definition:
  - content: visual photometer in which the observer sees either an undivided field
      illuminated successively, or two adjacent fields illuminated alternately, by
      two sources to be compared, the {{cite:103-06-02, frequency}} of alteration
      being conveniently chosen so that it is above the critical flicker {{cite:103-06-02,
      frequency}} for colours but below the fusion frequency for brightness
    type: intensional
