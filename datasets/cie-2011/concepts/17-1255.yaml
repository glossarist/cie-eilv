data:
  definition:
  - content: standardized unit of measure of erythemal radiation
    type: intensional
  examples: []
  notes:
  - content: |-
      standard erythema dose (SED) is equivalent to an erythemal radiant exposure of 100 J·m<sup>-2</sup>.
      See also “{{17-782, minimal erythema dose}}”
      See also ISO 17166:1999(E)/CIE S 007/E-1998 <i>Erythema Reference Action Spectrum and Standard Erythema Dose</i>
      Abbreviation: “SED”
