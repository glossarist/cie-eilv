data:
  definition:
  - content: characteristic of all sensations and perceptions that is specific to
      the visual system
    type: intensional
  examples: []
  notes:
  - content: This term has 2 meanings that should be clearly distinguished. When necessary
      to avoid confusion between these 2 meanings the term "perceived light" may be
      used in the first sense.
    type: intensional
  - content: Light is normally, but not always, perceived as a result of the action
      of a light stimulus on the visual system.
    type: intensional
