data:
  definition:
  - content: degree of colour mismatch, calculated in the form of a colour difference,
      caused by substituting a test illuminant (observer) of different relative spectral
      composition (responsivity) for the reference illuminant (observer)
    type: intensional
  examples: []
  notes:
  - content: The colour difference is evaluated using a CIE colour difference formula
      and it must be clearly stated which formula has been used.
    type: intensional
