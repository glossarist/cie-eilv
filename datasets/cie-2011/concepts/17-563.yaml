data:
  definition:
  - content: attribute of a colour image encoding indicating the kind of image condition
      inherent in colour image data values prepared and represented in that encoding
    type: intensional
  examples: []
  notes:
  - content: Colour image data is "referred" to a particular image condition through
      image capture, digitization, colour rendering and colour re-rendering processes.
    type: intensional
  - content: Typical image states are scene-referred, original referred, output referred
      and picture referred.
    type: intensional
