data:
  definition:
  - content: |-
      complex value where the real part is the refractive index and the imaginary part is related to the spectral absorption index

      stem:[hat n ( lambda ) = n ( lambda ) - i kappa ( lambda )]

      where where stem:[n](stem:[lambda]) is the refractive index at wavelength stem:[lambda], stem:[kappa](stem:[lambda]) is the spectral absorption index and stem:[i = sqrt(- 1)]
    type: intensional
