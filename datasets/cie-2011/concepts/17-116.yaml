data:
  definition:
  - content: coordinate system commonly used in the photometry of luminaires in which the C-planes are half-planes that rotate round the vertical line through the photometric centre of the luminaire, and the stem:[gamma]-angles are measured up to 180° from the direction of the perpendicular to the rotation axis of the C-planes
    type: intensional
  examples: []
  notes:
  - content: Other coordinate systems (stem:[A], stem:[α]) and (stem:[B], stem:[β]) exist as well. See CIE 121-1996.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: <i>C</i>, <i>γ</i> coordinate system
  language_code: eng
