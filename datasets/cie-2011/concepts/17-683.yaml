data:
  definition:
  - content: detector for which the output is proportional to the input over a specified
      range, so that the responsivity of the detector is constant over that range
    type: intensional
  examples: []
  notes:
  - content: A detector is usually linear only over a certain limited range of input
      levels. The range should be specified.
    type: intensional
  - content: The linear range of a detector may be affected by the use of unsuitable
      electronic circuitry.
    type: intensional
