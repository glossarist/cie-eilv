data:
  definition:
  - content: |-
      1. road reserved for motor traffic, accessible only from interchanges and on which, in particular, stopping and parking are prohibited; roads of this type should have 2 or several separate and one-way carriageways

      2. divided road primarily for through traffic, usually on a continuous route, with control of access limited to interchanges with full grade separation between crossing roads only
    type: intensional
  examples: []
  notes:
  - content: In North America, the term "freeway" is used to apply to this type of
      road.
    type: intensional
  sources:
