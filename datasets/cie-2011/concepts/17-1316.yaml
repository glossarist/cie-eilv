data:
  definition:
  - content: angle between a defined datum axis related to the luminaire and the horizontal when the luminaire is mounted for photometric measurement
    type: intensional
  examples: []
  notes:
  - content: The defined datum axis may be any feature of the luminaire, but generally for a side- mounted luminaire it lies in the mouth of the luminaire canopy, in line with the spigot axis. Another commonly used feature is the spigot entry axis.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
