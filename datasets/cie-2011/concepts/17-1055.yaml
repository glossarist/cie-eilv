data:
  definition:
  - content: plane in which the surface of a sample or standard is placed during measurements
    type: intensional
  examples: []
  notes:
  - content: For reflection measurements, the geometry is defined with respect to
      the reference plane. For transmission measurements, there is a reference plane
      for the incident light and a second reference plane, displaced by the sample
      thickness, for the transmitted light.
    type: intensional
  - content: In indoor and outdoor applications this term is used as an equivalent
      to "{{17-1057, reference surface}}".
    type: intensional
