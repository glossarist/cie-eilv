data:
  definition:
  - content: 'quantity that correlates with the more or less luminous aspect of a star and that is defined by the formula


      stem:[m] = stem:[m_o] − 2,5 log~10~(stem:[E_(pb)]/stem:[E_o])


      where stem:[E_(pb)] is the point brilliance of the star considered, stem:[m_o] and stem:[E_o] are constants based on the magnitudes ascribed to certain standard stars'
    type: intensional
  examples: []
  notes:
  - content: In addition to the visual apparent magnitude defined here, other apparent magnitudes (photographic, bolometric, etc.) are defined by the same formula, but where stem:[E] and stem:[E_o] are the responses of a detector having a specified spectral responsivity.
    type: intensional
  sources:
  - origin:
