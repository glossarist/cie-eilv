data:
  definition:
  - content: measurement of quantities referring to radiation as evaluated according to a given spectral luminous efficiency, e.g. stem:[V](stem:[lambda]) or stem:[V]'(stem:[lambda])
    type: intensional
  examples: []
  notes:
  - content: The term "photometry" is sometimes used in a broader sense covering the science of optical radiation measurement (radiometry), but this use should be deprecated.
