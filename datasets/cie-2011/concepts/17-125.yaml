data:
  definition:
  - content: |-
      traffic control device consisting of lines, patterns, or words on the road surface or curbs within or adjacent to a traffic or parking lane meant to guide or control traffic

      Equivalent term: "road marking"

      Equivalent term used in the US: "pavement marking"
