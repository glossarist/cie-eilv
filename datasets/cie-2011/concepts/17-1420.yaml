data:
  definition:
  - content: process whereby 7‑dehydrocholesterol, precursor of vitamin D3, produces
      previtamin D3 by absorbing 240 nm to 315 nm ultraviolet radiation and moreover
      changes it to vitamin D3 through a thermal isomerization process
    type: intensional
  examples: []
  notes:
  - content: Vitamin D is a generic term for vitamin D2 and/or vitamin D3. The process
      above in mammalian skin produces vitamin D3. Vitamin D2 is formed in plants
      in an analogous process when UV radiation activates ergosterol.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
