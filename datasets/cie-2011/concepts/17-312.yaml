data:
  definition:
  - content: 'quotient of the mean of the values of luminance, stem:[sigma = (L(20°)+L(70°))/(2L(5°))], measured at 20stem:[deg] and 70stem:[deg] (0,35 rad and 1,22 rad) and the luminance measured at 5stem:[deg] (0,09 rad) from the normal, when the surface considered is illuminated normally


      stem:[sigma = ((L ( 20 deg ) + L ( 70 deg )))/((2 L ( 5 deg )))]'
    type: intensional
  examples: []
  notes:
  - content: 'The diffusion factor is intended to give an indication of the spatial distribution of the

      diffused flux. It is equal to 1 for every isotropic diffuser, whatever the value of the

      diffuse reflectance or diffuse transmittance.'
    type: intensional
  - content: 'This way of defining the diffusion factor can be applied only to materials for which

      the indicatrix of diffusion does not differ appreciably from that of ordinary opal

      glasses.'
    type: intensional
  - content: See NOTE to "{{17-515, half-value angle (for a diffusing surface by reflection or by transmission)}}".
    type: intensional
  sources:
