data:
  definition:
  - content: 'quotient of the radiance of a surface element in a specified direction, stem:[L_{e,n}], and the radiance of the perfect reflecting diffuser or perfect transmitting diffuser identically irradiated and viewed, stem:[L_{e,d}]


      stem:[beta_e = ((L_{(e ,n)}))/((L_{(e ,d)}))]'
    type: intensional
  examples: []
  notes:
  - content: 'For photoluminescent media, the radiance factor contains 2 components, the reflected radiance factor, stem:[beta_R], and the luminescent radiance factor, stem:[beta_L]. The sum of the reflected and luminescent radiance factors is thetotal radiance factor, stem:[beta_T]: stem:[beta_T]=stem:[beta_R]+ stem:[beta_L].

      The subscript R is used here for the reflected radiance factor because it is more intuitive than the traditional S and avoids confusion with the use of S to denote a state of polarization.'
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: radiance factor (at a surface element of a non self-radiating medium, in a given direction, under specified conditions of irradiation)
  - type: symbol
    normative_status: preferred
    designation: stem:[beta]e; stem:[beta]
  - type: symbol
    normative_status: preferred
    designation: stem:[stem:[beta]]
