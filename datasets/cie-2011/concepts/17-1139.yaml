data:
  definition:
  - content: process by which the spatial distribution of a beam of radiation is changed
      when it is deviated in many directions by a surface or by a medium, without
      change in {{bib:103-06-02, frequency}} of its monochromatic components
    type: intensional
  examples: []
  notes:
  - content: A distinction is made between selective scattering and non-selective
      scattering according to whether or not the scattering properties vary with the
      wavelength of the incident radiation.
    type: intensional
  - content: See NOTE 2 to "{{17-1065, reflection}}".
    type: intensional
