data:
  definition:
  - content: 'quotient of the real difference in luminance between the target and its background, stem:[Delta L], and the luminance difference needed between a target of a certain angular size and its background for the target to be just visible, stem:[Delta L_(th)], that is at the threshold


      stem:[F_(VL)] = stem:[Delta L] / stem:[Delta L_(th)]'
