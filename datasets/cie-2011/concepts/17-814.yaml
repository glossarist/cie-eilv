data:
  definition:
  - content: value of the detector input that produces an output equal to the root
      mean square (RMS) noise output, for a stated {{bib:103-06-02, frequency}} and
      bandwidth of the measuring instrument
    type: intensional
  examples: []
  notes:
  - content: It is usual to consider a 1 Hz bandwidth, and this value is implied unless
      stated otherwise.
