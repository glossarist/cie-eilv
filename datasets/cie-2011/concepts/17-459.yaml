data:
  definition:
  - content: high intensity discharge lamp in which the major portion of the light
      is produced, directly or indirectly, by radiation from mercury operating at
      a partial pressure in excess of 100 kPa
    type: intensional
  examples: []
  notes:
  - content: This term covers clear, phosphor coated (mercury fluorescent) and blended
      lamps. In a fluorescent mercury discharge lamp, the light is produced partly
      by the mercury vapour and partly by a layer of phosphors excited by the ultraviolet
      radiation of the discharge.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: fluorescent mercury discharge lamp
  language_code: eng
  annotations: []
