data:
  definition:
  - content: effective radiant exposure with the spectral radiant exposure, stem:[Hlambda],
      spectrally weighted with the blue light hazard spectral weighting function,
      stem:[B](stem:[lambda])
    type: intensional
  examples: []
  notes:
  - content: 'Specified in ICNIRP-recommendations: <i>λ</i><sub>1</sub> =300 nm, <i>λ</i><sub>2</sub>
      =700 nm.'
    type: intensional
  - content: This definition implies that an action spectrum is adopted for the actinic
      effect considered, and that its maximum value is 1. When giving a quantitative
      amount, it is essential to specify according to which actinic action spectrum
      the radiant exposure is meant, as the unit is the same.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
