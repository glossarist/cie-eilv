data:
  definition:
  - content: |-
      quotient of the optical thickness of the atmosphere at angle stem:[epsilon] to the vertical, stem:[delta](stem:[epsilon]), and the vertical optical thickness, stem:[delta](0°), of the atmosphere

      stem:[m = ((delta ( epsilon )))/((delta ( 0 ° )))]
    type: intensional
  examples: []
  notes:
  - content: See also "optical thickness".
    type: intensional
  - content: |-
      Several equations are available to express this concept. Usually the Kasten–Young formula is used:

      stem:[m = (1)/((sin\ gamma_s \ + \ 0, 5 0 5\ 72 ( gamma_s \ + \ 6 ,0 79\ 95 )^(- 1 , 636 4)))]

      where stem:[gamma_s] (= 90° − stem:[epsilon]) is solar altitude (complementary angle of zenith angle, stem:[epsilon]) in degree.
    type: intensional
  - content: |-
      When the curvature of the atmosphere and atmospheric refraction are neglected:

      stem:[m = (1)/((cos epsilon))].
    type: intensional
  - content: The relative optical air mass has unit one.
    type: intensional
  - content: This entry was numbered 845-09-88 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1082 in CIE S 017:2011.
    type: intensional
