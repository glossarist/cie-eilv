data:
  definition:
  - content: quotient of the sum of the areas of the working plane and the plane of
      the luminaires and the sum of the area of the walls bounded by the working plane
      and the plane of the luminaires, used in the calculation of the utilization
      factor or utilance
    type: intensional
  examples: []
  notes:
  - content: |-
      The room index is expressed by the formula

      stem:[K = ((a b))/((h ( a + b )))]

      where stem:[a] and stem:[b] are the dimensions of the sides of the room and stem:[h] the mounting height, that is the distance between the working plane and the plane of the luminaires.
    type: intensional
  - content: See also "ceiling cavity index" and "floor cavity index".
    type: intensional
  - content: The room index has unit one.
    type: intensional
  - content: This entry was numbered 845-09-55 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1121 and 17-587 in CIE S 017:2011.
    type: intensional
