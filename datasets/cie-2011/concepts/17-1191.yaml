data:
  definition:
  - content: brightening of the night sky that results from the reflection of radiation
      (visible and non-visible), scattered from the constituents of the atmosphere
      (gas molecules, aerosols and particulate matter), in the direction of observation
    type: intensional
  examples: []
  notes:
  - content: |-
      Sky glow comprises 2 separate components as follows:
      1. Natural sky glow: That part of the sky glow which is attributable to radiation from celestial sources and luminescent processes in the Earth's upper atmosphere.
      2. Man-made sky glow: That part of the sky glow which is attributable to man-made sources of radiation (e.g. outdoor electric lighting), including radiation that is emitted directly upwards and radiation that is reflected from the surface of the Earth.
    type: intensional
  sources:
