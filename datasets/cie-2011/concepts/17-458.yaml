data:
  definition:
  - content: material which exhibits fluorescence as the result of exposure to optical
      radiation
    type: intensional
  examples: []
  notes:
  - content: |-
      These materials absorb energy from optical radiation in the shorter wavelength regions of the visible spectrum and/or in the ultraviolet region and re-radiate some of this energy at longer wavelengths, producing narrow bands of emission in the visible region.
      See also "{{concept:cie-2011:17-908, photoluminescent material}}", "{{concept:cie-2011:17-280, daylight fluorescent colour}}"
    type: intensional
  sources:
