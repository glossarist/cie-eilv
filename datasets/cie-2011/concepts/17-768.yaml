data:
  definition:
  - content: spectrally different colour stimuli that have the same tristimulus values
      in a specified colorimetric system
    type: intensional
  examples: []
  notes:
  - content: The corresponding property is called "metamerism".
    type: intensional
  - content: In German, colours ("Farbvalenzen") consisting of spectrally identical
      colour stimuli are described as "unbedingt-gleich".
    type: intensional
