data:
  definition:
  - content: |-
      density of incident radiant energy with respect to area at a point on a real or imaginary surface

      stem:[H_e = ((d Q_e))/((d A))]

      where stem:[Q_e] is radiant energy and stem:[A] is the area on which the radiant energy is incident
    type: intensional
  examples: []
  notes:
  - content: The quantity “exposure” here defined must not be confused with the quantity
      also named “exposure” which is used in the field of X- and γ-rays, the unit
      of which is coulomb per kilogram (C·kg^-1^).
    type: intensional
