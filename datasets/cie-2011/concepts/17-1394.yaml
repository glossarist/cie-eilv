data:
  definition:
  - content: light, reflected from an imaging medium, that has not been modulated
      by the means used to produce the image
    type: intensional
  examples: []
  notes:
  - content: Veiling glare lightens and reduces the contrast of the darker parts of
      an image.
    type: intensional
  - content: The veiling glare is sometimes referred to as "ambient flare".
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: veiling glare (imaging)
  - type: symbol
