data:
  definition:
  - content: |-
      quotient of reflected radiant flux, stem:[Phi_r], and incident radiant flux, stem:[Phi_m]

      stem:[rho = ((Phi_r))/((Phi_m))]
    type: intensional
  examples: []
  notes:
  - content: 'Reflectance, stem:[rho], is the sum of regular reflectance, stem:[rho_r],
      and diffuse reflectance, stem:[rho_d]: stem:[rho] = stem:[rho_r]+ stem:[rho_d].'
    type: intensional
