data:
  definition:
  - content: period of time required for an arc discharge lamp to develop an electrically
      stable arc discharge, the discharge lamp being operated under specified conditions
      and the time being measured from the moment its circuit is energized
    type: intensional
  examples: []
  notes:
  - content: There is a time delay in the starting device between the time when power
      is applied to this device and the time when power is applied to the lamp electrodes.
      The starting time is measured from the latter moment.
    type: intensional
  sources:
  - origin:
