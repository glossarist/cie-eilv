data:
  definition:
  - content: quotient of the radiant flux of the radiation emitted by a photoluminescent
      material and the radiant flux of the radiation absorbed by that material
    type: intensional
  examples: []
  notes:
  - content: This term is also used for the elementary process with a similar meaning,
      namely the ratio of the energy of the emitted photon to the energy of the absorbed
      photon which gave rise to it.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
