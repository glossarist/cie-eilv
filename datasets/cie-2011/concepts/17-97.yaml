data:
  definition:
  - content: potential for a photochemically induced retinal injury (photic maculopathy)
      resulting from optical radiation exposure at wavelengths primarily between 400 nm
      and 500 nm
    type: intensional
  examples: []
  notes:
  - content: This damage mechanism dominates over the thermal damage mechanism for
      exposure durations exceeding 10 s.
    type: intensional
  - content: |-
      The action spectrum extends into the UV-A for persons without a normal UV-A absorbing lens.
      Abbreviation: "BLH"
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: blue light hazard
  - type: symbol
    normative_status: preferred
