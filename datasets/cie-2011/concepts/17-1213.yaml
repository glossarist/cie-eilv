data:
  definition:
  - content: 'density of a radiant or luminous or photon quantity, stem:[X_lambda = ("d" X(lambda)) / ("d" lambda)](stem:[lambda]), with respect to wavelength, stem:[lambda], at the wavelength stem:[lambda]


      stem:[X_{lambda} = ((d X ( lambda )))/((d lambda))]'
    type: intensional
  examples: []
  notes:
  - content: The term "spectral distribution" is to be preferred to the equivalent term "spectral concentration" when dealing with the function stem:[X]~stem:[lambda]~(stem:[lambda]) over a range of wavelengths, not at a particular wavelength.
    type: intensional
  - content: See NOTES to "{{17-1206, spectral}}".
    type: intensional
