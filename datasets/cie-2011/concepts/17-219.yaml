data:
  definition:
  - content: arrangement of samples according to a set of principles for the ordering
      and denotation of their colour, usually according to defined scales
    type: intensional
  examples: []
  notes:
  - content: |-
      A colour order system is usually exemplified by a set of physical samples, sometimes known as a colour atlas. This facilitates the communication of colour but is not a prerequisite for defining a colour order system.
      See also "{{concept:cie-2011:17-201, colour atlas}}"
    type: intensional
  sources:
