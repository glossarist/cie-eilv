data:
  definition:
  - content: quotient of the spectral radiant flux reaching the exit internal surface of the layer and the spectral flux that enters into the layer after crossing the entry surface
    type: intensional
  examples: []
  notes:
  - content: For a given layer the spectral internal transmittance depends on the path length of the radiation in the layer, and hence, in particular, on the angle of incidence.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: spectral internal transmittance (of a homogeneous non-diffusing layer)
  - type: symbol
    normative_status: preferred
    designation: stem:[tau]i (stem:[lambda])
  - type: symbol
