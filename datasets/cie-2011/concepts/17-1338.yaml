data:
  definition:
  - content: quotient of the flux transmitted by a specimen in a given optical system and the flux transmitted when the specimen is removed from the sampling aperture
    type: intensional
  examples: []
  notes:
  - content: This is the case when e.g. radiation penetrating a slide situated in a projector and reaching a screen is compared to the radiation when the slide is removed from the projector and only an empty slide mount is in the projector.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: transmittance factor (of a specimen in an optical system)
