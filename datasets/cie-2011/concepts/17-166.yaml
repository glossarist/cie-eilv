data:
  definition:
  - content: standard observer whose colour-matching functions deviate from those
      of the CIE standard colorimetric observer in a defined manner
    type: intensional
  examples: []
  notes:
  - content: The defined deviations can be applied to the {{17-149, CIE 1931 standard
      colorimetric observer}} or the {{17-151, CIE 1964 standard colorimetric observer}}.
    type: intensional
  - content: |-
      The use of the standard deviate observer is intended to generate differences that are typical of those that occur when colour matches are made by different real observers whose colour vision is classified as normal.
      See also CIE 80-1989
    type: intensional
