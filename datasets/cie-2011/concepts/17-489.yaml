data:
  definition:
  - content: quantity that determines the maximum geometric throughput of radiation transmitted, received or emitted in a single-pass, passive optical arrangement
    type: intensional
  examples: []
  notes:
  - content: 'For a beam propagating through successive non-diffusing media, the quantity stem:[n_A] , where stem:[n_A^''] is the refractive index, is invariant. That quantity is called "optical extent".


      stem:[G = 1/I^2 int_A int_(A'') "d"A cos theta * "d"A'' cos theta'' = int "d"G]


      stem:["d"G = ("d"A cos theta * "d"A'' cos theta'')/I^2 = "d"A cos theta "d"Omega = dA'' cos theta'' "d"Omega = "d"G]'
    type: intensional
  sources:
