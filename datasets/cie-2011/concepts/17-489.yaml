data:
  definition:
  - content: quantity that determines the maximum geometric throughput of radiation transmitted, received or emitted in a single-pass, passive optical arrangement
    type: intensional
  examples: []
  notes:
  - content: For a beam propagating through successive non-diffusing media, the quantity stem:[Gn^{2}] , where stem:[n] is the refractive index, is invariant. That quantity is called "optical extent".
    type: intensional
