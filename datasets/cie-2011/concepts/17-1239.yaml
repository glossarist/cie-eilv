data:
  definition:
  - content: locus, in a chromaticity diagram or in a tristimulus space, of points
      that represent monochromatic stimuli
    type: intensional
  examples: []
  notes:
  - content: In tristimulus space, the spectrum locus is a cone that is called in
      German "Spektralkegel" ("spectral cone") or, when including the vectors that
      represent the purple boundary, "Farbtüte".
    type: intensional
