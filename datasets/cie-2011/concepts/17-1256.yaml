data:
  definition:
  - content: electric lamp intended to be used as a reference in photometric or spectroradiometric
      measurements, for which the calibration is traceable to a primary measurement
      standard (ISO/IEC Guide 99:2007, 5.4)
    type: intensional
  examples: []
  notes:
  - content: |-
      The term is sometimes also used for a portable luminaire on a high stand suitable for standing on the floor.
      Equivalent term used in the US for this usage: "floor lamp"
    type: intensional
