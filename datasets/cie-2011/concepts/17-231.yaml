data:
  definition:
  - content: temperature of a Planckian radiator whose radiation has the same chromaticity
      as that of a given stimulus
    type: intensional
  examples: []
  notes:
  - content: The reciprocal colour temperature is also used with unit K^-1^ or MK^-1^
      (where 1 MK^-1^ = 10^-6^K^-1^) whose previous name "mired" is now obsolete.
    type: intensional
