data:
  definition:
  - content: temperature of a Planckian radiator whose radiation has the same chromaticity
      as that of a given stimulus
    type: intensional
  examples: []
  notes:
  - content: The reciprocal colour temperature is also used with unit K<sup>-1</sup>
      or MK<sup>-1</sup> (where 1 MK<sup>-1</sup> = 10<sup>-6</sup>K<sup>-1</sup>)
      whose previous name "mired" is now obsolete.
    type: intensional
