data:
  definition:
  - content: source of incoherent radiation, the dimensions of which are small enough,
      compared to the distance between the source and the irradiated surface, to be
      negligible in calculations and measurements
    type: intensional
  examples: []
  notes:
  - content: A point source which emits uniformly in all directions is called an isotropic
      point source or uniform point source.
