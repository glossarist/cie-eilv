data:
  definition:
  - content: part of an electric lamp which provides connection to the power supply by means of a lampholder or lamp connector and, in most cases, also serves to retain the electric lamp in the lampholder
    type: intensional
  examples: []
  notes:
  - content: The term "base" is used in both outside and in the US to denote an integral part of a lamp envelope which has been shaped so that it fulfils the function of a cap. It may engage also either a holder or a connector, depending on other design features of the lamp-and-holder system.
    type: intensional
  - content: The cap of a lamp and its corresponding holder are generally identified by one or more letters followed by a number which indicates approximately the principal dimension (generally the diameter) of the cap in millimetres. The standard code is to be found in IEC Publication 60061.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: cap
  - type: expression
    normative_status: preferred
    designation: base
  language_code: eng
  annotations: []
