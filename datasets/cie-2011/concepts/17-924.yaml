data:
  definition:
  - content: |-
      density of incident photon number with respect to area at a point on a real or imaginary surface

      stem:[H_p = ((d N_p))/((d A))]

      where stem:[N_p] is photon number and stem:[A] is the area on which the photons are incident
    type: intensional
