data:
  definition:
  - content: |-
      density of incident luminous energy with respect to area at a point on a real or imaginary surface

      stem:[H_v = ((d Q_v))/((d A))]

      where stem:[Q_v] is luminous energy and stem:[A] is the area on which the luminous energy is incident
    type: intensional
