data:
  definition:
  - content: quotient of the {{cite:113-01-34, speed of light in vacuum}} and the
      speed of light in a medium
    type: intensional
  examples: []
  notes:
  - content: 'For isotropic media, this index is equal to the ratio of the sines of
      the angles of incidence, stem:[Theta_1], and refraction, stem:[Theta_2], of
      a ray passing through the surface separating vacuum and medium: stem:[n](stem:[lambda])=sin
      stem:[Theta_1]/sin stem:[Theta_2].'
    type: intensional
  sources:
