data:
  definition:
  - content: quotient of the speed of light in vacuum and the speed of light in a medium
    type: intensional
  examples: []
  notes:
  - content: 'For isotropic media, this index is equal to the ratio of the sines of the angles of incidence, stem:[Θ_1], and refraction, stem:[Θ_2], of a ray passing through the surface separating vacuum and medium: stem:[n](stem:[λ])=sin stem:[Θ_1]/sin stem:[Θ_2].'
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: refractive index (of a medium, for a monochromatic radiation of wavelength, <i>λ</i>, in vacuum)
  - type: symbol
    normative_status: preferred
    designation: stem:[n]
  - type: symbol
    normative_status: preferred
    designation: stem:[n](stem:[λ])
