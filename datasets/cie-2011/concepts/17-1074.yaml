data:
  definition:
  - content: quotient of the speed of light in vacuum and the speed of light in a
      medium
    type: intensional
  examples: []
  notes:
  - content: 'For isotropic media, this index is equal to the ratio of the sines of
      the angles of incidence, <i>Θ</i><sub>1</sub>, and refraction, <i>Θ</i><sub>2</sub>,
      of a ray passing through the surface separating vacuum and medium: <i>n</i>(<i>λ</i>)=sin
      <i>Θ</i><sub>1</sub>/sin <i>Θ</i><sub>2</sub>.'
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: refractive index (of a medium, for a monochromatic radiation of wavelength,
      <i>λ</i>, in vacuum)
  - type: symbol
    normative_status: preferred
    designation: "n"
  - type: symbol
    normative_status: preferred
    designation: "<i>n</i>(<i>λ</i>)"
