data:
  definition:
  - content: anomaly of vision in which there is a reduced ability to discriminate
      between some or all colours
    type: intensional
  examples: []
  notes:
  - content: 'Anomalous trichromatism: Form of trichromatism in which colour discrimination
      is less than normal.'
    type: intensional
  - content: 'Deutan: Adjective denoting deuteranopia or deuteranomaly.'
    type: intensional
  - content: 'Deuteranomaly: Defective colour vision in which discrimination of the
      reddish and greenish contents of colours is reduced, without any colours appearing
      abnormally dim.'
    type: intensional
  - content: 'Deuteranopia: Defective colour vision in which discrimination of the
      reddish and greenish contents of colours is absent, without any colours appearing
      abnormally dim.'
    type: intensional
  - content: 'Dichromatism: Defective colour vision in which all colours can be matched
      using additive mixtures of only 2 matching stimuli.'
    type: intensional
  - content: 'Monochromatism: Defective colour vision in which all colours can be
      matched using only a single matching stimulus.'
    type: intensional
  - content: 'Protan: Adjective denoting protanopia or protanomaly.'
    type: intensional
  - content: 'Protanomaly: Defective colour vision in which discrimination of the
      reddish and greenish contents of colours is reduced, with reddish colours appearing
      abnormally dim.'
    type: intensional
  - content: 'Protanopia: Defective colour vision in which discrimination of the reddish
      and greenish contents of colours is absent, with reddish colours appearing abnormally
      dim.'
    type: intensional
  - content: 'Tritan: Adjective denoting tritanopia or tritanomaly.'
    type: intensional
  - content: 'Tritanomaly: Defective colour vision in which discrimination of the
      bluish and yellowish contents of colours is reduced.'
    type: intensional
  - content: 'Tritanopia: Defective colour vision in which discrimination of the bluish
      and yellowish contents of colours is absent.'
    type: intensional
