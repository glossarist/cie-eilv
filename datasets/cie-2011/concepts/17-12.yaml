data:
  definition:
  - content: stimulus that, under the prevailing conditions of adaptation, gives rise
      to an achromatic colour
    type: intensional
  examples: []
  notes:
  - content: In the colorimetry of object colours, the colour stimulus produced by
      the perfect reflecting or transmitting diffuser is usually considered to be
      an achromatic stimulus for all illuminants, except for those whose light sources
      appear to be highly chromatic.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: achromatic stimulus
  language_code: eng
  annotations: []
