data:
  definition:
  - content: lighting design technique where the light equally falls on objects in
      directions with and against the traffic
    type: intensional
  examples: []
  notes:
  - content: |-
      Symmetric lighting is characterized by using luminaires that show a luminous intensity distribution that is symmetric in relation to the plane normal to the direction of the traffic.
      See also "{{17-986, pro-beam lighting (in a tunnel)}}", "{{17-261, counter-beam lighting (in a tunnel)}}"
    type: intensional
