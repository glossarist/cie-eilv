data:
  definition:
  - content: apparatus which distributes, filters or transforms the light transmitted
      from at least one source of optical radiation and which includes, except the
      sources themselves, all the parts necessary for fixing and protecting the sources
      and, where necessary, circuit auxiliaries together with the means for connecting
      them to the power supply
