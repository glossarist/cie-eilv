data:
  definition:
  - content: quotient of illuminance produced by the lighting installation after a
      certain time interval and the illuminance produced by the installation when
      new
    type: intensional
  examples: []
  notes:
  - content: The term "depreciation factor" has been formerly used to designate the
      reciprocal of the above ratio.
    type: intensional
  - content: |-
      The maintenance factor takes into account light losses caused by dirt accumulation on luminaires and room surfaces (in interiors) or other relevant surfaces (in exteriors, where appropriate), and the decrease of the luminous flux of lamps.
      Abbreviation: "MF"
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: maintenance factor (of a lighting installation)
  - type: symbol
    normative_status: preferred
    designation: MF
  - type: symbol
    normative_status: preferred
    designation: "<i>f</i><sub>m</sub>"
