data:
  definition:
  - content: radiant spherical exposure weighted with a stated photobiological action spectrum
    type: intensional
  examples: []
  notes:
  - content: This definition implies that an action spectrum is adopted for the actinic effect considered, and that its maximum value is 1. When giving a quantitative amount, it is essential to specify according to which actinic action spectrum the fluence is meant, as the unit is the same.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: photobiological fluence (at a point, for a given exposure duration)
  - type: symbol
    normative_status: preferred
    designation: stem:[H_(eff,o)]
  - type: symbol
    normative_status: preferred
