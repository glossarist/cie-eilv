data:
  definition:
  - content: vertical axis through the photometric centre of a luminaire when it is
      at its tilt during measurement
    type: intensional
  examples: []
  notes:
  - content: The poles of the stem:[C], stem:[gamma] coordinate system lie in this
      axis.
    type: intensional
  - content: This axis is tilted when the luminaire is tilted from its tilt during
      measurement.
    type: intensional
  - content: See CIE 121-1996 for more information on the first axis of a luminaire.
    type: intensional
