data:
  definition:
  - content: quotient of the quantity of heat penetrating into an interior through
      the glazing and the solar radiant energy incident on that glazing
    type: intensional
  examples: []
  notes:
  - content: |-
      This ratio is the sum of 2 quantities: the radiant transmittance, <i>τ</i><sub>e</sub>, of the glazing and the quantity equal to the ratio of the convected and radiated heat gain from the glazing into the interior, <i>Q</i><sub>2</sub>, to the solar radiant energy, <i>Q</i><sub>1</sub>, incident on the glazing:
      <i>g</i> = <i>τ</i><sub>e</sub> + <i>Q</i><sub>2</sub>/ <i>Q</i><sub>1</sub>.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: solar factor (of glazing material)
  - type: symbol
    normative_status: preferred
    designation: total transmittance, <of glazing material>
  - type: symbol
    normative_status: preferred
    designation: "<i>g</i>"
  - type: expression
    normative_status: admitted
    designation: total (energy) transmittance
  language_code: eng
  annotations: []
