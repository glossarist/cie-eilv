data:
  definition:
  - content: quotient of the quantity of heat penetrating into an interior through the glazing and the solar radiant energy incident on that glazing
    type: intensional
  examples: []
  notes:
  - content: 'This ratio is the sum of 2 quantities: the radiant transmittance, stem:[tau_e], of the glazing and the quantity equal to the ratio of the convected and radiated heat gain from the glazing into the interior, stem:[Q_2], to the solar radiant energy, stem:[Q_1], incident on the glazing:

      stem:[g] = stem:[tau_e] + stem:[Q_2]/ stem:[Q_1].'
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: solar factor (of glazing material)
  - type: expression
    normative_status: preferred
    designation: total transmittance, <of glazing material>
  - type: symbol
    normative_status: preferred
    designation: stem:[g]
  - type: expression
    normative_status: admitted
    designation: total (energy) transmittance
  language_code: eng
  annotations: []
