data:
  definition:
  - content: discharge lamp of the low-pressure mercury type in which most of the
      light is emitted by one or several layers of phosphors excited by the ultraviolet
      radiation from the discharge
    type: intensional
  examples: []
  notes:
  - content: These lamps are frequently tubular and in which case are often referred
      to as "fluorescent tubes".
    type: intensional
