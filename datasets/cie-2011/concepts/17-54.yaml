data:
  definition:
  - content: electric discharge characterized by a cathode fall which is small compared
      to that in a glow discharge
    type: intensional
  examples: []
  notes:
  - content: The emission of the cathode results from various causes (thermionic emission,
      field emission, etc.) acting simultaneously or separately, secondary emission
      plays only a small part.
    type: intensional
