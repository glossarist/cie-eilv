data:
  definition:
  - content: |-
      greatest distance at which an object or a light source could be seen under conditions of perfect visibility, as limited only by the curvature of the Earth, by refraction in the atmosphere, and by the heights of the observer and the object or light source

      Equivalent term used outside US: "geographical range"
