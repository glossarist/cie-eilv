      represented by the symbols stem:[R], stem:[G], stem:[B]; stem:[X], stem:[Y],
      stem:[Z]; stem:[R_(10)], stem:[G_(10)], stem:[B_(10)] and stem:[X_(10)], stem:[Y_(10)],
      stem:[Z_(10)].
