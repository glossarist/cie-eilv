data:
  definition:
  - content: vision by the normal eye in which rods are the principal active photoreceptors
    type: intensional
  examples: []
  notes:
  - content: Scotopic vision normally occurs when the eye is adapted to levels of luminance of less than ~10^-3^ cdcdotm^-2^.
    type: intensional
  - content: In comparison to photopic vision, scotopic vision is characterized by the lack of colour perception and by a shift of the visual sensitivity towards shorter wavelengths.
    type: intensional
  sources:
