data:
  definition:
  - content: material which exhibits photoluminescence as the result of exposure to
      optical radiation
    type: intensional
  examples: []
  notes:
  - content: |-
      These materials absorb energy from optical radiation in the shorter wavelength regions of the visible spectrum and/or in the ultraviolet region and re-radiate some of this energy at longer wavelengths, producing narrow bands of emission in the visible region.
      See also "{{17-458, fluorescent material}}", "{{17-280, daylight fluorescent colour}}"
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: photoluminescent material
  language_code: eng
  annotations: []
