data:
  definition:
  - content: |-
      quotient of the detector output, stem:[Y], and the detector input, stem:[X]

      stem:[s = (Y)/(X)]
    type: intensional
  examples: []
  notes:
  - content: If the detector signal is stem:[Y_0] in the absence of input, and is
      stem:[Y_t] when there is an input stem:[X], the responsivity is stem:[s = ((Y_t
      - Y_0))/(X)].
    type: intensional
  - content: The term "sensitivity" is no longer used.
    type: intensional
  - content: This entry was numbered 845-05-54 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1094 and 17-1163 in CIE S 017:2011.
    type: intensional
