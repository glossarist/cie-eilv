data:
  definition:
  - content: mean value of irradiance on the outer curved surface of a very small
      (real or imaginary) sphere at a point in space
    type: intensional
  examples: []
  notes:
  - content: This quantity is the quotient of the radiant flux of all the radiation
      incident on the outer surface of an infinitely small sphere centred at the given
      point, by the area of the diametrical cross-section of that sphere.
    type: intensional
  - content: The analogous quantities “spherical illuminance”, stem:[E_(v,o)], and
      “photon spherical irradiance” (also termed “photon fluence rate”), stem:[E_(p,o)],
      are defined in a similar way, replacing radiance, stem:[L_e], by luminance,
      stem:[L_v], or photon radiance, stem:[L_p].
    type: intensional
  - content: This is the appropriate radiometric quantity for describing a dose rate
      for a photobiological or photochemical effect in a scattering medium (e.g.,
      light in skin). It is also the appropriate quantity for describing the irradiation
      of microorganisms. It is frequently used incorrectly as a substitute for irradiance
      in some publications.
    type: intensional
