data:
  definition:
  - content: ideal surface for which the radiation coming from that surface is distributed
      angularly according to Lambert's cosine law
    type: intensional
  examples: []
  notes:
  - content: For a lambertian surface, stem:[M] = π stem:[L] where stem:[M] is the
      radiant exitance or luminous exitance, and stem:[L] the radiance or luminance.
    type: intensional
