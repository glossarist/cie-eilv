data:
  definition:
  - content: aeronautical ground light positioned on, or very close to, a runway of
      an aerodrome to indicate the part of the runway intended for the landing or
      take-off of aircraft
    type: intensional
  examples: []
  notes:
  - content: Runway centre-line lights and runway edge lights indicate the centre
      line and the edges of a runway respectively. Runway threshold lights and runway
      end lights indicate the beginning and the end of the part of the runway intended
      for the landing of aircraft respectively. Runway touchdown zone lights are barrettes
      arranged in pairs symmetrically about the centre line of a runway, and between
      the 2 lines of runway edge lights, to indicate the portion of the runway where
      aircraft should first make contact on landing.
    type: intensional
