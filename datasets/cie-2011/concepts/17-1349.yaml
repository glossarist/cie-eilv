data:
  definition:
  - content: non-SI unit for conventional retinal illuminance and natural pupil luminance
    type: intensional
  examples: []
  notes:
  - content: When the eye is viewing a surface of uniform luminance, the number of
      trolands is equal to the product of the area in square millimetres of the limiting
      pupil, natural or artificial, by the luminance of the surface in cd·m^-2^.
    type: intensional
  - content: In computing effective retinal illuminance, absorption, scattering, and
      reflection losses, and the dimensions of the particular eye under consideration
      must be taken into account as well as the Stiles-Crawford effect.
    type: intensional
  - content: In German,“Pupillenlichtstärke” designates the retinal illuminance.
    type: intensional
  - content: "“troland at a scotopic level” is used when the luminance is evaluated
      for scotopic vision."
    type: intensional
