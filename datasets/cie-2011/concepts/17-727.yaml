data:
  definition:
  - content: colour perceived to belong to an area that appears to be emitting light
      as a primary light source, or that appears to be specularly reflecting such
      light
    type: intensional
  examples: []
  notes:
  - content: Primary light sources seen in their natural surroundings normally exhibit
      the appearance of luminous colours in this sense.
