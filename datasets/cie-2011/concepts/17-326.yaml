data:
  definition:
  - content: signal light designed to show a signal of one character over a narrow
      arc of the horizon, and used to indicate a particular direction
    type: intensional
  examples: []
  notes:
  - content: It may also indicate an arc of the horizon to each side by dissimilar
      characters.
    type: intensional
  - content: In French, the term "feu de guidage" refers to a direction light in which
      a very narrow arc of the horizon is used to indicate a particular direction,
      and an arc of the horizon to each side must be indicated.
    type: intensional
  sources:
  - origin:
