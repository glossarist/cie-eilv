data:
  definition:
  - content: communication of the associated data required for unambiguous interpretation
      of colour content data, and application of colour data conversions as required
      to produce the intended reproductions
    type: intensional
  examples: []
  notes:
  - content: Colour content may consist of text, line art, graphics, and pictorial
      images, in raster or vector form, all of which may be colour managed.
    type: intensional
  - content: Colour management considers the characteristics of input and output devices
      in determining colour data conversions for these devices.
    type: intensional
