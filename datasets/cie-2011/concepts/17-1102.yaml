data:
  definition:
  - content: effective radiance with the spectral radiance, stem:[Llambda], spectrally
      weighted with the retinal thermal hazard spectral weighting function, stem:[r](stem:[lambda])
    type: intensional
  examples: []
  notes:
  - content: 'Specified in ICNIRP-recommendations: <i>λ</i><sub>1</sub> = 380 nm,
      <i>λ</i><sub>2</sub> = 1400 nm.'
    type: intensional
  - content: This definition implies that an action spectrum is adopted for the actinic
      effect considered, and that its maximum value is 1. When giving a quantitative
      amount, it is essential to specify according to which actinic action spectrum
      the radiance is meant, as the unit is the same.
    type: intensional
  sources:
