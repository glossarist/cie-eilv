data:
  definition:
  - content: lighting by means of primary light sources and luminaires having a distribution
      of luminous intensity such that the fraction of the emitted luminous flux directly
      reaching the working plane, assumed to be of infinite extent, is 90 % to 100 %
    type: intensional
