data:
  definition:
  - content: angle subtended by a real or apparent source at a given point in space
    type: intensional
  examples: []
  notes:
  - content: Subtended angles are denoted by the full included angle, not the half angle.
    type: intensional
  - content: The angular subtense, stem:[alpha], will often be modified by incorporation of lenses and mirrors as projector optics, in which case the angular subtense of the apparent source will differ from the angular subtense of the physical source.
    type: intensional
  - content: The angular subtense of an oblong source shall be determined by the arithmetic mean of the maximum and minimum angular dimension of the source.
    type: intensional
  - content: 'In safety applications (IEC62471/CIES009:2006 stem:[Photobiological safety of lamp and lamp systems]) the term is used as: angle subtended by an apparent source as viewed from a point in space.'
    type: intensional
  sources:
  - origin:
