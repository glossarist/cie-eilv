data:
  definition:
  - content: paint, pigment or dye that exhibits fluorescence as the result of exposure
      to daylight
    type: intensional
  examples: []
  notes:
  - content: |-
      These materials absorb energy from daylight in the shorter wavelength regions of the visible spectrum and/or in the ultraviolet region and re-radiate some of this energy at longer wavelengths, producing radiation in a small range of wavelengths in the visible region.
      See also "{{17-908, photoluminescent material}}", "{{17-458, fluorescent material}}"
    type: intensional
  sources:
