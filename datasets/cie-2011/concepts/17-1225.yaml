data:
  definition:
  - content: |-
      integral of the spectral linear attenuation coefficient, stem:[mu](stem:[x], stem:[lambda]), of the medium between the points stem:[x_1] and stem:[x_2], as given by the equation

      stem:[delta ( lambda ) = int_((x_1))^((x_2)) mu ( x , lambda ) d x]
    type: intensional
  examples: []
  notes:
  - content: The spectral optical thickness is used in atmospheric physics and physical
      oceanography.
    type: intensional
  - content: The spectral optical thickness has unit one.
    type: intensional
  - content: This entry was numbered 845-04-80 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-1226 and 17-1225 in CIE S 017:2011.
    type: intensional
  sources:
