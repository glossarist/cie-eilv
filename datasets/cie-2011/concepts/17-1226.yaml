data:
  definition:
  - content: 'integral of the spectral linear attenuation coefficient, stem:[mu](stem:[x], stem:[lambda]), of the medium between the points stem:[x_1] and stem:[x_2], as given by the equation


      stem:[delta ( lambda ) = int_{(x_1)}^{(x_2)} mu ( x , lambda ) d x]'
