data:
  definition:
  - content: emission of optical radiation when a substance is exposed to any type
      of electromagnetic radiation, where the emitted radiation generally appears
      within 10 ns after the excitation
    type: intensional
  examples: []
  notes:
  - content: This effect is due to an "allowed" transition generally from an excited
      singlet state to a ground singlet state.
