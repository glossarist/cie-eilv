data:
  definition:
  - content: inflammatory response of the cornea and conjunctiva following exposure
      to ultraviolet radiation
    type: intensional
  examples: []
  notes:
  - content: Wavelengths shorter than 320 nm are most effective in causing this condition.
      The peak of the action spectrum is at approximately 270 nm. Common synonyms
      are "snowblindness," "arc eye," and "welder's flash".
    type: intensional
  - content: Different action spectra have been published for photokeratitis and photoconjuctivitis
      (CIE 106/2-1993 and CIE 106/3-1993); however, the latest studies support the
      use of a single action spectrum for both ocular effects (CIE 106/1-1993).
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
