data:
  definition:
  - content: retinal lesion produced by intense visible or IR-A radiation exposure
    type: intensional
  examples: []
  notes:
  - content: Generally used to describe a thermal retinal lesion (see "{{17-1101,
      retinal thermal injury}}"); however, sometimes applied to a photochemical retinal
      lesion. More specific terms are also used for a photochemical "burn," i.e.,
      a "{{17-881, photic maculopathy}}" or "blue light photoretinitis" (from blue
      light induced injuries), or for a retinal thermal injury, a "chorioretinal thermal
      injury".
    type: intensional
