data:
  definition:
  - content: 'time integral of luminance, stem:[L_v], over a given duration, stem:[Delta t]


      stem:[L_{(v , t)} = underset((Delta t))( int ) L_v d t]'
    type: intensional
  examples: []
  notes:
  - content: The corresponding radiometric quantity is "radiance dose". The corresponding quantity for photons is "photon radiance dose".
    type: intensional
  - content: The luminance dose is expressed in candela times second per square metre stem:[cd cdot s cdot m^(-2)].
    type: intensional
  - content: This entry was numbered 17-716 in CIE S 017:2011.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: luminance dose (in a given direction, at a given point of a real or imaginary surface)
  - type: symbol
    normative_status: preferred
    designation: stem:[L_{v,t}]
  - type: symbol
    normative_status: preferred
    designation: stem:[L_t,v]
