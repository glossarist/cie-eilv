data:
  definition:
  - content: lighting design technique where the light falls on objects in the same
      direction as the traffic
    type: intensional
  examples: []
  notes:
  - content: |-
      Pro-beam lighting is characterized by using luminaires that show a luminous intensity distribution that is asymmetric in relation to the C90-C270 plane (the plane normal to the direction of the traffic), where the maximum luminous intensity is aimed in the same direction as the direction of the traffic.
      See also "{{17-1293, symmetric lighting (in a tunnel)}}", "{{17-261, counter-beam lighting (in a tunnel)}}"
      Abbreviation: "PBL"
    type: intensional
