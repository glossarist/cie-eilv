data:
  definition:
  - content: lamp intended for lighting spaces that are typically occupied or viewed
      by people
    type: intensional
  examples: []
  notes:
  - content: Examples would be lamps for lighting offices, schools, homes, factories,
      roads, or automobiles. It does not include lamps for such specialized uses as
      film projection, reprographic processes, "sun-tanning", industrial processes,
      medical treatment, and searchlight applications.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
