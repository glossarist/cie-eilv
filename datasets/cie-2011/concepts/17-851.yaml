data:
  definition:
  - content: object colour stimuli that correspond to objects whose luminance factors
      have maximum possible values for each chromaticity when their spectral luminance
      factors do not exceed unity for any wavelength
    type: intensional
  examples: []
  notes:
  - content: These stimuli correspond, in general, to objects whose spectral luminance
      factors have values of either unity or 0, with not more than 2 transitions between
      them.
    type: intensional
  - content: The luminance factors and chromaticity coordinates of these stimuli define
      the boundaries of a colour solid corresponding to non-fluorescent objects.
    type: intensional
  - content: For a given luminance factor, these colour stimuli define the maximum
      purity possible for non-fluorescent objects.
    type: intensional
  sources:
