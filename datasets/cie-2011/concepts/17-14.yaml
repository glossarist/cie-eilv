data:
  definition:
  - content: 'quantity obtained by spectrally weighting the spectral radiant exposure with the actinic action spectrum


      stem:[H_((act)) = int int E_((e , lambda)) ( t ) s_((act)) ( lambda ) d lambda d t]


      where stem:[E_(e,stem:[lambda])] is the spectral irradiance in Wcdotm^−2^cdotnm^−1^ and stem:[s_(act)](stem:[lambda]) is the actinic action spectrum normalized to 1 at its maximum'
    type: intensional
  examples: []
  notes:
  - content: This definition implies that an action spectrum is adopted for the actinic effect considered, and that its maximum value is 1. When giving a quantitative amount, it is essential to specify according to which actinic action spectrum the dose is meant, as the unit is the same.
    type: intensional
  sources:
