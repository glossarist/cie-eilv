data:
  definition:
  - content: electromagnetic radiation in which the electric field vector rotates
      at the radiation frequency, but varies in magnitude at a rate equal to twice
      the radiation frequency with the terminal point of the electric field vector
      describing an ellipse
    type: intensional
  examples: []
  notes:
  - content: Elliptically polarized radiation is described as right-handed (left-handed)
      if the rotation of the E-vector is clockwise (anti-clockwise) as viewed by an
      observer receiving the radiation.
    type: intensional
  sources:
