data:
  definition:
  - content: |-
      time integral of photon radiance, stem:[L_p], over a given duration, stem:[Delta t]

      stem:[L_((p , t)) = underset((Delta t))( int ) L_p d t]
    type: intensional
  examples: []
  notes:
  - content: The corresponding radiometric quantity is "radiance dose". The corresponding
      photometric quantity is "luminance dose".
    type: intensional
  - content: The photon radiance dose is expressed in metre to the power minus two
      per steradian (m^−2^·sr^−1^).
    type: intensional
  - content: This entry was numbered 17-932 in CIE S 017:2011.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: photon radiance dose (in a given direction, at a given point of a
      real or imaginary surface)
  - type: symbol
    normative_status: preferred
    designation: Lp,t; Lt
  - type: symbol
    normative_status: preferred
    designation: "<i>L</i><sub>t,p</sub>"
