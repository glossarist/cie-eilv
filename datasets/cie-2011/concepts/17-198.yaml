data:
  definition:
  - content: characteristic of visual perception that can be described by attributes of hue, brightness (or lightness) and colourfulness (or saturation or chroma)
    type: intensional
  examples: []
  notes:
  - content: When necessary, to avoid confusion between other meanings of the word, the term "perceived colour" may be used.
    type: intensional
  - content: Perceived colour depends on the spectral distribution of the colour stimulus, on the size, shape, structure and surround of the stimulus area, on the state of adaptation of the observer's visual system, and on the observer's experience of the prevailing and similar situations of observation.
    type: intensional
  - content: See NOTE 1 and NOTE 2 to "{{concept:cie-2011:17-197, colour}}".
    type: intensional
  - content: Perceived colour may appear in several modes of colour appearance. The names for various modes of appearance are intended to distinguish among qualitative and geometric differences of colour perceptions. Some of the more important terms of the modes of colour appearance are given in "{{concept:cie-2011:17-831, object colour}}", "{{concept:cie-2011:17-1285, surface colour}}" and "{{concept:cie-2011:17-47, aperture colour}}". Other modes of colour appearance include film colour, volume colour, illuminant colour, body colour, and Ganzfeld colour. Each of these modes of colour appearance may be further qualified by adjectives to describe combinations of colour or their spatial and temporal relationships. Other terms that relate to qualitative differences among colours perceived in various modes of colour appearance are given in "{{concept:cie-2011:17-727, luminous colour}}", "{{concept:cie-2011:17-818, non-luminous colour}}", "{{concept:cie-2011:17-1080, related colour}}" and "{{concept:cie-2011:17-1376, unrelated colour}}".
    type: intensional
