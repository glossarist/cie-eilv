data:
  definition:
  - content: |-
      stem:[p_c = ((L_d))/((L_n + L_d))]

      where stem:[L_d] and stem:[L_n] are the respective luminances of the monochromatic stimulus and of the specified achromatic stimulus that match the colour stimulus considered in an additive mixture
    type: intensional
  examples: []
  notes:
  - content: In the case of purple stimuli, see NOTE 1 to "{{17-1002, purity (of a
      colour stimulus)}}".
    type: intensional
  - content: In the CIE 1931 standard colorimetric system, colorimetric purity, <i>p</i><sub>c</sub>,
      is related to excitation purity, <i>p</i><sub>e</sub>, by the equation <i>p</i><sub>c</sub>=<i>p</i><sub>e</sub><i>y</i><sub>d</sub>/<i>y</i>
      where <i>y</i><sub>d</sub>, and <i>y</i> are the <i>y</i> chromaticity coordinates
      respectively, of the monochromatic stimulus and the colour stimulus considered.
    type: intensional
  - content: In the CIE 1964 standard colorimetric system, a measure, <i>p</i><sub>c</sub>,<sub>10</sub>,
      is defined by the relation given in NOTE 2, but using <i>p</i><sub>e</sub>,<sub>10</sub>,
      <i>y</i><sub>d</sub>,<sub>10</sub> and <i>y</i><sub>10</sub> instead of <i>p</i><sub>e</sub>,
      <i>y</i><sub>d</sub>, and <i>y</i> respectively.
    type: intensional
  sources:
