data:
  definition:
  - content: quantity developed for the public domain, for weather forecasting and
      climatology, which quantifies the erythemal potential (or sunburning power)
      of the ambient solar ultraviolet radiation, but could also be applied to other
      sources
    type: intensional
  examples: []
  notes:
  - content: |-
      The International Global UV Index, stem:[I_(UV)], is defined by the formula:

      stem:[I_((uv)) = k_((er)) int_((250 nm))^((400 nm)) E_(lambda) ( lambda ) s_((er)) ( lambda ) d lambda]

      where stem:[Elambda](stem:[lambda]) is the solar spectral irradiance expressed in W·m^−2^·nm^−1^ at wavelength stem:[lambda], stem:[s_(er)](stem:[lambda]) is the erythema spectral weighting function, and stem:[k_(er)] is a constant equal to 40 m^2^·W^−1^.
    type: intensional
  - content: The global UV index has unit one.
    type: intensional
  - content: This entry was numbered 17-498 in CIE S 017:2011.
    type: intensional
