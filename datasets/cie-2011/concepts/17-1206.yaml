data:
  definition:
  - content: property of a quantity, stem:[X], pertaining to electromagnetic radiation that indicates that the quantity referred to is the spectral distribution of stem:[X]
    type: intensional
  examples: []
  notes:
  - content: In the latter case, in French, "spectrique" is preferred to "spectral".
    type: intensional
  - content: stem:[X]~stem:[λ]~ is also a function of stem:[λ] and in order to stress this, may be written stem:[X]~stem:[λ]~(stem:[λ]) without any change of meaning.
    type: intensional
  - content: The quantity stem:[X] can also be expressed as a function of frequency stem:[ν], wave number stem:[σ], etc.; the corresponding symbols are stem:[X](stem:[ν]), stem:[X](stem:[sigma]), etc. and stem:[X]~stem:[ν]~, stem:[X_σ], etc.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
