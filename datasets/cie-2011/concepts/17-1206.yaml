data:
  definition:
  - content: property of a quantity, stem:[X], pertaining to electromagnetic radiation
      that indicates that the quantity referred to is the spectral distribution of
      stem:[X]
    type: intensional
  examples: []
  notes:
  - content: In the latter case, in French, "spectrique" is preferred to "spectral".
    type: intensional
  - content: stem:[X_(stem:[lambda])] is also a function of stem:[lambda] and in order
      to stress this, may be written stem:[X_(stem:[lambda])](stem:[lambda]) without
      any change of meaning.
    type: intensional
  - content: The quantity stem:[X] can also be expressed as a function of frequency
      stem:[nu], wave number stem:[sigma], etc.; the corresponding symbols are stem:[X](stem:[nu]),
      stem:[X](σ), etc. and stem:[X_(stem:[nu])], stem:[X_(sigma)], etc.
    type: intensional
  sources:
