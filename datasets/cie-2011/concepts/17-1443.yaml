data:
  definition:
  - content: reference surface defined as the plane at which work is usually done
    type: intensional
  examples: []
  notes:
  - content: In interior lighting and unless otherwise indicated, this plane is assumed
      to be a horizontal plane 0,85 m above the floor and limited by the walls of
      the room. In the US the working plane is usually assumed to be 0,76 m above
      the floor, in Russia 0,8 m above the floor.
