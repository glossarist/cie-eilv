data:
  definition:
  - content: ideal thermal radiator that absorbs completely all incident radiation,
      whatever the wavelength, the direction of incidence or the polarization
    type: intensional
  examples: []
  notes:
  - content: This radiator has, for any wavelength and any direction, the maximum
      spectral concentration of radiance for a thermal radiator in thermal equilibrium
      at a given temperature.
    type: intensional
