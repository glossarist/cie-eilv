data:
  definition:
  - content: illuminance produced by direct sunlight on a surface on the Earth that
      is perpendicular to the direction of illumination by the Sun
    type: intensional
  examples: []
  notes:
  - content: This is not the same as direct solar illuminance, which is measured on
      a horizontal surface on the Earth, not necessarily perpendicular to the direction
      of illumination by the Sun.
    type: intensional
