data:
  definition:
  - content: colour space encoding used to connect the source and destination transforms
      (from the source and destination profiles) in the International Color Consortium
      (ICC) colour management architecture
    type: intensional
  examples: []
  notes:
  - content: |-
      The ICC.1:2001 specification defines 2 variations of the PCS: a general PCS for colorimetric intent transforms, and an output-referred PCS for perceptual intent transforms.
      Abbreviation: "ICC PCS"
    type: intensional
