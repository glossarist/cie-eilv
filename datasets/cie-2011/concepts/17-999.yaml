data:
  definition:
  - content: specification of a colour stimulus in terms of operationally defined
      values, such as the tristimulus values
    type: intensional
  examples: []
  notes:
  - content: When the meaning is clear from the context the term "colour" can be used
      alone.
    type: intensional
  - content: |-
      In German, "Farbe" is often used instead of "Farbempfindung". The use of "Farbe" in the sense of "Farbvalenz" should be avoided. It is only when the sense is obvious from the context, or when "Farbempfindung" and "Farbvalenz" are equally suitable, that "Farbe" may be used in the sense of "Farbvalenz".
      See also "{{concept:cie-2011:17-197, colour}}"
    type: intensional
  sources:
