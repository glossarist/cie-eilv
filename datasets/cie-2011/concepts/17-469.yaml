data:
  definition:
  - content: irradiation of reflecting materials at 45° to the normal, from all azimuthal directions, simultaneously
    type: intensional
  examples: []
  notes:
  - content: 'In measuring the colours of reflecting samples by irradiating with this geometry, the effects of texture and directionality are minimized. This irradiation (influx) geometry may be achieved by the use of a small source and an elliptic ring reflector or other aspheric optics. This geometry is sometimes approximated by the use of a number of light sources in a ring or a number of fibre bundles illuminated by a single source and terminated in a ring. Such an approximation to annular geometry is called circumferential geometry, symbol "45°a".

      See also CIE 15 stem:[Colorimetry](section 5)'
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: forty-five degree annular (45°a) geometry
  - type: expression
    normative_status: preferred
    designation: 45°a geometry
