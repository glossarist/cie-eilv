data:
  definition:
  - content: "difference between two colour stimuli, defined as the Euclidean distance
      between the points representing them in the CIE 1976 L*u*v* colour space and
      calculated as:\r\n<ul style=\"list-style-type:none;\">* stem:[Delta E_(uv)^*
      = ( Delta L_()^* )^2 + ( Delta u_()^* )^2 + ( Delta v_()^* )^2^(1 // 2)]"
