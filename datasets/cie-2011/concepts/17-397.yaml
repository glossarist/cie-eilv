data:
  definition:
  - content: luminance of a comparison field in which radiation of {{bib:103-06-02,
      frequency}} 540 × 10^12^ Hz has the same brightness as the field considered
      under the specified photometric conditions of measurement, where the comparison
      field must have a specified size and shape which can be different from that
      of the field considered
    type: intensional
  examples: []
  notes:
  - content: Radiation at a frequency of 540×10^12^ Hz has a wavelength in standard
      air of 555,016 nm.
    type: intensional
  - content: A comparison field may also be used in which the radiation has any relative
      spectral distribution, if the equivalent luminance of this field is known under
      the same conditions of measurement.
    type: intensional
