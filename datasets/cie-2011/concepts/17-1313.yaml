data:
  definition:
  - content: smallest illuminance (point brilliance), produced at the eye of an observer by a light source seen in point vision, which renders the source perceptible against a background of given luminance, where the illuminance is considered on a surface element that is normal to the incident rays at the eye
    type: intensional
  examples: []
  notes:
  - content: For visual signalling, the light source must be rendered recognizable, and hence a higher threshold of illuminance is to be expected.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: threshold of illuminance
  - type: expression
    normative_status: preferred
    designation: visual threshold, <in point vision>
  - type: expression
    normative_status: admitted
    designation: visual threshold
