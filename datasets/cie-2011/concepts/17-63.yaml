data:
  definition:
  - content: illuminance averaged over a specified surface
    type: intensional
  examples: []
  notes:
  - content: In practice, this may be approximated by an average of the illuminance
      at a representative number of points on the surface. The number and positions
      of these points should be specified in the relevant application guide.
    type: intensional
  - content: The specification must include a clear indication of the type of illuminance
      at the points of the surface, i.e. horizontal, vertical, spherical, cylindrical
      or semi-cylindrical.
    type: intensional
