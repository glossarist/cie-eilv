data:
  definition:
  - content: first part of the open road directly after the exit portal of a road
      tunnel
    type: intensional
  examples: []
  notes:
  - content: The parting zone is not a part of the tunnel, but it is closely related
      to the tunnel lighting. The parting zone begins at the exit portal. It is advised
      that the length of the parting zone is equal to 2 times the stopping distance.
      A length of more than 200 m is not necessary.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
