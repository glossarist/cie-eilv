data:
  definition:
  - content: radiation characterized by a single {{cite:103-06-02, frequency}} or
      a single wavelength
    type: intensional
  examples: []
  notes:
  - content: In practice, radiation of a very small range of frequencies which can
      be described by stating a single frequency.
    type: intensional
  - content: The wavelength in air or in vacuum is also used to characterize a monochromatic
      radiation. The medium must be stated.
    type: intensional
  - content: The wavelength in standard air is normally used in photometry and radiometry.
      See also "{{17-1426, wavelength}}".
    type: intensional
