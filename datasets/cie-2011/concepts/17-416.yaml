data:
  definition:
  - content: maximum level of exposure of a surface, usually the eye or skin, that
      is not expected to result in adverse biological effects
    type: intensional
  examples: []
  notes:
  - content: Exposure limits for human safety of optical radiation, stem:[E_L], are
      normally recommended by ICNIRP.
    type: intensional
  - content: Exposure limits are often based on measures of irradiance (e.g. for the
      skin), but where relevant may also be based on radiance (e.g. the blue light
      hazard of extended sources).
    type: intensional
