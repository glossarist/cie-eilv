data:
  definition:
  - content: reciprocal of the least perceptible luminance contrast, usually expressed as stem:[L]/stem:[Delta L_(th)], where stem:[L] is the average luminance and stem:[Delta L_(th)] is the luminance difference threshold
    type: intensional
  examples: []
  notes:
  - content: The value of stem:[S_c] depends on a number of factors including the luminance, the viewing conditions and the state of adaptation.
