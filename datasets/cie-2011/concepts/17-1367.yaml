data:
  definition:
  - content: radiation for which the wavelengths are shorter than those for visible
      radiation
    type: intensional
  examples: []
  notes:
  - content: |-
      The range between 100 nm and 400 nm is commonly subdivided into UV-A: 315 nm to 400 nm; UV-B: 280 nm to 315 nm; UV-C: 100 nm to 280 nm.
  - content: |-
      A precise border between ultraviolet and visible radiation cannot be defined because visual sensation at wavelengths shorter than 400 nm can be experienced for very high luminance sources.
  - content: |-
      In some fields the ultraviolet spectrum has also been subdivided into "extreme", "far", and "near"; however, the borders necessarily vary with the field of application.
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: ultraviolet radiation
  - type: abbreviation
    normative_status: preferred
    designation: UVR
  language_code: eng
  annotations: []
