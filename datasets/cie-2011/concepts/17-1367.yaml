data:
  definition:
  - content: radiacion cuyas longitudes de onda son mas cortas que los de la radiacion
      visible
    type: intensional
  examples: []
  notes:
  - content: |-
      El rango entre 100 nm y 400 nm generalmente se subdivide en UV-A: 315 nm a 400 nm; UV-B: 280 nm a 315 nm; UV-C: 100 nm a 280 nm.
  - content: |-
      No se puede definir un borde preciso entre "ultravioleta" y "visible" porque hay sensacion visual a longitudes de onda inferiores a 400 nm para fuentes muy luminosas.
  - content: |-
      En algunos ambitos, el espectro ultravioleta tambien se subdivide en "extremo", "lejano" y "cercano"; sin embargo, los bordes necesariamente cambian con el ambito.
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: radiacion ultravioleta
  - type: abbreviation
    normative_status: preferred
    designation: UVR
  language_code: spa
  annotations: []
