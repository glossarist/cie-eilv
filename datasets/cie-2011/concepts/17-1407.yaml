data:
  definition:
  - content: smallest contrast, produced at the eye of an observer by a given object,
      which renders the object perceptible against a given background
    type: intensional
  examples: []
  notes:
  - content: For meteorological observations, the object must be rendered recognizable,
      and hence a higher threshold is to be expected. The value of 0,05 has been adopted
      as the basis for the measurement of meteorological optical range.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: visual contrast threshold
  language_code: eng
  annotations: []
