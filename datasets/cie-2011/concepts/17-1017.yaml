data:
  definition:
  - content: |-
      time integral of the cylindrical irradiance, stem:[E_(e,c)], at a given point for a given direction, over a given duration, stem:[Delta t]

      stem:[H_((e,c)) = underset((Delta t))( int ) E_(e,c) d t]
    type: intensional
  examples: []
  notes:
  - content: The analogous quantities "luminous cylindrical exposure", stem:[H_(v,z)],
      and "photon cylindrical exposure", stem:[H_(p,z)], are defined in a similar
      way, replacing cylindrical irradiance, stem:[E_(e,z)], by cylindrical illuminance,
      stem:[E_(v,z)], or photon cylindrical irradiance, stem:[E_(p,z)].
    type: intensional
  sources:
