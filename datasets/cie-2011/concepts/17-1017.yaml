data:
  definition:
  - content: |-
      time integral of the cylindrical irradiance, stem:[E_(e,c)], at a given point for a given direction, over a given duration, stem:[Delta t]

      stem:[H_((e,c)) = underset((Delta t))( int ) E_(e,c) d t]
    type: intensional
  examples: []
  notes:
  - content: The analogous quantities "luminous cylindrical exposure", <i>H</i><sub>v,z</sub>,
      and "photon cylindrical exposure", <i>H</i><sub>p,z</sub>, are defined in a
      similar way, replacing cylindrical irradiance, <i>E</i><sub>e,z</sub>, by cylindrical
      illuminance, <i>E</i><sub>v,z</sub>, or photon cylindrical irradiance, <i>E</i><sub>p,z</sub>.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: radiant cylindrical exposure (at a point, for a given direction and
      duration)
  - type: symbol
    normative_status: preferred
    designation: He,c; Hc
  - type: symbol
    normative_status: preferred
    designation: "<i>H</i><sub>e,z</sub>"
  language_code: eng
  annotations: []
