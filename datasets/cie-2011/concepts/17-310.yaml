data:
  definition:
  - content: device predominantly using scattering to alter the spatial distribution
      of radiation from a source
    type: intensional
  examples: []
  notes:
  - content: If all the radiation reflected or transmitted by the diffuser is diffused
      with no regular reflection or transmission, the diffuser is said to be completely
      diffusing, independent of whether or not the reflection or transmission is isotropic.
    type: intensional
