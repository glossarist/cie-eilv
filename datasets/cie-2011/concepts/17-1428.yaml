data:
  definition:
  - content: spectral radiance distribution as seen by an image capture or measurement
      device and converted to colour signals that are considered to be perfectly achromatic
      and to have an observer adaptive luminance factor of unity; i.e., colour signals
      that are considered to correspond to a perfect white diffuser
    type: intensional
  examples: []
  notes:
  - content: The adopted white may vary within a scene.
    type: intensional
  - content: No assumptions should be made concerning the relation between the adapted
      or adopted white and measurements of near perfectly reflecting diffusers in
      a scene, because measurements of such diffusers will depend on the illumination
      and viewing geometry, and other elements in the scene that may affect perception.
      It is easy to arrange conditions for which a near perfectly reflecting diffuser
      will appear to be grey or coloured.
    type: intensional
  sources:
