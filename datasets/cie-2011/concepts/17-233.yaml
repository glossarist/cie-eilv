data:
  definition:
  - content: attribute of a visual perception according to which the perceived colour
      of an area appears to be more or less chromatic
    type: intensional
  examples: []
  notes:
  - content: For a colour stimulus of a given chromaticity and, in the case of related
      colours, of a given luminance factor, this attribute usually increases as the
      luminance is raised except when the brightness is very high.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: colourfulness
  language_code: eng
