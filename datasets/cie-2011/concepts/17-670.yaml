data:
  definition:
  - content: |-
      exposure of the human eye to visible radiation for the treatment of affective disorders or disorders due to circadian disruption

      EXAMPLE<ol type="a">. for affective disorders: seasonal affective disorder or winter depression;. for disorders due to circadian disruption: advanced phase sleep disorder, circadian desynchronization related to shift work or jet travel.
