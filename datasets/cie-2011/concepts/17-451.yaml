data:
  definition:
  - content: quotient of the sum of the areas of the floor and the working plane and the sum of the area of the walls bounded by the floor and the working plane, used in the calculation of the utilization factor or utilance
    type: intensional
  examples: []
  notes:
  - content: 'The floor cavity index is given by the formula


      stem:[K_f = ((a b))/((h_f ( a + b )))]


      where stem:[a] and stem:[b] are the dimensions of the sides of the room and stem:[h_f] is the distance from the floor to the utilization plane.'
    type: intensional
  - content: See also "ceiling cavity index" and "{{17-1121, room index}}".
    type: intensional
  - content: The floor cavity index has unit one.
    type: intensional
  - content: This entry was numbered 17-451 in CIE S 017:2011.
    type: intensional
