data:
  definition:
  - content: 'relation between the radiant exitance, stem:[M_e], of a Planckian radiator and its temperature, stem:[T], given by


      stem:[M_e] = stem:[sigma] stem:[T^4]


      where stem:[sigma] is the Stefan-Boltzmann constant and stem:[T] is the thermodynamic temperature'
    type: intensional
  examples: []
  notes:
  - content: 'For the value of the Stefan-Boltzmann constant, stem:[sigma], see CODATA.

      See "{{17-958, Planck''s law}}" for the meaning of the symbols'
    type: intensional
  sources:
