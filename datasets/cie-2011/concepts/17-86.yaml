data:
  definition:
  - content: change in hue produced by changing the luminance (within the range of
      photopic vision) of a colour stimulus while keeping its chromaticity constant
    type: intensional
  examples: []
  notes:
  - content: With certain monochromatic stimuli, hue remains constant over a wide
      range of luminances (for a given condition of adaptation). The wavelengths of
      these stimuli are sometimes referred to as "invariant wavelengths".
    type: intensional
  - content: With increasing intensity, below 500 nm hues shift more toward blue,
      and above 500 nm hues shift more toward yellow (reds become yellower with increasing
      brightness).
    type: intensional
