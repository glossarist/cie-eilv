  terms:
  - type: expression
    normative_status: preferred
    designation: reflectance factor (at a surface element, for the part of the reflected
      radiation contained in a given cone with apex at the surface element, and for
      incident radiation of given spectral composition, polarisation and geometric
      distribution)
  - type: symbol
    normative_status: preferred
    designation: R
  - type: symbol
    normative_status: preferred
