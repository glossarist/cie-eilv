data:
  definition:
  - content: action of making a colour stimulus appear the same in colour as a given
      colour stimulus
    type: intensional
  examples: []
  notes:
  - content: The French term applies mainly to the adjustment of equality of the fields
      of a visual colorimeter, whereas the English and German terms apply equally
      well to the selection of 2 material specimens having the same colour under a
      given illuminant.
    type: intensional
