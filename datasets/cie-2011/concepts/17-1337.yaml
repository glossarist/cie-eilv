data:
  definition:
  - content: |-
      quotient of transmitted radiant flux, stem:[Phi_t], and incident radiant flux, stem:[Phi_m]

      stem:[tau = ((Phi_t))/((Phi_m))]
    type: intensional
  examples: []
  notes:
  - content: 'Transmittance, stem:[tau], is the sum of regular transmittance, stem:[tau_r],
      and diffuse transmittance, stem:[tau_d]: stem:[tau] = stem:[tau_r] + stem:[tau_d].'
    type: intensional
