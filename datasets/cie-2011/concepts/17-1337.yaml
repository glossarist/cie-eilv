data:
  definition:
  - content: |-
      quotient of transmitted radiant flux, stem:[Phi_t], and incident radiant flux, stem:[Phi_m]

      stem:[tau = ((Phi_t))/((Phi_m))]
    type: intensional
  examples: []
  notes:
  - content: 'Transmittance, <i>τ</i>, is the sum of regular transmittance, <i>τ</i><sub>r</sub>,
      and diffuse transmittance, <i>τ</i><sub>d</sub>: <i>τ</i> = <i>τ</i><sub>r</sub>
      + <i>τ</i><sub>d</sub>.'
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
