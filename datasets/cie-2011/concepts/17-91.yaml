data:
  definition:
  - content: quotient of the radiance per unit emission bandpass, dstem:[lambda], at a specified emission wavelength, stem:[lambda], due to photoluminescence from the specimen when irradiated at a specified excitation wavelength, stem:[mu], and the radiance of the perfect reflecting diffuser identically irradiated and viewed
    type: intensional
  examples: []
  notes:
  - content: Spectral quantities with a subscript stem:[λ] in their designation indicate differential spectral radiometric quantities.
    type: intensional
  - content: When integrated or summed over the spectral bandpass of the instrument, this quantity becomes the bandpass-weighted bispectral luminescent radiance factor, stem:[β_L,]~stem:[lambda]~(stem:[μ])∆stem:[λ].
    type: intensional
  - content: The tabular form of complete bispectral luminescent radiance factor and reflected radiance factor data is the Donaldson matrix representation of bispectral radiance factor, stem:[D](stem:[μ, λ]). The excitation wavelengths, stem:[μ], are tabulated in the vertical direction, the emission wavelengths, stem:[λ], in the horizontal direction, the reflected radiance factors, stem:[β_R](stem:[λ]), appear on the diagonal where the excitation and emission (detection) wavelengths are equal, and the array of bandpass-weighted bispectral luminescent radiance factor data, stem:[β_L,]~stem:[lambda]~(stem:[μ])∆stem:[λ], appear on the off-diagonals.
    type: intensional
  sources:
