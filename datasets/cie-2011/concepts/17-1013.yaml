data:
  definition:
  - content: 'quotient of the radiance at a surface element of a medium in a given direction and the irradiance on the medium


      stem:[q_e = (L_e)/(E_e)]


      where stem:[L_e] is radiance and stem:[E_e] is irradiance'
    type: intensional
  examples: []
  notes:
  - content: The {{concept:cie-2011:17-87, bi-directional reflectance distribution function (at a surface element of a medium, in a given direction, for a given direction of irradiation)}} (BRDF) is similar to the above coefficient except that it is defined for directional incident radiation.
    type: intensional
  sources:
