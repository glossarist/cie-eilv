data:
  definition:
  - content: |-
      law relating the illuminance, stem:[E_v], produced on a surface (which is normal to the direction of the light source and sufficiently distant for the light source to be considered as a point source) by a light source to the luminous intensity, stem:[I_v], of the light source in the direction of the surface, to the distance, stem:[d], between the surface and the light source, and to the atmospheric transmissivity, stem:[T], which is assumed to be uniform

      stem:[E_v = ((I_v))/((d^2)) T^(d // d_0)]

      where stem:[d_0] is the length specified in the definition of stem:[T]
    type: intensional
  examples: []
  notes:
  - content: |-
      The formula in the definition is sometimes written:

      stem:[E_v = ((I_v))/((d^2)) T^(delta)]

      where the exponent, stem:[delta], in stem:[Tdelta] is the numerical value of the distance, stem:[d], measured with stem:[d_0] as "unit".
    type: intensional
  - content: |-
      Taking into account the relationship between atmospheric transmissivity, stem:[T], and meteorological optical range, stem:[v], given in Note 2 to entry of the definition of "meteorological optical range", Allard's law can also be written as:

      stem:[E_v = ((I_v))/((d^2)) ( 0,05^(d // v) )].
    type: intensional
  - content: This entry was numbered 845-11-27 in IEC 60050-845:1987.
    type: intensional
  - content: This entry was numbered 17-34 in CIE S 017:2011.
    type: intensional
