data:
  definition:
  - content: factor describing the protective quality of a sunscreen against solar
      ultraviolet radiation, normally determined by in vivo testing
    type: intensional
  examples: []
  notes:
  - content: |-
      The sun protection factor is determined by comparing the dose of solar simulated ultraviolet radiation required to produce just-perceptible erythema approximately 24 h after exposure in ultraviolet-irradiated human volunteers, with and without a standard amount of the sunscreen being present (<i>F</i><sub>MED,f</sub> and <i>F</i><sub>MED,i</sub>, respectively) and is calculated as follows:
      <i>F</i><sub>SP</sub>= <i>F</i><sub>MED,f</sub> / <i>F</i><sub>MED,i</sub>.
    type: intensional
  - content: |-
      The sun protection factor may also be determined by equivalent in vitro methods.
      Abbreviation: "SPF"
    type: intensional
  sources:
