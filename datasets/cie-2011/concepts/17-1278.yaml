data:
  definition:
  - content: factor describing the protective quality of a sunscreen against solar
      ultraviolet radiation, normally determined by in vivo testing
    type: intensional
  examples: []
  notes:
  - content: |-
      The sun protection factor is determined by comparing the dose of solar simulated ultraviolet radiation required to produce just-perceptible erythema approximately 24 h after exposure in ultraviolet-irradiated human volunteers, with and without a standard amount of the sunscreen being present (stem:[F_(MED,f)] and stem:[F_(MED,i)], respectively) and is calculated as follows:
      stem:[F_(SP)]= stem:[F_(MED,f)] / stem:[F_(MED,i)].
    type: intensional
  - content: |-
      The sun protection factor may also be determined by equivalent in vitro methods.
      Abbreviation: "SPF"
    type: intensional
