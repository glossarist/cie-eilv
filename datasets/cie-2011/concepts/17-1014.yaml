    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: radiance dose (in a given direction, at a given point of a real or
      imaginary surface)
  - type: symbol
    normative_status: preferred
    designation: integrated radiance
  - type: symbol
    normative_status: preferred
    designation: integrated radiance
  - type: expression
    normative_status: admitted
    designation: "(time) integrated radiance"
