data:
  definition:
  - content: 'time integral of radiance, stem:[L_e], over a given duration, stem:[Delta t]


      stem:[L_((e , t)) = underset((Delta t))( int ) L_e d t]'
    type: intensional
  examples: []
  notes:
  - content: The corresponding photometric quantity is "luminance dose". The corresponding quantity for photons is "photon radiance dose".
    type: intensional
  - content: The radiance dose is expressed in joule per square metre per steradian (Jcdotm^-2^cdotsr^-1^).
    type: intensional
  - content: This entry was numbered 17-1014 and 17-1319 in CIE S 017:2011.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: radiance dose (in a given direction, at a given point of a real or imaginary surface)
  - type: expression
    normative_status: preferred
    designation: integrated radiance
  - type: symbol
    normative_status: preferred
    designation: stem:[L_t]
  - type: expression
    normative_status: admitted
    designation: (time) integrated radiance
  language_code: eng
