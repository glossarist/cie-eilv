data:
  definition:
  - content: |-
      1. lamp that is operated with a continuous output

      2. in photobiological safety: lamp operated for a time greater than 0,25 s, i.e., a non-pulsed lamp
    type: intensional
  examples: []
  notes:
  - content: In IEC62471:2006/CIES009:2002 <i>Photobiological safety of lamp and lamp
      systems</i>, general lighting service (GLS) lamps are defined to be continuous
      wave lamps.
    type: intensional
  sources:
  - origin:
