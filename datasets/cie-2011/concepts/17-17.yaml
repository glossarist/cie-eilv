data:
  definition:
  - content: function representing the relative spectral effectiveness of optical radiation, for a specified biological effect, in a specified system
    type: intensional
  examples: []
  notes:
  - content: The normalized action spectrum is the wavelength dependence of the inverse of the dose of monochromatic radiation required to induce a certain (biologic) response; the action spectrum is commonly normalized to a value of 1 at the wavelength of "maximum action", i.e., where the smallest dose suffices to induce the required effect.
    type: intensional
  - content: 'Also referred to as: actinic spectrum.'
    type: intensional
  sources:
