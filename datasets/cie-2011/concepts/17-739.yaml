data:
  definition:
  - content: |-
      density of luminous flux with respect to solid angle in a specified direction

      stem:[I_v = ((d Phi_v))/((d omega))]

      where stem:[Phi_v] is the luminous flux emitted in a specified direction, and stem:[Omega] is the solid angle containing that direction
    type: intensional
  examples: []
  notes:
  - content: The definition holds strictly only for a point source.
    type: intensional
  sources:
