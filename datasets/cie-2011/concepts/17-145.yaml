data:
  definition:
  - content: coordinates expressing the quotients of each of a set of three tristimulus
      values and their sum
    type: intensional
  examples: []
  notes:
  - content: As the sum of the 3 chromaticity coordinates is equal to 1, 2 of them
      are sufficient to define a chromaticity.
    type: intensional
  - content: In the CIE standard colorimetric systems, the chromaticity coordinates
      are represented by the symbols <i>x</i>, <i>y</i>, <i>z</i> and <i>x</i><sub>10</sub>,
      <i>y</i><sub>10</sub>, <i>z</i><sub>10</sub>.
    type: intensional
  sources:
