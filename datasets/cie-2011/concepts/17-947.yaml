data:
  definition:
  - content: change in the direction of growth of plant parts (cells, tissues, and/or
      organs) in response to a directional source of optical radiation
    type: intensional
  examples: []
  notes:
  - content: For example, plant stems will typically bend toward a light source and
      leaves will change orientation such that their upper surfaces tend to be perpendicular
      to a light source.
    type: intensional
  sources:
  - origin:
      ref:
        source: CIE S 017:2011
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: phototropism
  language_code: eng
  annotations: []
