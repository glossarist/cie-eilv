data:
  definition:
  - content: physical, chemical or biological change produced by the interaction of
      optical radiation with matter, characterized by one photon interacting with
      one atom or molecule
    type: intensional
  examples: []
  notes:
  - content: Such changes include photoelectric, photo-optical, photochemical and
      photobiological effects, but radiant heating is normally not considered a photoeffect.
    type: intensional
