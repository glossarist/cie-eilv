data:
  definition:
  - content: angular extent of all the radius vectors of the polar curve of luminous
      intensity in the specified plane having lengths greater than 50 % of the maximum
    type: intensional
  examples: []
  notes:
  - content: Outside US "beam spread" relates to the total angle within which the
      illuminance on a plane normal to the axis of the beam exceeds 10 % of the maximum.
